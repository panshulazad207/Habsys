<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Habsys</title>
<meta name="theme-color" content="#0a0b10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Habsys">
<link rel="manifest" href="manifest.webmanifest?v=199">
<link rel="apple-touch-icon" href="icon-180.png?v=199">
<link rel="icon" type="image/png" href="icon-192.png?v=199">
<style>
/* ===== Habsys 3.0.5: two daily check-ins (morning and evening), Sunday weekly reflection with a history of all past reflections. Everything else as in 3.0.0 ===== */
/* ===== Habsys 3.0.0: Year in pixels, Profile card, full-screen level-up and rank-up moments, premium UI polish. Everything else as in 2.9.9 ===== */
/* ===== Habsys 2.9.9 (bug-fix and speed release, built on 2.9.0): Keep-going cheers for friends, a Next goal card, a graph button with Insights on every habit, and Focus time (a timer). Everything else as in 2.8.0 ===== */
/* ===== Habsys 2.7.0: small XP for daily ticks, badges, streak flame, a stronger level-up moment, Evening wrap-up, habit icons. Everything else as in 2.6.6 ===== */
/* ===== Habsys 2.6.6: each friend row has ONE three-dot button that opens a menu with Make partner / Stop being partners and Remove friend. ===== */
/* ===== Habsys 2.6.0: level-up spotlight at the top of the Friends tab, and a partner goal (pick one friend, see your progress toward their level on the Habits tab). Everything else as in 2.5.0 ===== */
:root{
  color-scheme:dark;
  --bg0:#0a0b10;
  --surface:#15171f; --surface2:#1d202b; --surface3:#272b3a;
  --hair:rgba(255,255,255,.07); --hair2:rgba(255,255,255,.13);
  --blue:#5b8cff; --blue2:#94b2ff; --blue3:#3f5ff0;
  --white:#f4f5f9; --muted:#8d92a6; --dim:#5d6276;
  --line:rgba(255,255,255,.08); --line-strong:rgba(255,255,255,.14);
  --warn:#ff7b8d; --gold:#ffcf6e; --gold2:#ff9f4a;
  --ac:#5b8cff;               /* accent of the current habit card; every habit gets its own colour */
  --r:26px; --r-sm:16px;
  --ease:cubic-bezier(.22,.8,.24,1);       /* calm deceleration for most movement */
  --spring:cubic-bezier(.3,1.35,.5,1);     /* tiny overshoot for taps */
  --head:ui-rounded,"SF Pro Rounded","SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg0);-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100vh;color:var(--white);font-family:var(--body);font-size:16px;line-height:1.4;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  overscroll-behavior-y:none;
}
/* the page glow lives on its own fixed layer: scrolling no longer repaints big gradients (smoother on iPad) */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(1000px 520px at 50% -180px,rgba(91,110,255,.26),transparent 70%),
    radial-gradient(640px 460px at 100% 38%,rgba(150,90,255,.07),transparent 70%),
    radial-gradient(560px 420px at 0% 78%,rgba(60,120,255,.05),transparent 70%),
    linear-gradient(180deg,#0d0f16 0%,#0a0b10 100%);
  transform:translateZ(0)}
button,input,textarea{font:inherit;color:inherit;touch-action:manipulation}
button{cursor:pointer;border:0;background:none;padding:0}
input,textarea{-webkit-user-select:text;user-select:text;caret-color:var(--blue2)}
button:focus-visible,.input:focus-visible{outline:2px solid var(--blue2);outline-offset:3px}

#app{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) 18px calc(env(safe-area-inset-bottom) + 120px)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 4px 24px}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:36px;height:36px;filter:drop-shadow(0 4px 14px rgba(91,140,255,.5))}
.brand b{font-family:var(--head);font-weight:800;font-size:27px;letter-spacing:-.02em;color:var(--white)}
.top .date{font-family:var(--body);font-weight:600;font-size:11px;line-height:1.35;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;text-align:center;padding:8px 14px;border-radius:15px;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));border:1px solid var(--hair);box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}

/* cards */
.panel{
  position:relative;border:1px solid var(--hair);border-radius:var(--r);
  background:linear-gradient(180deg,rgba(255,255,255,.032),rgba(255,255,255,0) 45%),var(--surface);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.045),0 1px 2px rgba(0,0,0,.3),0 18px 36px -20px rgba(0,0,0,.8);
  padding:20px;min-width:0;
}
.tag{font-family:var(--body);font-weight:600;font-size:12px;letter-spacing:.01em;color:var(--muted)}
h2.sec{font-family:var(--head);font-size:25px;letter-spacing:-.02em;color:var(--white);margin:38px 4px 14px;font-weight:800}

/* player: hero card */
.player{display:flex;align-items:center;gap:20px;margin-bottom:18px;padding:24px 22px;overflow:hidden;border-color:rgba(255,255,255,.18);
  background:radial-gradient(130% 150% at 105% -10%,rgba(255,255,255,.28),transparent 48%),radial-gradient(90% 120% at -5% 110%,rgba(30,20,120,.38),transparent 60%),linear-gradient(135deg,#3552ee 0%,#5845ec 55%,#7b40e4 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.32),inset 0 -1px 0 rgba(0,0,0,.12),0 26px 50px -22px rgba(80,80,240,.75)}
.player::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,0) 38%)}
/* a soft light sweep across the hero card whenever a tab opens (moved with transform, not left: no layout work) */
.player::before{content:"";position:absolute;top:-10%;bottom:-10%;left:0;width:38%;pointer-events:none;opacity:0;z-index:1;background:linear-gradient(100deg,transparent,rgba(255,255,255,.24),transparent);transform:translateX(-200%) skewX(-18deg)}
#view.v-in .player::before{animation:sweep 1.4s .4s var(--ease) 1}
@keyframes sweep{0%{transform:translateX(-200%) skewX(-18deg);opacity:1}100%{transform:translateX(400%) skewX(-18deg);opacity:1}}
.rank{width:64px;height:72px;flex:none;display:grid;place-items:center;
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
  background:linear-gradient(160deg,#ffffff 0%,#cfdaff 100%);
  font-family:var(--head);font-weight:800;font-size:32px;color:#3347d4}
.p-info{flex:1;min-width:0}
.p-name{font-family:var(--head);font-weight:800;font-size:24px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.p-sub{font-family:var(--body);font-weight:600;font-size:13px;color:rgba(255,255,255,.76);margin:2px 0 14px}
.bar{height:8px;background:rgba(255,255,255,.09);border-radius:999px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.35)}
.bar i{position:relative;overflow:hidden;display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,color-mix(in srgb,var(--ac) 72%,#000),var(--ac));box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 0 14px -2px color-mix(in srgb,var(--ac) 70%,transparent);transition:width .9s var(--ease)}
.bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.42),transparent);transform:translateX(-100%);animation:shimmer 3.6s ease-in-out infinite}
@keyframes shimmer{0%,55%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.player .bar{background:rgba(255,255,255,.22);box-shadow:inset 0 1px 2px rgba(0,0,0,.18)}
.player .bar i{background:#fff;box-shadow:0 0 14px rgba(255,255,255,.5)}
.player .bar i::after{background:linear-gradient(90deg,transparent,rgba(120,140,255,.45),transparent)}
.xp-txt{font-family:var(--body);font-weight:600;font-size:12.5px;color:rgba(255,255,255,.82);margin-top:9px;font-variant-numeric:tabular-nums}
.sv-line{display:flex;align-items:center;gap:7px;font-family:var(--body);font-weight:600;font-size:12.5px;color:#fff;margin-top:7px}
.sv-line svg{width:14px;height:14px;flex:none}
.p-lv{text-align:center;flex:none}
.p-lv small{display:block;font-family:var(--body);font-weight:700;font-size:11px;letter-spacing:.18em;color:rgba(255,255,255,.7)}
.p-lv b{font-family:var(--head);font-weight:800;font-size:48px;line-height:1.02;font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 4px 18px rgba(20,10,90,.35)}

/* Today ring */
.today{margin-bottom:18px;padding:22px}
.t-top{display:flex;align-items:center;gap:20px}
.ring{position:relative;width:112px;height:112px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);display:block}
.ring circle{fill:none;stroke-width:10}
.ring .rt{stroke:rgba(255,255,255,.09)}
.ring .rp{stroke:var(--blue2);stroke-linecap:round;transition:stroke-dashoffset .9s var(--ease),stroke .4s;filter:drop-shadow(0 0 8px rgba(91,140,255,.55))}
.ring.full .rp{stroke:#25c795;filter:drop-shadow(0 0 10px rgba(37,199,149,.7))}
.ring.full .rc span{color:#6ee7b7}
.ring.celeb{animation:ringpop .85s var(--spring)}
@keyframes ringpop{0%{transform:scale(1)}35%{transform:scale(1.14)}100%{transform:scale(1)}}
.ring .rc{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-family:var(--head);font-weight:800;font-size:28px;font-variant-numeric:tabular-nums;line-height:1}
.ring .rc small{display:block;font-family:var(--body);font-weight:700;font-size:9.5px;letter-spacing:.16em;color:var(--muted);margin-top:6px}
.t-msg{min-width:0}
.t-msg h3{margin:0 0 5px;font-family:var(--head);font-weight:800;font-size:21px;letter-spacing:-.015em}
.t-msg p{margin:0;font-size:14px;line-height:1.45;color:var(--muted)}
.t-focus{margin-top:10px;padding-left:12px;border-left:2px solid var(--blue);font-size:13.5px;line-height:1.4;color:var(--white);overflow-wrap:anywhere}
.t-focus b{display:block;font-family:var(--body);font-weight:700;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--blue2);margin-bottom:2px}
.t-list{display:grid;gap:8px;margin-top:18px;padding-top:16px;border-top:1px solid var(--hair)}
.t-row{display:flex;align-items:center;gap:14px;width:100%;min-height:58px;padding:8px 14px 8px 12px;border-radius:18px;background:var(--surface2);border:1px solid var(--hair);text-align:left;transition:transform .22s var(--spring),background .25s}
.t-row:active{transform:scale(.98)}
.t-dot{position:relative;width:30px;height:30px;flex:none;border-radius:50%;border:2px solid var(--ac);display:grid;place-items:center;color:#fff;transition:background .3s,box-shadow .3s}
.t-row.on .t-dot{background:var(--ac);box-shadow:0 6px 12px -6px var(--ac)}
.t-dot .ck{width:58%;height:58%}
.t-txt{flex:1;min-width:0;display:grid}
.t-txt b{font-family:var(--head);font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-row.on .t-txt b{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(255,255,255,.25)}
.t-txt small{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-txt small.nm{color:var(--gold);font-weight:600}
.t-st{flex:none;text-align:right;font-family:var(--head);font-weight:800;font-size:19px;font-variant-numeric:tabular-nums}
.t-st small{display:block;font-family:var(--body);font-weight:700;font-size:9px;letter-spacing:.14em;color:var(--muted)}

/* backup / reminder banner */
.banner{display:flex;align-items:center;gap:14px;margin-bottom:18px;padding:14px 16px;border-radius:22px;border-color:rgba(255,207,110,.28);background:linear-gradient(135deg,rgba(255,207,110,.11),rgba(255,159,74,.05)),var(--surface)}
.banner p{margin:0;flex:1;font-size:14px;line-height:1.45;color:var(--white)}
.banner .tag{color:var(--gold);font-weight:700;font-size:12px}
.banner.ref{border-color:rgba(148,178,255,.3);background:linear-gradient(135deg,rgba(91,140,255,.14),rgba(123,64,228,.06)),var(--surface)}
.banner.ref .tag{color:var(--blue2)}

/* habits */
.habits{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
.habits>.habit:nth-child(10n+1){--ac:#5b8cff}
.habits>.habit:nth-child(10n+2){--ac:#ff6b5e}
.habits>.habit:nth-child(10n+3){--ac:#25c795}
.habits>.habit:nth-child(10n+4){--ac:#f5a524}
.habits>.habit:nth-child(10n+5){--ac:#a46bff}
.habits>.habit:nth-child(10n+6){--ac:#3db8f5}
.habits>.habit:nth-child(10n+7){--ac:#ff5f9e}
.habits>.habit:nth-child(10n+8){--ac:#84cc3b}
.habits>.habit:nth-child(10n+9){--ac:#ff8a3d}
.habits>.habit:nth-child(10n+10){--ac:#1fc3bc}
/* each habit card is a column: the quest block always sits at the bottom, so cards side by side line up */
.habit{--blue2:var(--ac);display:flex;flex-direction:column;padding:22px 22px 20px;border-radius:30px;
  background:radial-gradient(120% 70% at 0% 0%,color-mix(in srgb,var(--ac) 9%,transparent),transparent 60%),linear-gradient(180deg,rgba(255,255,255,.032),rgba(255,255,255,0) 45%),var(--surface)}
.habit>:nth-last-child(2){margin-bottom:18px}
.h-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
.h-name{font-family:var(--head);font-weight:800;font-size:20px;letter-spacing:-.015em;text-align:left;color:var(--white);min-height:44px;padding:0;display:flex;align-items:center;gap:12px;min-width:0;flex:1;transition:opacity .2s}
.h-name:active{opacity:.7}
.h-name::before{content:"";flex:none;width:11px;height:11px;border-radius:50%;background:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 22%,transparent),0 0 14px color-mix(in srgb,var(--ac) 55%,transparent)}
.h-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.h-name svg{width:13px;height:13px;flex:none;opacity:.32}
.h-more{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:50%;background:var(--surface2);border:1px solid var(--hair);color:var(--muted);transition:background .2s,color .2s,transform .2s var(--spring)}
.h-more svg{width:19px;height:19px;fill:currentColor}
.h-more:active{background:var(--surface3);color:var(--white);transform:scale(.9)}
.streak{text-align:right;flex:none;padding-left:4px;min-width:50px}
.streak small{display:block;font-family:var(--body);font-weight:700;font-size:9.5px;letter-spacing:.16em;color:var(--muted)}
.streak b{display:inline-block;font-family:var(--head);font-weight:800;font-size:36px;line-height:1.02;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--white);transform-origin:100% 60%}
.streak b.bump{animation:bump .65s var(--spring)}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.38);color:var(--ac)}100%{transform:scale(1)}}
/* optional extras (identity, days, 2-minute version, note): only drawn when the habit has them */
.extras{display:grid;gap:10px;margin:-4px 0 18px}
.x-line{display:flex;align-items:baseline;gap:10px;font-size:14px;color:var(--white)}
.x-line span:last-child{min-width:0;overflow-wrap:anywhere}
.x-tag{flex:none;font-family:var(--body);font-weight:700;font-size:10px;letter-spacing:.08em;color:var(--ac);text-transform:uppercase;background:color-mix(in srgb,var(--ac) 15%,transparent);border:1px solid color-mix(in srgb,var(--ac) 22%,transparent);border-radius:8px;padding:3px 9px}
.x-note{margin:0;font-size:14px;line-height:1.45;color:var(--muted);padding-left:12px;border-left:2px solid color-mix(in srgb,var(--ac) 65%,transparent);overflow-wrap:anywhere;white-space:pre-wrap}
/* never miss twice */
.nmt{margin:-2px 0 16px;padding:12px 14px;border-radius:16px;border:1px solid rgba(255,207,110,.3);background:rgba(255,207,110,.08);font-size:13.5px;line-height:1.45;color:var(--white);overflow-wrap:anywhere}
.nmt b{display:block;font-family:var(--body);font-weight:700;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-bottom:3px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.rest{margin-top:16px;padding:12px;border:1px dashed var(--hair2);border-radius:var(--r-sm);text-align:center;font-family:var(--body);font-weight:600;font-size:13px;color:var(--muted);background:rgba(255,255,255,.02)}
.col{display:flex;flex-direction:column;align-items:center;gap:9px;min-width:0}
.dl{font-family:var(--body);font-weight:600;font-size:11.5px;letter-spacing:.03em;color:var(--muted)}
.box{
  position:relative;width:100%;max-width:62px;aspect-ratio:1/1;margin:0 auto;display:grid;place-items:center;border-radius:50%;
  border:1.5px solid var(--hair2);background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,0)),var(--surface2);color:var(--muted);
  font-family:var(--body);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;
  transition:transform .28s var(--spring),box-shadow .3s var(--ease),background .3s var(--ease),border-color .3s var(--ease),color .3s var(--ease);
}
.week.flex .box{max-width:72px}
.box.pre{opacity:.38}
.box.future{border-style:dashed;opacity:.42}
.box.open{cursor:pointer}
.box.open:active{transform:scale(.88)}
.box:not(.open){cursor:default;pointer-events:none}
.box.today:not(.done){border-color:var(--ac);color:var(--white);background:color-mix(in srgb,var(--ac) 14%,var(--surface2))}
/* the soft pulse is a ring that fades (opacity only): it no longer repaints the card every frame */
.box.today:not(.done)::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;box-shadow:0 0 0 6px color-mix(in srgb,var(--ac) 20%,transparent);opacity:0;animation:pulse 2.8s ease-in-out infinite}
.box.done{
  background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 62%),var(--ac);
  border-color:transparent;color:#fff;
  box-shadow:0 10px 18px -8px color-mix(in srgb,var(--ac) 85%,transparent),inset 0 1px 0 rgba(255,255,255,.34),inset 0 -2px 4px rgba(0,0,0,.1);
}
.box.saved{background:color-mix(in srgb,var(--ac) 14%,var(--surface2));border-color:color-mix(in srgb,var(--ac) 70%,transparent);color:var(--ac)}
/* FIX 2.2.0: the tick is placed with fixed insets inside the circle, so its size no longer depends on how the browser sizes the grid (it could come out tiny) */
.box .ck{position:absolute;left:25%;top:25%;width:50%;height:50%;filter:drop-shadow(0 1px 1px rgba(0,0,0,.22))}
.box.saved .ck{filter:none}
.box .mb{position:absolute;right:-3px;bottom:-3px;width:18px;height:18px;display:grid;place-items:center;border-radius:50%;background:#fff;color:#14161f;font-family:var(--body);font-weight:800;font-size:10.5px;line-height:1;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.yrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;padding-top:14px;border-top:1px solid var(--hair)}
.yrow .dl{font-size:13px}
.yrow .box{width:46px;height:46px;max-width:none;aspect-ratio:auto;margin:0;flex:none}
/* FIX 2.2.0: the Sunday tick (shown on Mondays in this smaller box) was tiny. It now has the same size as the other days' ticks. */
.yrow .box .ck{left:16%;top:16%;width:68%;height:68%}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:1}}

/* the satisfying tick: the circle pops, the check draws itself, a ring ripples out */
.box.done .ck path,.t-dot .ck path,.cel-ic .ck path{stroke-dasharray:26;stroke-dashoffset:0}
.box.pop,.t-row.pop .t-dot{animation:popbox .6s var(--spring)}
.box.pop::after,.t-row.pop .t-dot::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--ac);pointer-events:none;animation:ringout .7s var(--ease) forwards}
.box.pop .ck path,.t-row.pop .ck path{animation:draw .45s .1s var(--ease) backwards}
.t-row.pop{animation:rowflash .9s ease-out}
@keyframes popbox{0%{transform:scale(.7)}50%{transform:scale(1.22)}75%{transform:scale(.95)}100%{transform:scale(1)}}
@keyframes ringout{from{transform:scale(1);opacity:.95}to{transform:scale(1.8);opacity:0}}
@keyframes draw{from{stroke-dashoffset:26}to{stroke-dashoffset:0}}
@keyframes rowflash{0%{background:color-mix(in srgb,var(--ac) 24%,var(--surface2))}100%{background:var(--surface2)}}

.quest{margin-top:auto;padding-top:17px;border-top:1px solid var(--hair)}
.q-row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:11px}
.q-lbl{font-family:var(--body);font-weight:600;font-size:13px;color:var(--muted)}
.q-val{font-family:var(--body);font-weight:700;font-size:13px;color:var(--white);font-variant-numeric:tabular-nums}
.pips{display:flex;flex-wrap:nowrap;gap:4px;margin-top:15px;align-items:center}
.pip{flex:1;min-width:0;height:6px;border-radius:999px;background:rgba(255,255,255,.09);transition:background .4s var(--ease)}
.pip.on{background:var(--ac);box-shadow:0 0 8px -1px color-mix(in srgb,var(--ac) 60%,transparent)}
.pips span{flex:none;font-family:var(--body);font-weight:600;font-size:11.5px;color:var(--muted);margin-left:8px;white-space:nowrap;font-variant-numeric:tabular-nums}

.add{display:grid;place-items:center;min-height:104px;border-radius:30px;border:1.5px dashed var(--hair2);background:transparent;box-shadow:none;text-align:center;width:100%;color:var(--blue2);font-family:var(--head);font-weight:700;font-size:17px;transition:background .25s var(--ease),transform .25s var(--spring),border-color .25s}
.add:active{transform:scale(.985);background:rgba(255,255,255,.04);border-color:rgba(148,178,255,.4)}
.add small{display:block;font-family:var(--body);font-weight:500;font-size:12.5px;color:var(--muted);margin-top:5px}
.add.full{color:var(--muted);cursor:default}
.empty{text-align:center;padding:32px 22px;margin-bottom:16px}
.empty .tag{display:none}
.empty h3{font-family:var(--head);font-weight:800;font-size:23px;letter-spacing:-.015em;margin:4px 0 10px}
.empty p{margin:0;color:var(--muted);font-size:15px;line-height:1.5}
.empty .stack{margin-top:22px;text-align:left}
.empty p + p{margin-top:12px}

/* arrange habits */
.arrbar{display:flex;justify-content:flex-end;margin:-4px 0 14px}
.arr-list{display:grid;gap:8px;margin-bottom:14px}
.arr-row{display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 8px 8px 16px;border-radius:18px;background:var(--surface2);border:1px solid var(--hair)}
.arr-n{flex:none;width:22px;font-family:var(--head);font-weight:800;font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.arr-dot{flex:none;width:11px;height:11px;border-radius:50%;background:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 22%,transparent)}
.arr-row b{flex:1;min-width:0;font-family:var(--head);font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arr-btn{flex:none;width:46px;height:46px;display:grid;place-items:center;border-radius:14px;background:rgba(255,255,255,.08);color:var(--white);transition:transform .2s var(--spring),background .2s,opacity .2s}
.arr-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.arr-btn:active{transform:scale(.88);background:rgba(255,255,255,.16)}
.arr-btn:disabled{opacity:.25;pointer-events:none}

/* buttons */
.btn{
  position:relative;overflow:hidden;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:10px 22px;border-radius:18px;
  font-family:var(--head);font-weight:700;font-size:16.5px;letter-spacing:0;
  border:0;color:#fff;background:linear-gradient(180deg,#6c97ff 0%,#4a6cf5 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 -1px 0 rgba(0,0,0,.12),0 12px 24px -12px rgba(74,108,245,.95);
  transition:transform .22s var(--spring),filter .2s,background .2s,box-shadow .25s;
}
.btn:active{transform:scale(.97);filter:brightness(.92)}
.btn.ghost{background:rgba(255,255,255,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.05);color:var(--white)}
.btn.danger{background:rgba(255,123,141,.12);box-shadow:none;color:var(--warn)}
.btn.block{display:flex;width:100%}
.btn.sm{min-height:38px;padding:6px 16px;font-size:14px;border-radius:13px}
.btn.claim{width:100%;margin-top:0;background:linear-gradient(180deg,#ffdd85 0%,#ffa94d 100%);color:#3a2300;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 12px 26px -12px rgba(255,166,70,.9);animation:glow 2.6s ease-in-out infinite}
.btn.claim::after{content:"";position:absolute;top:-10%;bottom:-10%;left:0;width:36%;pointer-events:none;background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);transform:translateX(-200%) skewX(-18deg);animation:shine 3.2s 1s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 8px 20px -12px rgba(255,166,70,.5)}50%{box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 12px 30px -8px rgba(255,166,70,1)}}
@keyframes shine{0%{transform:translateX(-200%) skewX(-18deg)}45%,100%{transform:translateX(400%) skewX(-18deg)}}

/* vault + settings */
.ladder{display:grid;gap:12px}
.rung{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;padding:16px 18px}
.rung .lv{width:50px;height:56px;display:grid;place-items:center;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(160deg,#86a6ff,#4a63f0);font-family:var(--head);font-weight:800;font-size:21px;color:#fff}
.rung h4{margin:0;font-family:var(--head);font-weight:800;font-size:17.5px;letter-spacing:-.01em}
.rung .meta{font-family:var(--body);font-weight:600;font-size:12.5px;color:var(--blue2);margin:3px 0 5px}
.rung p{margin:0;font-size:14px;line-height:1.45;color:var(--muted)}
.log{display:grid;gap:12px}
.log-item{padding:18px}
.log-item .row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.log-item h4{margin:0;font-family:var(--head);font-weight:800;font-size:17.5px;letter-spacing:-.01em}
.log-item .meta{font-family:var(--body);font-weight:600;font-size:12.5px;color:var(--blue2);margin-top:4px}
.log-item p{margin:10px 0 14px;font-size:15px;line-height:1.45}
.log-item p.rl{margin:10px 0 0;font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.log-item p.rl b{color:var(--white);font-weight:700}
.enjoyed{color:var(--muted)}
.note{color:var(--muted);font-size:14.5px;line-height:1.5;margin:0 0 14px}
.field{display:block;margin-bottom:16px}
.field span{display:block;font-family:var(--body);font-weight:600;font-size:13px;color:var(--muted);margin-bottom:8px}
.input{width:100%;min-height:52px;padding:12px 16px;border-radius:16px;border:1.5px solid transparent;background:rgba(255,255,255,.07);color:var(--white);font-size:17px;outline:none;transition:border-color .25s var(--ease),box-shadow .25s var(--ease),background .25s var(--ease)}
.input:focus{border-color:var(--blue);background:rgba(255,255,255,.09);box-shadow:0 0 0 4px rgba(91,140,255,.22)}
.input:focus-visible{outline:none}
textarea.input{min-height:104px;resize:none;line-height:1.4}
textarea.input.sm{min-height:76px}
.stack{display:grid;gap:12px}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:15px;padding:13px 0;border-bottom:1px solid var(--hair)}
.kv:last-of-type{border-bottom:0}
.kv span{min-width:0;overflow-wrap:anywhere}
.kv b{font-family:var(--body);font-weight:600;font-size:14px;text-align:right}

/* tab bar: floating glass pill with sliding highlight (2.5.0: five tabs) */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px 16px calc(env(safe-area-inset-bottom) + 10px);background:linear-gradient(180deg,rgba(10,11,16,0),rgba(10,11,16,.92) 55%);pointer-events:none}
.tabs .in{pointer-events:auto;position:relative;max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:6px;border:1px solid var(--hair2);border-radius:30px;background:rgba(26,28,39,.74);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 1px 2px rgba(0,0,0,.3),0 24px 48px -16px rgba(0,0,0,.9);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%)}
.tab-ind{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 36px) / 5);border-radius:24px;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.15),rgba(255,255,255,.08));box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 4px 14px -6px rgba(0,0,0,.5);
  transform:translateX(calc(var(--i,0) * (100% + 6px)));transition:transform .5s cubic-bezier(.28,1.05,.3,1)}
.tab{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px 8px;border-radius:24px;color:var(--muted);font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.01em;transition:color .3s ease,transform .22s var(--spring)}
.tab:active{transform:scale(.93)}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linejoin:round;stroke-linecap:round;transition:stroke .3s ease,fill .3s ease,transform .35s var(--spring)}
.tab.on{color:var(--white)}
.tab.on svg{stroke:#a9c0ff;fill:rgba(148,178,255,.22);transform:translateY(-1px)}
/* while the welcome / recovery screen is showing, there is nothing to navigate to */
.rescuing .tabs{display:none}
.rescuing #app{padding-bottom:calc(env(safe-area-inset-bottom) + 32px)}

/* popups: native-style bottom sheet, with a soft exit */
#overlay{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;padding:12px 12px calc(env(safe-area-inset-bottom) + 12px);background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#overlay.show{display:flex;animation:fadeIn .28s ease}
#overlay.leaving{display:flex;pointer-events:none;animation:fadeOut .2s ease forwards}
#overlay.leaving .win{animation:sheetOut .2s ease-in forwards}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{to{opacity:0}}
.win{width:100%;max-width:520px;margin:auto auto 0;padding:34px 22px 22px;border-radius:34px;border:1px solid var(--hair2);background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,0) 30%),#1a1d28;box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 -10px 60px -10px rgba(0,0,0,.7);animation:sheet .5s cubic-bezier(.16,1,.3,1)}
.win::before{content:"";position:absolute;left:50%;top:10px;width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.24);transform:translateX(-50%)}
@keyframes sheet{from{transform:translateY(80px);opacity:0}to{transform:none;opacity:1}}
@keyframes sheetOut{to{transform:translateY(60px);opacity:0}}
.win .wtag{display:none}
.win h3{font-family:var(--head);font-weight:800;font-size:27px;letter-spacing:-.02em;margin:0 0 4px}
.win .sub{font-family:var(--body);font-weight:600;font-size:14.5px;color:var(--blue2);margin:0 0 18px}
.win p{margin:0 0 14px;color:var(--white);font-size:16px;line-height:1.5}
.win p.small{font-size:14px;color:var(--muted)}
.win .reward{background:rgba(255,255,255,.055);border:1px solid var(--hair);padding:15px 17px;border-radius:20px;margin-bottom:14px;line-height:1.5;overflow-wrap:anywhere}
.win .reward b{display:block;font-family:var(--body);font-weight:700;font-size:12.5px;color:var(--blue2);margin-bottom:4px}
.win .actions{display:grid;gap:10px;margin-top:4px}
.win .actions.two{grid-template-columns:1fr 1fr}
.win .mini{font-family:var(--body);font-weight:700;font-size:13px;color:var(--muted);margin:20px 0 4px}
.win .grp{margin-bottom:14px}
.win .grp .kv:last-child{border-bottom:0}
.win .hint{margin:-6px 0 16px;font-size:13px;line-height:1.45;color:var(--muted)}
.kv.here{color:var(--white)}
.kv.here b{color:var(--blue2)}

/* celebration sheets: glowing hexagon, light sweep, count-up numbers */
.win.cel{text-align:center;overflow:hidden}
.win.cel .reward{text-align:left}
.win.cel .sub{color:var(--gold)}
.cel-hero{position:relative;width:124px;height:136px;margin:0 auto 10px;display:grid;place-items:center}
.cel-hero::before{content:"";position:absolute;inset:-34px;border-radius:50%;background:radial-gradient(circle,rgba(255,207,110,.5),rgba(255,159,74,.18) 45%,transparent 70%);animation:breathe 2.6s ease-in-out infinite}
.cel-hero.lvl::before{background:radial-gradient(circle,rgba(148,178,255,.6),rgba(123,64,228,.22) 45%,transparent 70%)}
@keyframes breathe{0%,100%{transform:scale(.92);opacity:.75}50%{transform:scale(1.12);opacity:1}}
.cel-ic{position:relative;width:88px;height:98px;display:grid;place-items:center;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(160deg,#ffe9a8,#ffb04f 55%,#ff9f4a);color:#3a2300;animation:pop .7s var(--spring)}
.cel-ic.big{width:112px;height:124px;background:linear-gradient(160deg,#c9d8ff,#7f9cff 50%,#6a4be8);color:#fff}
.cel-ic::after{content:"";position:absolute;top:-10%;bottom:-10%;left:0;width:38%;pointer-events:none;background:linear-gradient(100deg,transparent,rgba(255,255,255,.7),transparent);transform:translateX(-200%) skewX(-18deg);animation:shine 1.9s .6s ease-in-out 2}
.cel-ic .ck{width:46%;height:46%}
.cel-ic .num{font-family:var(--head);font-weight:800;font-size:42px;line-height:1;font-variant-numeric:tabular-nums}
.cel-ic.big .num{font-size:54px}
.cel-lbl{font-family:var(--body);font-weight:700;font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.win.cel .xpbox{text-align:center}
.xpg{display:block;font-family:var(--head);font-weight:800;font-size:32px;line-height:1.1;color:var(--white);font-variant-numeric:tabular-nums;margin:0 0 12px}
.xpl{display:flex;justify-content:space-between;gap:10px;font-family:var(--body);font-weight:600;font-size:12.5px;color:var(--muted);margin-top:9px;font-variant-numeric:tabular-nums}
.win.cel .bar{--ac:#ffcf6e}
.win.cel .bar i{transition:width 1s var(--ease)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}

/* effects layer: confetti and sparks are drawn by script (Web Animations) */
.fx{position:fixed;inset:0;z-index:130;pointer-events:none;overflow:hidden}
.fx i{position:absolute;display:block}
.fx i.sp{border-radius:50%}
.fx i.rg{border:2px solid;border-radius:50%;background:none}

/* weekday picker for flexible habits */
.dchips{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:16px}
.dchip{min-height:50px;border:0;border-radius:15px;background:rgba(255,255,255,.07);color:var(--muted);font-family:var(--head);font-weight:700;font-size:13px;transition:background .25s var(--ease),color .25s,box-shadow .25s,transform .22s var(--spring)}
.dchip:active{transform:scale(.92)}
.dchip.on{color:#fff;background:linear-gradient(180deg,#6c97ff,#4a6cf5);box-shadow:0 8px 16px -8px rgba(74,108,245,.9),inset 0 1px 0 rgba(255,255,255,.28)}

/* 2.4.0: habit type chooser in the New habit pop-up (Regular habit / Daily task) and the task line on a Daily task card */
.tpick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.tchip{min-height:52px;border:0;border-radius:15px;background:rgba(255,255,255,.07);color:var(--muted);font-family:var(--head);font-weight:700;font-size:15px;transition:background .25s var(--ease),color .25s,box-shadow .25s,transform .22s var(--spring)}
.tchip:active{transform:scale(.96)}
.tchip.on{color:#fff;background:linear-gradient(180deg,#6c97ff,#4a6cf5);box-shadow:0 8px 16px -8px rgba(74,108,245,.9),inset 0 1px 0 rgba(255,255,255,.28)}
.x-task{width:100%;text-align:left;padding:0;min-height:32px}
.x-task.empty span:last-child{color:var(--gold);font-weight:600}

/* NEW 2.5.0: Friends tab. A big friend code, two buttons, an add box and a leaderboard of hexagon rank, name and level. */
.fcode{display:block;margin:4px 0 16px;font-family:var(--head);font-weight:800;font-size:34px;letter-spacing:.12em;color:var(--white);text-align:center;font-variant-numeric:tabular-nums;-webkit-user-select:text;user-select:text}
.fbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.flist{display:grid;gap:8px}
.frow{display:flex;align-items:center;gap:14px;min-height:66px;padding:10px 12px 10px 14px;border-radius:20px;background:var(--surface2);border:1px solid var(--hair)}
.frow.me{border-color:rgba(148,178,255,.35);background:linear-gradient(135deg,rgba(91,140,255,.14),rgba(123,64,228,.06)),var(--surface2)}
.f-rk{width:44px;height:50px;flex:none;display:grid;place-items:center;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(160deg,#86a6ff,#4a63f0);font-family:var(--head);font-weight:800;font-size:20px;color:#fff}
.f-nm{flex:1;min-width:0;display:grid}
.f-nm b{font-family:var(--head);font-weight:700;font-size:16.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.f-nm small{font-size:12.5px;color:var(--muted)}
.f-lv{flex:none;text-align:right;font-family:var(--head);font-weight:800;font-size:24px;line-height:1.05;font-variant-numeric:tabular-nums}
.f-lv small{display:block;font-family:var(--body);font-weight:700;font-size:9px;letter-spacing:.14em;color:var(--muted)}
.f-x{flex:none;width:40px;height:40px;display:grid;place-items:center;border-radius:50%;color:var(--muted);background:rgba(255,255,255,.06);transition:transform .2s var(--spring),background .2s}
.f-x svg{width:17px;height:17px}
.f-x:active{transform:scale(.9);background:rgba(255,255,255,.14)}
.fstat{margin:14px 4px 0;font-size:13px;line-height:1.45;color:var(--muted)}
.fstat.bad{color:var(--warn)}

/* NEW 2.6.0: level-up spotlight (top of the Friends tab), the partner star on a friend row, and the partner goal card on the Habits tab. */
.spot{margin-bottom:18px;padding:8px 12px 6px;border-radius:24px;border-color:rgba(255,207,110,.32);background:linear-gradient(135deg,rgba(255,207,110,.13),rgba(255,159,74,.05)),var(--surface)}
.spot-h{display:block;margin:8px 4px 2px;font-family:var(--body);font-weight:700;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.spot-row{display:flex;align-items:center;gap:14px;min-height:62px;padding:8px 0}
.spot-row + .spot-row{border-top:1px solid var(--hair)}
.spot-ic{flex:none;width:40px;height:46px;display:grid;place-items:center;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(160deg,#ffe9a8,#ffb04f 55%,#ff9f4a);color:#3a2300}
.spot-ic svg{width:20px;height:20px}
.spot-t{flex:1;min-width:0;display:grid}
.spot-t b{font-family:var(--head);font-weight:800;font-size:17px;letter-spacing:-.01em;overflow-wrap:anywhere}
.spot-t small{font-size:12.5px;font-weight:600;color:var(--gold)}
.spot-more{margin:2px 4px 8px;font-size:12.5px;color:var(--muted)}
.f-m svg{width:19px;height:19px;fill:currentColor}
.f-p{flex:none;width:40px;height:40px;display:grid;place-items:center;border-radius:50%;color:var(--muted);background:rgba(255,255,255,.06);transition:transform .2s var(--spring),background .2s,color .2s}
.f-p svg{width:19px;height:19px}
.f-p:active{transform:scale(.9)}
.f-p.on{color:#3a2300;background:linear-gradient(180deg,#ffdd85,#ffa94d)}
.f-p.on svg{fill:currentColor}
.frow.pt{border-color:rgba(255,207,110,.32)}
.partner{display:block;width:100%;margin-bottom:18px;padding:16px 18px 18px;border-radius:24px;text-align:left;border-color:rgba(255,207,110,.28);background:linear-gradient(135deg,rgba(255,207,110,.1),rgba(255,159,74,.04)),var(--surface);transition:transform .22s var(--spring)}
.partner:active{transform:scale(.985)}
.partner .tag{display:block;margin-bottom:3px;font-weight:700;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.pt-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:11px}
.pt-h b{min-width:0;font-family:var(--head);font-weight:800;font-size:19px;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pt-h span{flex:none;font-family:var(--head);font-weight:800;font-size:14px;color:var(--gold);font-variant-numeric:tabular-nums}
.pt-s{display:block;margin:10px 0 0;font-size:13.5px;line-height:1.4;color:var(--muted)}
.pt-s b{color:var(--white);font-weight:700}

#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 108px);transform:translateX(-50%) translateY(18px) scale(.97);z-index:90;opacity:0;pointer-events:none;transition:opacity .3s var(--ease),transform .4s var(--spring);max-width:calc(100% - 32px)}
#toast.show{opacity:1;transform:translateX(-50%)}
#toast div{padding:12px 20px;border:1px solid var(--hair2);background:rgba(36,39,53,.92);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);border-radius:999px;font-family:var(--body);font-weight:600;font-size:14px;text-align:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 16px 36px -10px rgba(0,0,0,.85)}

/* smooth switching between tabs; cards rise in one after another */
#view{transition:opacity .13s ease,transform .13s ease}
#view.v-out{opacity:0;transform:translateX(calc(var(--dx,0px) * -1))}
#view.v-in{animation:viewIn .42s var(--ease) backwards}
@keyframes viewIn{from{opacity:0;transform:translateX(var(--dx,0px)) scale(.992)}to{opacity:1;transform:none}}
#view.v-in .today,#view.v-in .habit{animation:rise .65s var(--ease) backwards}
#view.v-in .today{animation-delay:.05s}
#view.v-in .habits>.habit:nth-child(1){animation-delay:.1s}
#view.v-in .habits>.habit:nth-child(2){animation-delay:.16s}
#view.v-in .habits>.habit:nth-child(3){animation-delay:.22s}
#view.v-in .habits>.habit:nth-child(4){animation-delay:.28s}
#view.v-in .habits>.habit:nth-child(n+5){animation-delay:.34s}
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}

/* streak savers */
.sv-row{display:flex;align-items:center;gap:16px}
.sv-n{width:62px;height:70px;flex:none;display:grid;place-items:center;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(160deg,#86a6ff,#4a63f0);font-family:var(--head);font-weight:800;font-size:30px;color:#fff}
.sv-row h4{margin:0 0 3px;font-family:var(--head);font-weight:800;font-size:18px;letter-spacing:-.01em}
.sv-row p{margin:0;color:var(--muted);font-size:14px;line-height:1.45}

/* records */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{min-height:42px;max-width:100%;padding:8px 18px;border:1px solid var(--hair);border-radius:999px;background:var(--surface);color:var(--muted);font-family:var(--head);font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .3s var(--ease),border-color .3s,color .3s,transform .22s var(--spring)}
.chip:active{transform:scale(.95)}
.chip.on{color:#10121a;border-color:transparent;background:#f4f5f9;box-shadow:0 8px 20px -10px rgba(244,245,249,.5)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{padding:15px 16px;border-radius:20px;background:var(--surface2);border:1px solid var(--hair);min-width:0}
.stat small{display:block;font-family:var(--body);font-weight:600;font-size:12.5px;color:var(--muted);margin-bottom:5px}
.stat b{display:block;font-family:var(--head);font-weight:800;font-size:27px;line-height:1.15;letter-spacing:-.015em;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.stat b.sm{font-size:18px;padding-top:6px}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-family:var(--body);font-weight:500;font-size:12.5px;color:var(--muted);margin:0 4px 14px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:12px;height:12px;border-radius:50%;display:inline-block}
.legend i.lgl{background:radial-gradient(circle at 74% 74%,#fff 0 2px,transparent 2.6px),linear-gradient(145deg,var(--blue2),var(--blue3))}
.months{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.m-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:14px}
.m-head h4{margin:0;font-family:var(--head);font-weight:800;font-size:18px;letter-spacing:-.01em}
.m-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.m-grid .wd{text-align:center;font-family:var(--body);font-weight:600;font-size:11px;color:var(--dim);padding-bottom:2px}
.c{position:relative;aspect-ratio:1/1;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.045);font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.c.x{background:none}
.c.o{opacity:.3}
.c.r{background:none;border:1px dashed var(--hair2);opacity:.7}
.c.m{color:var(--warn);background:rgba(255,123,141,.11)}
.c.d{background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,0) 62%),var(--blue);color:#fff;font-weight:700;box-shadow:0 5px 10px -5px rgba(91,140,255,.8)}
.c.l::after{content:"";position:absolute;right:2px;bottom:2px;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 0 1.5px rgba(30,40,110,.5)}
.c.s{border:1.5px solid rgba(148,178,255,.7);color:var(--blue2);background:rgba(91,140,255,.16)}
.c.s svg{display:block;width:58%;height:58%}
.c.t{outline:2px solid var(--white);outline-offset:2px}

/* 2.3.5: the Check-in is one slim button (Habits tab) that opens a pop-up. The same button style opens the Mood & journal data in Records. */
.cibtn{display:flex;align-items:center;gap:14px;width:100%;margin-bottom:18px;padding:13px 18px 13px 14px;border-radius:22px;text-align:left;transition:transform .22s var(--spring),background .25s}
.cibtn:active{transform:scale(.985)}
.cib-ic{flex:none;width:46px;height:46px;display:grid;place-items:center;border-radius:15px;background:rgba(255,255,255,.07);font-size:25px;line-height:1}
.cib-t{flex:1;min-width:0;display:grid}
.cib-t b{font-family:var(--head);font-weight:800;font-size:17px;letter-spacing:-.01em}
.cib-t small{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cib-s{flex:none;font-family:var(--body);font-weight:700;font-size:12px;color:var(--blue2)}
.cibtn.done .cib-s{color:#6ee7b7}
/* inside the Check-in pop-up */
.ci-blk{margin-bottom:18px}
.ci-blk>span{display:block;margin-bottom:9px;font-family:var(--body);font-weight:600;font-size:13px;color:var(--muted)}
.ci-pick{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.ci-b{min-height:56px;border-radius:16px;background:rgba(255,255,255,.07);border:1px solid var(--hair);color:var(--muted);font-family:var(--head);font-weight:800;font-size:19px;font-variant-numeric:tabular-nums;transition:background .25s var(--ease),color .25s,box-shadow .25s,transform .22s var(--spring)}
.ci-b:active{transform:scale(.92)}
.ci-b.mo{min-height:62px;font-size:30px;line-height:1}
.ci-b.mo:not(.on){filter:grayscale(.85);opacity:.7}
.ci-b.on{color:#fff;border-color:transparent;background:linear-gradient(180deg,#6c97ff,#4a6cf5);box-shadow:0 8px 16px -8px rgba(74,108,245,.9),inset 0 1px 0 rgba(255,255,255,.28)}
.ci-b.en.on{color:#3a2300;background:linear-gradient(180deg,#ffdd85,#ffa94d);box-shadow:0 8px 16px -8px rgba(255,166,70,.9),inset 0 1px 0 rgba(255,255,255,.5)}
.ci-ends{display:flex;justify-content:space-between;margin:7px 2px 0;font-family:var(--body);font-weight:600;font-size:11px;color:var(--dim)}

/* 2.3.0: charts in Records (plain bars drawn with CSS: no library) */
.chart{display:flex;align-items:flex-end;gap:5px;margin-top:6px;--ac:var(--blue)}
.cc{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:5px}
.cc .v{height:14px;font-family:var(--body);font-weight:700;font-size:10.5px;line-height:14px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.cc .tr{width:100%;height:96px;display:flex;align-items:flex-end;justify-content:center}
.cc .tr i{display:block;width:100%;max-width:30px;min-height:3px;border-radius:9px 9px 4px 4px;background:linear-gradient(180deg,var(--ac),color-mix(in srgb,var(--ac) 55%,#000))}
.cc.none .tr i{background:rgba(255,255,255,.08)}
.cc.best .tr i{background:linear-gradient(180deg,#ffdd85,#ff9f4a);box-shadow:0 0 14px -2px rgba(255,166,70,.7)}
.cc.best .v{color:var(--gold)}
.cc .x{font-family:var(--body);font-weight:600;font-size:10.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.chart-cap{margin:12px 0 0;font-size:13.5px;line-height:1.45;color:var(--muted)}
.chart-cap b{color:var(--white);font-weight:700}
.panel-t{display:block;margin-bottom:10px;font-family:var(--head);font-weight:800;font-size:17px;letter-spacing:-.01em;color:var(--white)}
.hr-row{margin-bottom:14px}
.hr-row:last-child{margin-bottom:0}
.hr-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:7px;font-size:14.5px}
.hr-h span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--head);font-weight:700}
.hr-h span:last-child{flex:none;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.hb{height:8px;border-radius:999px;background:rgba(255,255,255,.09);overflow:hidden}
.hb i{display:block;height:100%;border-radius:999px;background:var(--ac)}

/* 2.3.0: smart insights */
.ins{padding:16px 18px;border-radius:20px;border-color:rgba(148,178,255,.3);background:linear-gradient(135deg,rgba(91,140,255,.14),rgba(123,64,228,.06)),var(--surface)}
.ins .tag{display:block;margin-bottom:5px;font-weight:700;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--blue2)}
.ins p{margin:0 0 12px;font-size:15px;line-height:1.5;color:var(--white);overflow-wrap:anywhere}
.ins p:last-child{margin-bottom:0}

/* 2.3.0: journal list */
.jlist{display:grid;gap:8px}
.jr{display:block;width:100%;padding:13px 16px;border-radius:18px;background:var(--surface2);border:1px solid var(--hair);text-align:left;transition:transform .22s var(--spring),background .25s}
.jr:active{transform:scale(.98)}
.jr small{display:block;margin-bottom:4px;font-family:var(--body);font-weight:600;font-size:12px;color:var(--blue2)}
.jr p{margin:0;font-size:15px;line-height:1.45;color:var(--white);overflow-wrap:anywhere}

/* 2.3.5: the mood and journal data sheet (opened from Records) uses the same blocks inside a pop-up */
.win .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
.win .chart-cap,.win .note{margin:10px 0 0;font-size:13.5px;line-height:1.45;color:var(--muted)}
.win .note{margin:0}
.win .jr p{margin:0;font-size:15px;color:var(--white)}

/* trackpad / mouse on iPad: gentle hover feedback (does nothing on touch) */
@media (hover:hover){
  .btn:hover{filter:brightness(1.08)}
  .btn.ghost:hover{background:rgba(255,255,255,.12);filter:none}
  .box.open:hover{transform:scale(1.05)}
  .h-more:hover{background:var(--surface3);color:var(--white)}
  .chip:hover:not(.on){color:var(--white);background:var(--surface2)}
  .tab:hover:not(.on){color:var(--white)}
  .add:hover:not(.full){background:rgba(255,255,255,.035)}
  .t-row:hover{background:var(--surface3)}
  .arr-btn:hover:not(:disabled){background:rgba(255,255,255,.14)}
  .ci-b:hover:not(.on){background:rgba(255,255,255,.12);color:var(--white)}
  .cibtn:hover{background:var(--surface2)}
  .jr:hover{background:var(--surface3)}
}
@media (min-width:700px){
  #app{padding-left:26px;padding-right:26px}
  .box{font-size:16px}
  .h-name{font-size:22px}
  .stats{grid-template-columns:repeat(4,minmax(0,1fr))}
  .win .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .months{grid-template-columns:repeat(2,minmax(0,1fr))}
  .c{font-size:13px}
}
@media (min-width:1000px){
  #app{max-width:1080px}
  .habits{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ladder{grid-template-columns:repeat(2,minmax(0,1fr))}
  .log{grid-template-columns:repeat(2,minmax(0,1fr))}
  .months{grid-template-columns:repeat(3,minmax(0,1fr))}
  .t-list{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:420px){
  .brand b{font-size:24px}
  .h-name{font-size:18px}
  .week{gap:5px}
  .rung{grid-template-columns:auto 1fr}
  .rung .btn{grid-column:1/-1}
  .tab{font-size:10.5px}
  .ring{width:96px;height:96px}
  .ring .rc{font-size:24px}
  .t-top{gap:16px}
  .ci-pick{gap:6px}
  .chart{gap:3px}
  .fcode{font-size:28px}
  .frow{gap:9px;padding-left:10px}
  .f-x,.f-p{width:36px;height:36px}
  .f-rk{width:40px;height:46px;font-size:18px}
}

/* ===== 2.8.0: morning intention + reminders ===== */
.t-win{margin-top:12px;padding:10px 12px;border-radius:14px;background:rgba(255,207,110,.09);border:1px solid rgba(255,207,110,.28);font-size:14px;line-height:1.4;color:var(--white);overflow-wrap:anywhere;text-align:left;width:100%;display:block;font-family:inherit;cursor:pointer}
.t-win b{display:block;font-family:var(--body);font-weight:700;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-bottom:2px}
.t-win.ask{background:rgba(255,255,255,.05);border-color:var(--hair);color:var(--muted)}
.t-win.ask b{color:var(--muted)}
.rm-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:2px 0 14px}
.rm-row span{font-family:var(--body);font-weight:600;font-size:13px;color:var(--muted)}
.rm-row input[type=time]{width:auto;min-width:132px;min-height:46px}
.rm-ok{color:var(--gold)}
/* ===== 2.7.0: habit icons, streak flame, level-up moment, badges, evening wrap-up ===== */
.h-ic{flex:none;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:22px;line-height:1;background:color-mix(in srgb,var(--ac) 20%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ac) 42%,transparent)}
.h-name.hasic::before{display:none}
.h-name.hasic{gap:11px}
.t-ic{flex:none;width:26px;text-align:center;font-size:21px;line-height:1}
.t-row.on .t-ic{opacity:.45}
.arr-ic{flex:none;width:24px;text-align:center;font-size:19px;line-height:1}
.ipick{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;margin-bottom:16px}
.ipk{min-height:46px;border:0;border-radius:13px;background:rgba(255,255,255,.07);font-size:22px;line-height:1;transition:background .25s var(--ease),box-shadow .25s,transform .22s var(--spring)}
.ipk:active{transform:scale(.88)}
.ipk.on{background:linear-gradient(180deg,#6c97ff,#4a6cf5);box-shadow:0 8px 16px -8px rgba(74,108,245,.9),inset 0 1px 0 rgba(255,255,255,.28)}

/* streak flame */
.sn{display:inline-flex;align-items:center;gap:3px}
.fl{width:26px;height:26px;flex:none;overflow:visible;transform-origin:50% 92%}
.fl .fo{fill:var(--f1)}
.fl .fi{fill:var(--f2)}
.fl.t1{--f1:#ff8a3d;--f2:#ffd36b}
.fl.t2{--f1:#ff5a3c;--f2:#ffc04d;width:29px;height:29px}
.fl.t3{--f1:#4f86ff;--f2:#e2ecff;width:31px;height:31px}
.fl.lit{filter:drop-shadow(0 0 5px var(--f1));animation:flick 1.7s ease-in-out infinite}
.fl.t2.lit{animation-duration:1.35s;filter:drop-shadow(0 0 7px var(--f1))}
.fl.t3.lit{animation-duration:1.1s;filter:drop-shadow(0 0 9px var(--f1))}
.fl.dim{--f1:#6b7285;--f2:#9aa1b5;opacity:.55}
.fl.ign{animation:ignite .85s var(--spring)}
.t-st .fl{width:17px;height:17px;margin-right:0}
.t-st .fl.t2{width:19px;height:19px}
.t-st .fl.t3{width:20px;height:20px}
@keyframes flick{0%,100%{transform:scale(1,1) rotate(-1.5deg)}25%{transform:scale(.95,1.07) rotate(1.5deg)}50%{transform:scale(1.04,.96) rotate(-1deg)}75%{transform:scale(.97,1.05) rotate(1deg)}}
@keyframes ignite{0%{transform:scale(.2);opacity:0}55%{transform:scale(1.5,1.7);opacity:1}100%{transform:scale(1);opacity:1}}

/* stronger level-up moment */
.cel-hero.lvl{width:150px;height:170px;margin-bottom:14px}
.cel-hero .rays,.cel-hero .shock{display:none}
.cel-hero.lvl .rays{display:block;position:absolute;left:50%;top:50%;width:330px;height:330px;margin:-165px 0 0 -165px;border-radius:50%;pointer-events:none;
  background:repeating-conic-gradient(from 0deg,rgba(160,185,255,.34) 0 6deg,transparent 6deg 22deg);
  -webkit-mask:radial-gradient(circle,#000 0,#000 30%,transparent 66%);mask:radial-gradient(circle,#000 0,#000 30%,transparent 66%);
  animation:raysin 1s var(--ease) both,spin 18s linear infinite}
.cel-hero.lvl .shock{display:block;position:absolute;left:50%;top:50%;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:3px solid #d6e2ff;opacity:0;pointer-events:none}
.cel-hero.boom .shock{animation:shock 1.1s var(--ease) both}
.cel-hero.boom .shock.s2{animation-delay:.2s;border-color:#a98bff}
.cel-hero.lvl .cel-ic{z-index:1}
@keyframes raysin{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shock{0%{transform:scale(.5);opacity:.95}100%{transform:scale(3.6);opacity:0}}
.cel-lbl.lv{font-size:15px;letter-spacing:.38em;color:#d6e2ff;text-shadow:0 0 18px rgba(130,160,255,.95);animation:lvtxt .8s var(--spring) both}
@keyframes lvtxt{from{opacity:0;letter-spacing:.9em}to{opacity:1;letter-spacing:.38em}}
.win.cel h3.lvh{font-size:38px;letter-spacing:-.03em}
.win.cel.lvlwin{background:radial-gradient(120% 55% at 50% 0%,rgba(110,130,255,.32),transparent 62%),linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,0) 30%),#1a1d28}
.win.cel.lvlwin .sub{color:#c9d8ff}
.cel-ic .bic{font-size:40px;line-height:1}

/* badges (Vault) */
.bdg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-bottom:6px}
.bdg{display:flex;align-items:center;gap:15px;padding:16px 18px}
.bdg-ic{flex:none;width:56px;height:62px;display:grid;place-items:center;font-size:27px;line-height:1;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(160deg,#ffe9a8,#ffb04f 55%,#ff9f4a)}
.bdg.lock .bdg-ic{background:rgba(255,255,255,.08);filter:grayscale(1);opacity:.7}
.bdg h4{margin:0 0 3px;font-family:var(--head);font-weight:800;font-size:16px;letter-spacing:-.01em}
.bdg p{margin:0;font-size:13px;line-height:1.4;color:var(--muted)}
.bdg small{display:block;margin-top:5px;font-family:var(--body);font-weight:700;font-size:12px;color:var(--gold)}
.bdg.lock small{color:var(--blue2)}

/* evening wrap-up */
.wrap-steps{display:flex;gap:6px;margin:0 0 18px}
.wrap-steps i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.12);transition:background .3s}
.wrap-steps i.on{background:var(--blue2)}
.wlist{display:grid;gap:8px;margin-bottom:14px}
.w-line{display:flex;gap:8px;align-items:stretch}
.w-line .t-row{flex:1;min-width:0}
.w-mini{flex:none;border:0;border-radius:18px;padding:0 14px;background:rgba(255,255,255,.07);color:var(--blue2);font-family:var(--body);font-weight:700;font-size:12.5px}
.w-mini:active{transform:scale(.95)}
.wrapbtn .cib-ic{background:rgba(120,140,255,.16)}
/* ===== 2.9.0: cheers, next goal, habit insights button, focus time ===== */
.h-ins{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:50%;background:var(--surface2);border:1px solid var(--hair);color:var(--muted);transition:background .2s,color .2s,transform .2s var(--spring)}
.h-ins svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.h-ins:active{background:var(--surface3);color:var(--white);transform:scale(.9)}
@media (hover:hover){.h-ins:hover{background:var(--surface3);color:var(--white)}}
.goal{display:block;width:100%;margin-bottom:18px;padding:16px 18px 18px;border-radius:24px;text-align:left;border-color:rgba(110,231,183,.28);background:linear-gradient(135deg,rgba(110,231,183,.1),rgba(60,180,140,.03)),var(--surface)}
.goal .tag{display:block;margin-bottom:3px;font-weight:700;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#6ee7b7}
.goal.empty{border-style:dashed;transition:transform .22s var(--spring)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* 2.9.9: the endless glow/shimmer/flame animations pause while a pop-up covers the screen (less work for the iPad, no visible change) */
body:has(#overlay.show) .bar i::after,body:has(#overlay.show) .box.today:not(.done)::after,body:has(#overlay.show) .fl.lit,body:has(#overlay.show) .btn.claim,body:has(#overlay.show) .btn.claim::after{animation-play-state:paused}
/* ===== 3.0.0: premium polish, Year in pixels, Profile card, full-screen level-up / rank-up ===== */
::selection{background:rgba(91,140,255,.35)}
html{scrollbar-width:none}
::-webkit-scrollbar{display:none}
/* rank hexagon: a gold-rimmed hexagon in the colour of the rank (E steel, D bronze, C silver, B gold, A amethyst, S prismatic) */
.hx{--s:64px;--r1:#86a6ff;--r2:#4a63f0;--rg:rgba(91,140,255,.5);position:relative;flex:none;display:grid;place-items:center;width:var(--s);height:calc(var(--s) * 1.125);filter:drop-shadow(0 6px calc(var(--s) * .26) var(--rg))}
.hx::before,.hx i{content:"";position:absolute;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}

.hx b{position:relative;font-family:var(--head);font-weight:800;font-size:calc(var(--s) * .5);line-height:1;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.4);font-variant-numeric:tabular-nums}

.panel{border-color:rgba(255,255,255,.075);box-shadow:inset 0 1px 0 rgba(255,255,255,.065),0 1px 2px rgba(0,0,0,.35),0 24px 46px -26px rgba(0,0,0,.9)}

.win{border-radius:36px;box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 -24px 90px -24px rgba(0,0,0,.85),0 0 0 1px rgba(255,255,255,.04)}
.win h3{font-size:28px}
.habit{border-radius:32px}
.t-row,.frow,.stat,.jr{border-color:rgba(255,255,255,.075)}

#view.v-in>:nth-child(5){animation-delay:.16s}#view.v-in>:nth-child(6){animation-delay:.2s}#view.v-in>:nth-child(n+7){animation-delay:.24s}

/* ---- Year in pixels ---- */
.yp-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}

/* ---- Profile card ---- */
.win.prof{padding:0;overflow:hidden;text-align:center;--ac:var(--r1)}

.pf-name{font-family:var(--head);font-weight:800;font-size:31px;letter-spacing:-.025em;overflow-wrap:anywhere}

/* ---- Full-screen level-up and rank-up ---- */
.mom{position:fixed;inset:0;z-index:120;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;padding:24px calc(env(safe-area-inset-right) + 24px) calc(env(safe-area-inset-bottom) + 24px) calc(env(safe-area-inset-left) + 24px);text-align:center;overflow:hidden;background:radial-gradient(120% 80% at 50% 36%,color-mix(in srgb,var(--r2) 34%,#0a0c1c),#04050a 72%);animation:momIn .5s ease both}

.mom-s1{font-family:var(--body);font-weight:600;font-size:16px;color:rgba(255,255,255,.78)}
.mom-chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:18px 0 14px}

.mom-p{margin:0 auto 24px;max-width:340px;font-size:15px;line-height:1.5;color:rgba(255,255,255,.66)}

/* 3.0.5 */
.jr.rf,.jr.ck{margin-bottom:0}

function sum53(str) {
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < str.length; i++) {
    const ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);

    ? 'You missed ' + dayWord(n.key) + ' and the day before. A new run starts with one done day, so make today that day. ' + tail
    : 'You missed ' + dayWord(n.key) + '. One miss is an accident, two is the start of a new habit. Do it today. ' + tail;
}

/* ---- Weekly reflection ---- */
const weekKey = d => dkey(addDays(d, -wdOf(d)));
// Days, done days and saver days of every habit in the week that starts on Monday key wk (future days are left out).
function weekStats(wk) {
  const tk = dkey(new Date()), mon = parseKey(wk);
  const rows = S.habits.map(h => {
    let due = 0, done = 0, saved = 0;
    for (let i = 0; i < 7; i++) {
      const d = addDays(mon, i), k = dkey(d);
      if (k > tk) break;
      if (k < h.created && !h.done[k]) continue;
      const v = h.done[k];
      if (v === 1) { due++; done++; }
      else if (v === 2) saved++;
      else if (isSched(h, d)) due++;
    }
    return {h: h, due: due, done: done, saved: saved};
  });
  const due = rows.reduce((n, r) => n + r.due, 0), done = rows.reduce((n, r) => n + r.done, 0);
  return {
    rows: rows, due: due, done: done, rate: due ? Math.round(done / due * 100) : null,
    perfect: rows.filter(r => r.due > 0 && r.done === r.due).map(r => r.h.name)
  };
}
// Reflection is offered from Sunday (this week) until Wednesday (last week), if not done yet.
function reflectDueWeek() {
  if (!S.habits.length) return null;
  const t = new Date(), wd = wdOf(t);
  const wk = wd === 6 ? weekKey(t) : wd <= 2 ? weekKey(addDays(t, -7)) : null;
  if (!wk || S.reflections.some(r => r.week === wk)) return null;
  return weekStats(wk).due > 0 ? wk : null;
}
// The focus chosen in the latest reflection, shown on the Today card for about a week.
function currentFocus() {
  const r = S.reflections[0];
  return r && r.focus && r.week >= weekKey(addDays(new Date(), -7)) ? r.focus : '';
}
const weekRange = wk => {
  const m = parseKey(wk), f = d => d.toLocaleDateString(undefined, {day:'numeric', month:'short'});
  return f(m) + ' – ' + f(addDays(m, 6));
};

// Backup reminder: counts edits since the last backup, and reacts to big moments (quest claimed, habit added).
function backupInfo() {
  if (!meaningful(S)) return {due:false};
  const ch = S.changes || 0;
  let days = null;
  if (S.lastBackup) { const t = new Date(S.lastBackup).getTime(); if (!isNaN(t)) days = Math.max(0, Math.floor((Date.now() - t) / 86400000)); }
  const ago = days === null ? 'never' : days === 0 ? 'today' : days === 1 ? 'yesterday' : days + ' days ago';
  let due = false, msg = '';
  if (days === null) { due = true; msg = 'You have never saved a backup. Save one now so your progress is safe.'; }
  else if (ch > 0 && S.bigMoment) { due = true; msg = 'Big moment recorded. Save a backup now to lock in your progress.'; }
  else if (ch >= BACKUP_CHANGES || (ch > 0 && days >= BACKUP_DAYS)) {
    due = true; msg = ch + ' change' + (ch === 1 ? '' : 's') + ' since your last backup (' + ago + '). Save one so your progress is safe.';
  }
  return {due:due, msg:msg, changes:ch, days:days, ago:ago};
}

/* ---- patterns, trends and insights (2.3.0) ---- */
// Per weekday (0 = Monday): days the habit was due or done (due) and days it was missed (miss), over the last "span" days.
// A day protected by a streak saver counts as neither. Today only counts when it is already done.
function weekdayCounts(h, span) {
  const today = new Date(), tk = dkey(today);
  const end = h.done[tk] ? today : addDays(today, -1);
  let start = addDays(end, -(span - 1));
  const cr = parseKey(h.created);
  if (start < cr) start = cr;
  const due = [0, 0, 0, 0, 0, 0, 0], miss = [0, 0, 0, 0, 0, 0, 0];
  for (let d = start; d <= end; d = addDays(d, 1)) {
    const v = h.done[dkey(d)], w = wdOf(d);
    if (v === 1) due[w]++;
    else if (v === 2) continue;
    else if (isSched(h, d)) { due[w]++; miss[w]++; }
  }
  return {due: due, miss: miss};
}
// A weekday that really stands out as the habit's hardest: enough days, missed at least 40% of the time and
// at least 20 points worse than the habit's overall miss rate. Returns null when there is no clear pattern.
function toughDay(h) {
  const c = weekdayCounts(h, 120);
  const tot = c.due.reduce((a, b) => a + b, 0), miss = c.miss.reduce((a, b) => a + b, 0);
  if (tot < 21) return null;
  const base = miss / tot;
  let best = null;
  for (let w = 0; w < 7; w++) {
    if (c.due[w] < 4 || c.miss[w] < 3) continue;
    const r = c.miss[w] / c.due[w];
    if (r >= 0.4 && r - base >= 0.2 && (!best || r > best.rate)) best = {wd: w, miss: c.miss[w], due: c.due[w], rate: r};
  }
  return best;
}
// Average mood (field "m") or energy (field "e") on days the habit was done, against days it was not.
// Needs at least 3 check-in days of each kind. Today only counts once the habit is done (today is still open).
function moodLift(h, field) {
  const tk = dkey(new Date());
  let a = 0, an = 0, b = 0, bn = 0;
  for (const k of Object.keys(S.checkins)) {
    const v = S.checkins[k][field], dv = h.done[k];
    if (!v || k < h.created || dv === 2) continue;
    if (dv === 1) { a += v; an++; }
    else if (k !== tk && isSchedKey(h, k)) { b += v; bn++; }
  }
  if (an < 3 || bn < 3) return null;
  return {lift: a / an - b / bn, avgDone: a / an, avgNot: b / bn};
}
// Completion of all habits in the week that starts on Monday key wk. A day that is still open (today) is not counted yet.
function trendWeek(wk) {
  const tk = dkey(new Date()), mon = parseKey(wk);
  let due = 0, done = 0;
  S.habits.forEach(h => {
    for (let i = 0; i < 7; i++) {
      const d = addDays(mon, i), k = dkey(d), v = h.done[k];
      if (k > tk) break;
      if (k < h.created && !v) continue;
      if (k === tk && !v) continue;
      if (v === 1) { due++; done++; }
      else if (v === 2) continue;
      else if (isSched(h, d)) due++;
    }
  });
  return {due: due, done: done};
}
// Weekday totals over all habits (last 365 days).
function weekdayAll() {
  const due = [0, 0, 0, 0, 0, 0, 0], miss = [0, 0, 0, 0, 0, 0, 0];
  S.habits.forEach(h => {
    const c = weekdayCounts(h, 365);
    for (let w = 0; w < 7; w++) { due[w] += c.due[w]; miss[w] += c.miss[w]; }
  });
  return {due: due, miss: miss};
}
// The insight cards shown in Records: hardest days (with the offer of a 2-minute version) and what lifts mood and energy.
// 2.4: a Daily task habit has no 2-minute version, so its card suggests planning a lighter task for that weekday instead.
function insights(only) {   // 2.9: pass one habit to get only its cards (used by the graph button on a habit)
  const found = [], hs = only ? [only] : S.habits;
  hs.forEach(h => {
    const t = toughDay(h);
    if (!t) return;
    const base = 'You miss ' + h.name + ' most on ' + DAY_PLURAL[t.wd] + ' (' + t.miss + ' of ' + t.due + '). ';
    if (h.task) found.push({tag: 'Hardest day', rate: t.rate, hid: h.id, offer: false, text: base + 'Try planning a lighter task for ' + DAY_PLURAL[t.wd] + '.'});
    else found.push({tag: 'Hardest day', rate: t.rate, hid: h.id, offer: !h.mini,
      text: base + (h.mini ? 'Your 2-minute version counts on those days: ' + h.mini + '.' : 'Want to set a 2-minute version you can use on ' + DAY_PLURAL[t.wd] + '?')});
  });
  found.sort((a, b) => b.rate - a.rate);
  const list = found.slice(0, 3);
  [['m', 'mood', 'Mood lift'], ['e', 'energy', 'Energy lift']].forEach(f => {
    let best = null;
    hs.forEach(h => { const l = moodLift(h, f[0]); if (l && l.lift >= 0.5 && (!best || l.lift > best.l.lift)) best = {h: h, l: l}; });
    if (best) list.push({tag: f[2], text: 'Your ' + f[1] + ' averages ' + best.l.avgDone.toFixed(1) + ' (out of 5) on days you do ' + best.h.name + ', against ' + best.l.avgNot.toFixed(1) + ' on days you do not. It is a pattern, not proof, but worth protecting on low days.'});
  });
  return list;
}
// Simple bar chart drawn with plain HTML. cols: [{v: number or null, show, label, best}]. max = the value that fills a whole bar.
function chartHtml(cols, max) {
  return '<div class="chart">' + cols.map(c => {
    const p = c.v == null ? 0 : Math.max(0, Math.min(100, c.v / max * 100));
    return `<div class="cc${c.best ? ' best' : ''}${c.v == null ? ' none' : ''}"><span class="v">${esc(c.show == null ? '' : c.show)}</span><div class="tr"><i style="height:${p.toFixed(1)}%"></i></div><span class="x">${esc(c.label)}</span></div>`;
  }).join('') + '</div>';
}

/* ============ UI state + render ============ */
const TABS = ['habits', 'vault', 'records', 'friends', 'system'];
// fx = which habit/day was just ticked (set only for the moment the screen is redrawn, so the tick effects play once).
// jq = journal search text. jback = the journal line editor was opened from the Mood & journal sheet, so it returns there.
const ui = { tab: 'habits', day: dkey(new Date()), rec: null, rescue: null, pend: null, fx: null, jq: '', jback: false, wrap: null, yr: new Date().getFullYear(), refback: false, ckn: 40 };  // rescue: null | 'fresh' | 'damaged' | 'unreadable'.

function renderNav() {
  document.querySelectorAll('.tab').forEach(t => {
    const on = t.dataset.tab === ui.tab;
    t.classList.toggle('on', on);
    if (on) t.setAttribute('aria-current', 'page'); else t.removeAttribute('aria-current');
  });
  $('.tabs .in').style.setProperty('--i', String(TABS.indexOf(ui.tab)));
}
// Bars and the Today ring carry data-k. When the screen is redrawn, they start from their old size and glide to the new one.
// FIX 2.2.0: all the bars are set up first and the browser measures the page ONCE (before it did that once per bar).
function renderView() {
  const now = new Date();
  const old = {};
  document.querySelectorAll('#view [data-k]').forEach(e => { old[e.dataset.k] = e.dataset.off !== undefined ? e.style.strokeDashoffset : e.style.width; });
  $('#today-label').innerHTML = esc(now.toLocaleDateString(undefined, {weekday:'short'})) + '<br>' + esc(now.toLocaleDateString(undefined, {day:'2-digit', month:'short'}));
  $('#view').innerHTML = ui.rescue ? viewRescue() : ui.tab === 'habits' ? viewHabits() : ui.tab === 'vault' ? viewVault() : ui.tab === 'records' ? viewRecords() : ui.tab === 'friends' ? viewFriends() : viewSystem();
  if (reduceMotion()) return;
  const moves = [];
  document.querySelectorAll('#view [data-k]').forEach(e => {
    const o = old[e.dataset.k];
    if (o === undefined || o === '') return;
    const p = e.dataset.off !== undefined ? 'strokeDashoffset' : 'width', to = e.style[p];
    if (o === to) return;
    e.style.transition = 'none'; e.style[p] = o;
    moves.push([e, p, to]);
  });
  if (!moves.length) return;
  void document.body.offsetHeight;
  moves.forEach(m => { m[0].style.transition = ''; m[0].style[m[1]] = m[2]; });
}
// FIX 2.2.0: an ordinary redraw (a tick, a save) clears the "tab is opening" class, so the cards do not rise in again when you tap soon after opening a tab.
function render() { commitInput(); document.body.classList.toggle('rescuing', !!ui.rescue); renderNav(); $('#view').classList.remove('v-in'); renderView(); }

// Smooth fade/slide for the content area. The "entering" class is removed afterwards so later redraws do not replay it.
let inTimer;
function playIn(dx) {
  const v = $('#view');
  v.style.setProperty('--dx', dx + 'px');
  v.classList.remove('v-in', 'v-out');
  void v.offsetWidth;
  v.classList.add('v-in');
  clearTimeout(inTimer);
  inTimer = setTimeout(() => v.classList.remove('v-in'), 1200);
}
const reduceMotion = () => !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
let swapTimer;
function switchTab(name) {
  if (TABS.indexOf(name) < 0 || ui.rescue) return;
  if (name === ui.tab) { window.scrollTo(0, 0); return; }
  commitInput();   // a journal line that is still being typed is saved before the screen changes
  if (ui.tab === 'friends') ackFriends();   // 2.6: leaving the Friends tab counts as having seen the level-ups
  const dir = TABS.indexOf(name) > TABS.indexOf(ui.tab) ? 1 : -1;
  ui.tab = name;
  renderNav();
  if (name === 'friends') syncFriends();   // 2.5: opening the Friends tab refreshes the cards
  if (reduceMotion()) { renderView(); window.scrollTo(0, 0); return; }
  const v = $('#view');
  v.style.setProperty('--dx', (dir * 28) + 'px');
  v.classList.remove('v-in');
  v.classList.add('v-out');
  clearTimeout(swapTimer);
  swapTimer = setTimeout(() => { renderView(); window.scrollTo(0, 0); playIn(dir * 28); }, 130);
}
