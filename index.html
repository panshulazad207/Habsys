<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Habsys</title>
<meta name="theme-color" content="#030816">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Habsys">
<link rel="manifest" href="manifest.webmanifest?v=151">
<link rel="apple-touch-icon" href="icon-180.png?v=151">
<link rel="icon" type="image/png" href="icon-192.png?v=151">
<style>
/* ===== Habsys 1.9.0 visual polish: look only, no behaviour changes ===== */
:root{
  color-scheme:dark;
  --bg0:#030816; --bg1:#071433;
  --blue:#2f8bff; --blue2:#5cc8ff; --blue3:#1b4fd6;
  --white:#f3f8ff; --muted:#93add9; --dim:#5a6f9e;
  --line:rgba(120,176,255,.20);
  --line-strong:rgba(140,198,255,.42);
  --panel-a:rgba(24,52,124,.46); --panel-b:rgba(8,18,52,.68);
  --warn:#ff8da1;
  --r:20px; --r-sm:14px;
  --head:"SF Pro Display",-apple-system,BlinkMacSystemFont,"Avenir Next","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg0)}
body{
  margin:0;min-height:100vh;color:var(--white);font-family:var(--body);font-size:16px;line-height:1.4;
  -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(900px 520px at 88% -10%,rgba(60,140,255,.30),transparent 60%),
    radial-gradient(700px 460px at -12% 6%,rgba(92,200,255,.14),transparent 62%),
    radial-gradient(900px 600px at 50% 115%,rgba(27,79,214,.18),transparent 60%),
    linear-gradient(180deg,#050d26 0%,#030816 60%,#020611 100%);
  background-attachment:fixed;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  overscroll-behavior-y:none;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(120,176,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(120,176,255,.05) 1px,transparent 1px);
  background-size:48px 48px;
  -webkit-mask-image:linear-gradient(180deg,#000,transparent 70%);mask-image:linear-gradient(180deg,#000,transparent 70%);
}
button,input,textarea{font:inherit;color:inherit;touch-action:manipulation}
button{cursor:pointer;border:0;background:none;padding:0}
input,textarea{-webkit-user-select:text;user-select:text}

#app{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) 18px calc(env(safe-area-inset-bottom) + 112px)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 4px 22px}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:36px;height:36px;filter:drop-shadow(0 0 7px rgba(92,200,255,.55))}
.brand b{font-family:var(--head);font-weight:700;font-size:22px;letter-spacing:.34em;text-transform:uppercase;color:var(--white);text-shadow:0 0 18px rgba(92,200,255,.45)}
.top .date{font-family:var(--body);font-weight:600;font-size:11px;line-height:1.5;letter-spacing:.18em;color:var(--blue2);text-transform:uppercase;text-align:right;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:rgba(47,139,255,.07)}

/* panels: soft glass cards */
.panel{
  position:relative;border:1px solid var(--line);border-radius:var(--r);
  background:linear-gradient(165deg,var(--panel-a),var(--panel-b));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 14px 34px -14px rgba(0,6,30,.8);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  padding:18px;
}
.panel::before{content:"";position:absolute;left:22px;right:22px;top:-1px;height:1px;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(170,220,255,.55),transparent)}
.tag{font-family:var(--body);font-weight:600;font-size:10.5px;letter-spacing:.2em;color:var(--blue2);text-transform:uppercase}
h2.sec{font-family:var(--head);font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--blue2);margin:32px 4px 12px;font-weight:700;display:flex;align-items:center;gap:12px}
h2.sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line-strong),transparent)}

/* player */
.player{display:flex;align-items:center;gap:18px;margin-bottom:16px;padding:20px 18px}
.rank{width:66px;height:74px;flex:none;display:grid;place-items:center;
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
  background:radial-gradient(circle at 30% 18%,rgba(255,255,255,.5),transparent 52%),linear-gradient(155deg,#86daff 0%,#3a8bff 48%,#1b45c8 100%);
  font-family:var(--head);font-weight:800;font-size:34px;color:var(--white);text-shadow:0 2px 10px rgba(0,24,90,.55)}
.p-info{flex:1;min-width:0}
.p-name{font-family:var(--head);font-weight:700;font-size:22px;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-sub{font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;margin:3px 0 10px}
.bar{height:8px;border:1px solid rgba(120,176,255,.16);background:rgba(2,8,26,.7);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--blue3),var(--blue),var(--blue2));box-shadow:0 0 12px rgba(92,200,255,.6);transition:width .5s ease}
.xp-txt{font-family:var(--body);font-weight:500;font-size:11px;letter-spacing:.1em;color:var(--muted);margin-top:7px;font-variant-numeric:tabular-nums}
.sv-line{display:flex;align-items:center;gap:7px;font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.12em;color:var(--blue2);margin-top:6px;text-transform:uppercase}
.sv-line svg{width:14px;height:14px;flex:none}
.p-lv{text-align:center;flex:none}
.p-lv small{display:block;font-family:var(--body);font-weight:600;font-size:10px;letter-spacing:.26em;color:var(--blue2)}
.p-lv b{font-family:var(--head);font-weight:700;font-size:42px;line-height:1.05;font-variant-numeric:tabular-nums;
  background:linear-gradient(180deg,#ffffff,#8fd5ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  filter:drop-shadow(0 0 12px rgba(92,200,255,.45))}

/* banner */
.banner{display:flex;align-items:center;gap:14px;margin-bottom:16px;padding:14px 16px;border-color:rgba(92,200,255,.38);background:linear-gradient(165deg,rgba(47,139,255,.24),rgba(8,18,52,.7))}
.banner p{margin:0;flex:1;font-size:14px;line-height:1.45;color:var(--white)}

/* habits */
.habits{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.panel{min-width:0}
.h-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:14px}
.h-name{font-family:var(--head);font-weight:700;font-size:21px;letter-spacing:.05em;text-transform:uppercase;text-align:left;color:var(--white);min-height:44px;padding:0;display:flex;align-items:center;gap:9px;min-width:0;flex:1}
.h-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.h-name svg{width:14px;height:14px;flex:none;opacity:.45}
.h-more{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:12px;color:var(--muted);transition:background .2s,color .2s}
.h-more svg{width:21px;height:21px;fill:currentColor}
.h-more:active{background:rgba(47,139,255,.2);color:var(--white)}
.streak{text-align:right;flex:none;padding-left:6px;min-width:52px}
.streak small{display:block;font-family:var(--body);font-weight:600;font-size:9.5px;letter-spacing:.24em;color:var(--blue2)}
.streak b{font-family:var(--head);font-weight:700;font-size:34px;line-height:1.05;font-variant-numeric:tabular-nums;text-shadow:0 0 16px rgba(92,200,255,.4)}
/* optional extras (days, 2-minute version, note): only drawn when the habit has them */
.extras{display:grid;gap:9px;margin:-2px 0 14px}
.x-line{display:flex;align-items:baseline;gap:10px;font-size:14px;color:var(--white)}
.x-line span:last-child{min-width:0;overflow-wrap:anywhere}
.x-tag{flex:none;font-family:var(--body);font-weight:700;font-size:9.5px;letter-spacing:.16em;color:var(--blue2);text-transform:uppercase;border:1px solid var(--line-strong);background:rgba(47,139,255,.1);border-radius:7px;padding:3px 8px}
.x-note{margin:0;font-size:14px;line-height:1.45;color:var(--muted);padding-left:12px;border-left:2px solid rgba(92,200,255,.4);overflow-wrap:anywhere;white-space:pre-wrap}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.week.flex .box{max-width:84px}
.rest{margin-top:14px;padding:11px;border:1px dashed rgba(120,176,255,.3);border-radius:var(--r-sm);text-align:center;font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;background:rgba(47,139,255,.04)}
.col{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0}
.dl{font-family:var(--body);font-weight:600;font-size:10.5px;letter-spacing:.14em;color:var(--muted)}
.box{
  position:relative;
  width:100%;aspect-ratio:1/1;max-height:84px;display:grid;place-items:center;border-radius:15px;
  border:1px solid rgba(120,176,255,.22);background:linear-gradient(180deg,rgba(16,36,92,.65),rgba(5,14,40,.8));color:var(--muted);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
  font-family:var(--body);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums;transition:transform .14s,box-shadow .25s,background .25s,border-color .25s;
}
.box.pre{opacity:.35}
.box.future{border-style:dashed;opacity:.5}
.box.open{cursor:pointer}
.box.open:active{transform:scale(.93)}
.box:not(.open){cursor:default;pointer-events:none}
.box.today:not(.done){border-color:rgba(243,248,255,.85);color:var(--white);animation:pulse 2.4s ease-in-out infinite}
.box.done{
  background:radial-gradient(circle at 30% 18%,rgba(255,255,255,.35),transparent 55%),linear-gradient(150deg,#62d0ff 0%,#2f7bf5 55%,#1d4fd8 100%);
  border-color:rgba(255,255,255,.7);color:var(--white);
  box-shadow:0 8px 20px -6px rgba(47,139,255,.75),inset 0 1px 0 rgba(255,255,255,.45);
}
.box.saved{background:rgba(47,139,255,.16);border-color:rgba(92,200,255,.7);color:var(--blue2);box-shadow:inset 0 0 12px rgba(92,200,255,.25)}
.box.saved .ck{filter:drop-shadow(0 0 4px rgba(92,200,255,.8))}
.box .ck{width:54%;height:54%;filter:drop-shadow(0 1px 3px rgba(0,20,80,.45))}
.box .mb{position:absolute;right:6px;bottom:5px;font-family:var(--body);font-weight:800;font-size:10px;line-height:1;color:var(--white);opacity:.95}
.yrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;padding-top:12px;border-top:1px solid rgba(120,176,255,.14)}
.yrow .dl{letter-spacing:.16em;text-transform:uppercase}
.yrow .box{width:46px;height:46px;max-height:none;aspect-ratio:auto;flex:none;border-radius:13px}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(243,248,255,0)}50%{box-shadow:0 0 0 4px rgba(243,248,255,.1),0 0 16px rgba(243,248,255,.35)}}

.quest{margin-top:16px;padding-top:14px;border-top:1px solid rgba(120,176,255,.14)}
.q-row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.q-lbl{font-family:var(--body);font-weight:600;font-size:10.5px;letter-spacing:.14em;color:var(--blue2);text-transform:uppercase}
.q-val{font-family:var(--body);font-weight:600;font-size:12px;letter-spacing:.06em;color:var(--white);font-variant-numeric:tabular-nums}
.pips{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px;align-items:center}
.pip{width:14px;height:16px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:rgba(120,176,255,.16)}
.pip.on{background:linear-gradient(160deg,var(--blue2),var(--blue3))}
.pips span{font-family:var(--body);font-weight:500;font-size:10.5px;letter-spacing:.12em;color:var(--muted);margin-left:6px;text-transform:uppercase}

.add{display:grid;place-items:center;min-height:112px;border-style:dashed;border-color:rgba(120,176,255,.32);background:rgba(47,139,255,.05);text-align:center;width:100%;color:var(--blue2);font-family:var(--head);font-weight:700;font-size:16px;letter-spacing:.18em;text-transform:uppercase;transition:background .2s,transform .12s}
.add:active{transform:scale(.985);background:rgba(47,139,255,.12)}
.add small{display:block;font-family:var(--body);font-weight:500;font-size:11px;letter-spacing:.16em;color:var(--muted);margin-top:6px}
.add.full{color:var(--muted);cursor:default}
.empty{text-align:center;padding:30px 20px;margin-bottom:16px}
.empty h3{font-family:var(--head);font-weight:700;font-size:21px;letter-spacing:.1em;text-transform:uppercase;margin:8px 0 10px}
.empty p{margin:0;color:var(--muted);font-size:15px;line-height:1.5}
.empty .stack{margin-top:20px;text-align:left}
.empty p + p{margin-top:12px}

/* buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:10px 20px;border-radius:15px;
  font-family:var(--head);font-weight:700;font-size:14.5px;letter-spacing:.1em;text-transform:uppercase;
  border:1px solid rgba(150,210,255,.55);color:var(--white);background:linear-gradient(180deg,#4199ff 0%,#2158e0 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 10px 24px -8px rgba(47,139,255,.7);
  transition:transform .12s,box-shadow .2s,filter .2s;
}
.btn:active{transform:scale(.97);filter:brightness(.93)}
.btn.ghost{background:rgba(120,176,255,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.05);border-color:var(--line-strong)}
.btn.danger{background:rgba(255,141,161,.05);box-shadow:none;border-color:rgba(255,141,161,.5);color:var(--warn)}
.btn.block{display:flex;width:100%}
.btn.sm{min-height:40px;padding:6px 14px;font-size:12.5px;border-radius:12px}
.btn.claim{width:100%;margin-top:16px;background:linear-gradient(180deg,#ffffff,#bfe3ff);color:#06205f;border-color:#fff;box-shadow:inset 0 1px 0 #fff,0 10px 28px -6px rgba(180,225,255,.8);animation:glow 2.2s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:inset 0 1px 0 #fff,0 8px 20px -6px rgba(180,225,255,.5)}50%{box-shadow:inset 0 1px 0 #fff,0 10px 32px -4px rgba(200,235,255,.95)}}

/* vault + settings */
.ladder{display:grid;gap:12px}
.rung{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;padding:16px}
.rung .lv{width:52px;height:58px;display:grid;place-items:center;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:radial-gradient(circle at 30% 18%,rgba(255,255,255,.45),transparent 52%),linear-gradient(155deg,#7dd5ff,#2f6fe8 55%,#1b45c8);font-family:var(--head);font-weight:800;font-size:22px;text-shadow:0 2px 8px rgba(0,24,90,.5)}
.rung h4{margin:0;font-family:var(--head);font-weight:700;font-size:17px;letter-spacing:.08em;text-transform:uppercase}
.rung .meta{font-family:var(--body);font-weight:600;font-size:10.5px;letter-spacing:.12em;color:var(--blue2);text-transform:uppercase;margin:3px 0 5px}
.rung p{margin:0;font-size:14px;line-height:1.45;color:var(--muted)}
.log{display:grid;gap:12px}
.log-item{padding:16px}
.log-item .row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.log-item h4{margin:0;font-family:var(--head);font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase}
.log-item .meta{font-family:var(--body);font-weight:600;font-size:10.5px;letter-spacing:.1em;color:var(--blue2);text-transform:uppercase;margin-top:4px}
.log-item p{margin:10px 0 12px;font-size:15px;line-height:1.45}
.enjoyed{color:var(--muted)}
.note{color:var(--muted);font-size:14px;line-height:1.5;margin:0 0 14px}
.field{display:block;margin-bottom:16px}
.field span{display:block;font-family:var(--body);font-weight:700;font-size:10.5px;letter-spacing:.18em;color:var(--blue2);text-transform:uppercase;margin-bottom:8px}
.input{width:100%;min-height:50px;padding:11px 14px;border-radius:14px;border:1px solid var(--line-strong);background:rgba(3,8,22,.7);color:var(--white);font-size:17px;outline:none;transition:border-color .2s,box-shadow .2s}
.input:focus{border-color:var(--blue2);box-shadow:0 0 0 3px rgba(92,200,255,.2)}
textarea.input{min-height:100px;resize:none;line-height:1.4}
.stack{display:grid;gap:12px}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:14.5px;padding:10px 0;border-bottom:1px solid rgba(120,176,255,.12)}
.kv:last-of-type{border-bottom:0}
.kv b{font-family:var(--body);font-weight:600;font-size:13px;letter-spacing:.04em;text-align:right}

/* tab bar: floating glass pill (4 tabs, sliding highlight) */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px 14px calc(env(safe-area-inset-bottom) + 10px);background:linear-gradient(180deg,rgba(3,8,22,0),rgba(3,8,22,.88) 45%)}
.tabs .in{position:relative;max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:6px;border:1px solid var(--line-strong);border-radius:24px;background:rgba(8,18,52,.74);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 18px 40px -10px rgba(0,6,30,.85),0 0 28px rgba(47,139,255,.14);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%)}
.tab-ind{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 30px) / 4);border-radius:18px;pointer-events:none;
  background:linear-gradient(180deg,rgba(90,170,255,.34),rgba(47,139,255,.12));box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 0 18px rgba(92,200,255,.25);
  transform:translateX(calc(var(--i,0) * (100% + 6px)));transition:transform .4s cubic-bezier(.4,0,.2,1)}
.tab{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:18px;color:var(--muted);font-family:var(--head);font-weight:700;font-size:11px;letter-spacing:.16em;text-transform:uppercase;transition:color .3s ease,transform .12s ease}
.tab:active{transform:scale(.94)}
.tab svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linejoin:round;stroke-linecap:round;transition:filter .3s ease}
.tab.on{color:var(--white)}
.tab.on svg{filter:drop-shadow(0 0 6px var(--blue2))}
/* while the welcome / recovery screen is showing, there is nothing to navigate to */
.rescuing .tabs{display:none}
.rescuing #app{padding-bottom:calc(env(safe-area-inset-bottom) + 32px)}

/* modal */
#overlay{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(2,6,20,.74);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);overflow-y:auto}
#overlay.show{display:flex}
.win{width:100%;max-width:490px;margin:auto;padding:24px 22px;border-radius:26px;border-color:var(--line-strong);background:linear-gradient(165deg,rgba(28,60,140,.92),rgba(8,18,54,.97));box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 30px 70px -10px rgba(0,4,24,.9),0 0 40px rgba(47,139,255,.18);animation:pop .3s cubic-bezier(.2,.9,.3,1.1)}
@keyframes pop{from{transform:scale(.94) translateY(8px);opacity:0}to{transform:none;opacity:1}}
.win .wtag{display:flex;align-items:center;gap:9px;margin-bottom:14px}
.win .wtag::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--blue2);box-shadow:0 0 10px var(--blue2)}
.win h3{font-family:var(--head);font-weight:700;font-size:26px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 6px;text-shadow:0 0 18px rgba(92,200,255,.35)}
.win .sub{font-family:var(--body);font-weight:600;font-size:11.5px;letter-spacing:.16em;color:var(--blue2);text-transform:uppercase;margin:0 0 16px}
.win p{margin:0 0 14px;color:var(--white);font-size:16px;line-height:1.5}
.win p.small{font-size:14px;color:var(--muted)}
.win .reward{border:1px solid var(--line);background:rgba(47,139,255,.1);padding:14px 16px;border-radius:var(--r-sm);margin-bottom:16px;line-height:1.5}
.win .reward b{display:block;font-family:var(--body);font-weight:700;font-size:10.5px;letter-spacing:.18em;color:var(--blue2);text-transform:uppercase;margin-bottom:5px}
.win .actions{display:grid;gap:12px}

<script>
(() => {
'use strict';

/* ============ constants ============ */
const APP_VERSION = '1.9.0';
const MAX_HABITS = 10;
const MAX_NOTE = 200, MAX_MINI = 60;   // length limits for a habit's note and 2-minute version
// Backup reminders: the banner shows when this many changes (or days with any change) have passed since the last backup.
const BACKUP_CHANGES = 10, BACKUP_DAYS = 3;
const SNAP_KEEP = 5;   // how many daily safety copies and how many event safety copies the app keeps
// Quest ladder. "savers" = streak savers given as a bonus when the quest is claimed.
const TIERS = [
  {n:1,  days:2,   xp:25,   savers:0, title:'Awakened',    reward:'A small treat: your favourite drink or snack'},
  {n:2,  days:5,   xp:60,   savers:0, title:'Disciplined', reward:'30 minutes of guilt-free fun'},
  {n:3,  days:10,  xp:120,  savers:1, title:'Resolute',    reward:'A movie night or a meal you love'},
  {n:4,  days:15,  xp:200,  savers:0, title:'Elite',       reward:'Buy yourself something small you have been wanting'},
  {n:5,  days:20,  xp:300,  savers:0, title:'Sovereign',   reward:'A big reward you have earned: plan something special'},
  {n:6,  days:50,  xp:600,  savers:2, title:'Vanguard',    reward:'A proper treat: a meal out or something you have been craving'},
  {n:7,  days:75,  xp:800,  savers:0, title:'Champion',    reward:'Something that feeds your growth: a book, a course or gear for a hobby'},
  {n:8,  days:100, xp:1100, savers:3, title:'Centurion',   reward:'A day out or an experience you will remember'},
  {n:9,  days:150, xp:1600, savers:3, title:'Paragon',     reward:'A gift for yourself that you have wanted for a long time'},
  {n:10, days:200, xp:2200, savers:3, title:'Ascendant',   reward:'A full day that is only about you: plan it your way'},
  {n:11, days:250, xp:2800, savers:3, title:'Titan',       reward:'Celebrate with the people who support you: a special dinner or outing'},
  {n:12, days:300, xp:3500, savers:4, title:'Monarch',     reward:'A meaningful upgrade for something you use every day'},
  {n:13, days:365, xp:5000, savers:5, title:'Legend',      reward:'A full year of discipline: a trip or a purchase you will remember for life'}
];
// Rank letters by player LEVEL.
const RANKS = [{min:1,l:'E'},{min:50,l:'D'},{min:100,l:'C'},{min:150,l:'B'},{min:200,l:'A'},{min:365,l:'S'}];
// Level 1 to 2 costs LV_BASE XP. Every next level costs LV_STEP XP more than the one before.
const LV_BASE = 25, LV_STEP = 2;
const DAY_LETTERS = 'MTWTFSS';
const DAY_SHORT = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];   // weekday index 0 = Monday ... 6 = Sunday
const DB_NAME = 'habsys', STORE = 'kv', DB_KEY = 'state', LS_KEY = 'habsys_state_v1';
const CACHE_NAME = 'habsys-data';   // third storage area (Cache Storage). sw.js must never delete it.
const CHECK = '<svg class="ck" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const PENCIL = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1-5L16.5 3.5l4 4L9 19z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>';
const DOTS = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="2.1"/><circle cx="12" cy="12" r="2.1"/><circle cx="12" cy="19" r="2.1"/></svg>';
const SHIELD = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 3v5.5c0 4.3-2.8 7.6-7 9.5-4.2-1.9-7-5.2-7-9.5V6z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg>';
const SHIELD_CK = SHIELD.replace('<svg ', '<svg class="ck" ');

/* ============ helpers ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const dkey = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const parseKey = k => { const p = k.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
const uid = () => 'h' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const fmtDate = iso => { try { return new Date(iso).toLocaleDateString(undefined, {day:'numeric', month:'short', year:'numeric'}); } catch (e) { return ''; } };
const fmtKey = k => { try { return parseKey(k).toLocaleDateString(undefined, {day:'numeric', month:'short', year:'numeric'}); } catch (e) { return ''; } };
const saverTxt = n => n ? ' · +' + n + ' saver' + (n > 1 ? 's' : '') : '';
const sleep = ms => new Promise(r => setTimeout(r, ms));
const withTimeout = (p, ms) => new Promise((res, rej) => {
  const t = setTimeout(() => rej(new Error('timeout')), ms);
  p.then(v => { clearTimeout(t); res(v); }, e => { clearTimeout(t); rej(e); });
});
function weekDays() {
  const t = new Date(), dow = (t.getDay() + 6) % 7, mon = addDays(t, -dow);
  return Array.from({length: 7}, (_, i) => addDays(mon, i));
}
// Small fingerprint (cyrb53). Used to detect damaged copies and damaged backup files. Not a password.
function sum53(str) {
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < str.length; i++) {
    const ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
}

/* ============ state ============ */
// In habit.done: 1 = habit done, 2 = day protected by a streak saver.
// habit.lite = days (keys) that were done with the 2-minute version. Those days are ALSO done = 1, so they count as real days.
// habit.mini = text of the 2-minute version ('' = none). habit.note = free note ('' = none).
// habit.days = weekdays the habit is followed on (0 = Monday ... 6 = Sunday, sorted). [] = every day (a normal habit).
// changes = number of edits since the last backup. bigMoment = a quest/habit milestone happened since the last backup.
function defaultState() {
  return { v:2, player:{name:'Player', xp:0}, savers:0, habits:[], rewards:[], rewardText:{}, lastBackup:null, changes:0, bigMoment:false, updatedAt:0 };
}
function validState(s) { return !!s && typeof s === 'object' && Array.isArray(s.habits); }
function normalize(raw) {
  const s = defaultState();
  if (!validState(raw)) return s;
  const p = raw.player || {};
  s.player.name = String(p.name || 'Player').trim().slice(0, 24) || 'Player';
  s.player.xp = Math.max(0, Math.floor(Number(p.xp) || 0));
  s.habits = raw.habits.slice(0, MAX_HABITS).map(h => {
    const done = {}, lite = {};
    if (h && h.done && typeof h.done === 'object') {
      for (const k of Object.keys(h.done)) if (/^\d{4}-\d{2}-\d{2}$/.test(k) && h.done[k]) done[k] = Number(h.done[k]) === 2 ? 2 : 1;
    }
    // A 2-minute day only makes sense on a day that is done.
    if (h && h.lite && typeof h.lite === 'object') {
      for (const k of Object.keys(h.lite)) if (h.lite[k] && done[k] === 1) lite[k] = true;
    }
    // Flexible habit days: only whole numbers 0 to 6, no repeats, sorted. All 7 days means "every day" = [].
    const days = [...new Set((Array.isArray(h && h.days) ? h.days : []).map(Number).filter(n => Number.isInteger(n) && n >= 0 && n <= 6))].sort((a, b) => a - b);
    return {
      id: String((h && h.id) || uid()),
      name: String((h && h.name) || 'Habit').trim().slice(0, 30) || 'Habit',
      created: /^\d{4}-\d{2}-\d{2}$/.test(h && h.created) ? h.created : dkey(new Date()),
      done: done,
      lite: lite,
      mini: String((h && h.mini) || '').trim().slice(0, MAX_MINI),
      note: String((h && h.note) || '').trim().slice(0, MAX_NOTE),
      days: days.length === 7 ? [] : days,
      claimed: Math.min(TIERS.length, Math.max(0, Math.floor(Number(h && h.claimed) || 0)))
    };
  });
  s.rewards = (Array.isArray(raw.rewards) ? raw.rewards : []).slice(0, 500).map(r => ({
    id: String(r.id || uid()), habitId: String(r.habitId || ''), habitName: String(r.habitName || 'Habit').slice(0, 30),
    tier: Math.min(TIERS.length, Math.max(1, Math.floor(Number(r.tier) || 1))), title: String(r.title || '').slice(0, 30),
    xp: Math.max(0, Math.floor(Number(r.xp) || 0)), text: String(r.text || '').slice(0, 160),
    at: String(r.at || ''), enjoyed: !!r.enjoyed
  }));
  // Data from version 1.0 has no savers yet: give the savers for quests already claimed.
  s.savers = raw.savers === undefined
    ? s.rewards.reduce((n, r) => n + (TIERS[r.tier - 1] ? TIERS[r.tier - 1].savers : 0), 0)
    : Math.max(0, Math.floor(Number(raw.savers) || 0));
  const rt = raw.rewardText && typeof raw.rewardText === 'object' ? raw.rewardText : {};
  for (const t of TIERS) if (typeof rt[t.n] === 'string' && rt[t.n].trim()) s.rewardText[t.n] = rt[t.n].trim().slice(0, 160);
  s.lastBackup = typeof raw.lastBackup === 'string' ? raw.lastBackup : null;
  s.changes = Math.max(0, Math.floor(Number(raw.changes) || 0));
  s.bigMoment = !!raw.bigMoment;
  s.updatedAt = Number(raw.updatedAt) || 0;
  return s;
}
const meaningful = st => !!st && (st.habits.length > 0 || st.player.xp > 0 || st.rewards.length > 0);

/* ============ storage: 3 protected copies + safety copies ============ */
// Every save goes to THREE separate storage areas (IndexedDB, localStorage, Cache Storage). Each copy carries a
// fingerprint, so a damaged copy is detected and the app falls back to a good one. The app never writes an
// empty state over data it could not read, and it keeps daily safety copies it can restore from by itself.
let S = defaultState();
let storageNote = '';
let persistState = 'unknown'; // 'granted' | 'denied' | 'unsupported' | 'unknown'
let health = {idb:null, ls:null, cache:null};
let writesLocked = false;     // true while the stored data could not be read: nothing is written until the person decides
let dbPromise = null;

function makeRec(state) {
  const data = JSON.stringify(state);
  return {fmt:2, app:APP_VERSION, savedAt:Date.now(), sum:sum53(data), data:data};
}
// Reads one stored copy. Returns null (nothing there), {bad:true} (damaged) or {state, upd, app}.
function unpack(x) {
  if (x === undefined || x === null || x === '') return null;
  try {
    if (typeof x === 'string') x = JSON.parse(x);
    if (x && x.fmt === 2 && typeof x.data === 'string') {
      if (sum53(x.data) !== x.sum) return {bad:true};
      const st = JSON.parse(x.data);
      if (!validState(st)) return {bad:true};
      return {state: normalize(st), upd: Number(st.updatedAt) || 0, app: x.app || null};
    }
    if (validState(x)) return {state: normalize(x), upd: Number(x.updatedAt) || 0, app: null}; // copy written by version 1.5.x or older
  } catch (e) {}
  return {bad:true};
}

function idb() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((res, rej) => {
    if (!window.indexedDB) return rej(new Error('IndexedDB unavailable'));
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => { r.result.createObjectStore(STORE); };
    r.onsuccess = () => {
      const db = r.result;
      db.onclose = () => { dbPromise = null; };
      db.onversionchange = () => { db.close(); dbPromise = null; };
      res(db);
    };
    r.onerror = () => rej(r.error);
    r.onblocked = () => rej(new Error('IndexedDB blocked'));
  });
  dbPromise.catch(() => { dbPromise = null; });
  return dbPromise;
}
// iOS can close the database connection in the background: reconnect once and try again.
async function idbRun(fn) {
  try { return await fn(await idb()); }
  catch (e) { dbPromise = null; return await fn(await idb()); }
}
const idbGet = k => idbRun(db => new Promise((res, rej) => {
  const rq = db.transaction(STORE, 'readonly').objectStore(STORE).get(k);
  rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error);
}));
const idbSet = (k, v) => idbRun(db => new Promise((res, rej) => {
  const tx = db.transaction(STORE, 'readwrite'); tx.objectStore(STORE).put(v, k);
  tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
}));

const cacheUrl = k => new URL('./__habsys_' + k + '.json', location.href).href;
async function cacheGet(k) {
  if (!window.caches) return undefined;
  const c = await caches.open(CACHE_NAME), r = await c.match(cacheUrl(k));
  return r ? await r.text() : undefined;
}
async function cachePut(k, text) {
  if (!window.caches) throw new Error('Cache Storage unavailable');
  const c = await caches.open(CACHE_NAME);
  await c.put(cacheUrl(k), new Response(text, {headers:{'content-type':'application/json'}}));
}

function updateNote() {
  const vals = [health.idb, health.ls, health.cache].filter(v => v !== null);
  const ok = vals.filter(Boolean).length;
  storageNote = ok === 0 ? 'Could not save to this device. Save a backup file now.'
    : ok < vals.length ? 'One storage area is unavailable. Your data is still saved in the others.' : '';
}
function writeAll(rec) {
  const str = JSON.stringify(rec);
  let ls = false;
  try { localStorage.setItem(LS_KEY, str); ls = true; } catch (e) {}
  const a = withTimeout(idbSet(DB_KEY, rec), 8000).then(() => true, () => { dbPromise = null; return false; });
  const b = window.caches ? withTimeout(cachePut('state', str), 8000).then(() => true, () => false) : Promise.resolve(null);
  Promise.all([a, b]).then(r => { health = {idb:r[0], ls:ls, cache:r[1]}; updateNote(); });
}
// opts.noCount = this save is housekeeping, not a change the person made.
function save(opts) {
  S.updatedAt = Date.now();
  if (!(opts && opts.noCount)) S.changes = (S.changes || 0) + 1;
  if (writesLocked) return;
  writeAll(makeRec(S));
  maybeSnap();
}
// Re-write the current copy when the app goes to the background, in case a write was still in flight.
function flush() { if (!writesLocked && !ui.rescue) { writeAll(makeRec(S)); maybeSnap(); } }

/* ---- safety copies (invisible: used only for automatic recovery) ---- */
// 'snaps' = one copy per day (last 5). 'events' = copies taken at key moments (upgrade, quest claimed; last 5).
// Both lists are also mirrored into Cache Storage.
let snapChain = Promise.resolve();
async function readList(key) {
  try { const v = await withTimeout(idbGet(key), 4000); return Array.isArray(v) ? v : (v == null ? [] : null); }
  catch (e) { return null; }   // null = could not read: never write over it
}
async function mirrorSnaps() {
  try {
    const a = await readList('snaps'), b = await readList('events');
    if (a && b) await cachePut('snaps', JSON.stringify({snaps:a, events:b}));
  } catch (e) {}
}
// The daily copy of today is refreshed at most every SNAP_REFRESH ms, so it never falls far behind your real data.
const SNAP_REFRESH = 20 * 60000;
let lastSnapAt = 0;
function maybeSnap() {
  if (writesLocked || ui.rescue || !meaningful(S) || Date.now() - lastSnapAt < SNAP_REFRESH) return;
  lastSnapAt = Date.now();
  snapshot('daily');
}
function snapshot(kind) {
  if (writesLocked || !meaningful(S)) return;
  const rec = makeRec(S), day = dkey(new Date()), at = Date.now(), key = kind === 'daily' ? 'snaps' : 'events';
  if (kind === 'daily') lastSnapAt = at;
  snapChain = snapChain.then(async () => {
    const list = await readList(key);
    if (list === null) return;
    const entry = {kind:kind, day:day, at:at, rec:rec};
    if (kind === 'daily') {
      const i = list.findIndex(e => e && e.day === day);
      if (i >= 0) {
        if (at - (Number(list[i].at) || 0) < SNAP_REFRESH) return;   // today's copy is recent enough
        list[i] = entry;                                              // refresh today's copy in place
      } else list.unshift(entry);
    } else list.unshift(entry);
    await idbSet(key, list.slice(0, SNAP_KEEP));
    await mirrorSnaps();
  }).catch(() => {});
}
function clearSnaps() {
  snapChain = snapChain.then(async () => {
    try { await idbSet('snaps', []); await idbSet('events', []); } catch (e) {}
    try { await cachePut('snaps', JSON.stringify({snaps:[], events:[]})); } catch (e) {}
  }).catch(() => {});
}
async function readSnapshots() {
  let a = await readList('snaps'), b = await readList('events');
  if (a === null || b === null) {
    try {
      const m = JSON.parse(await withTimeout(cacheGet('snaps'), 4000) || 'null');
      if (m) { if (a === null) a = m.snaps; if (b === null) b = m.events; }
    } catch (e) {}
  }
  const out = [];
  for (const e of [].concat(Array.isArray(a) ? a : [], Array.isArray(b) ? b : [])) {
    const u = e && unpack(e.rec);
    if (u && u.state) out.push({state:u.state, app:u.app, at:Number(e.at) || 0});
  }
  return out;
}

/* ---- loading: pick the best good copy, repair, or ask ---- */
// status: 'ok' | 'recovered' | 'fresh' (nothing stored anywhere) | 'damaged' | 'unreadable' (stored data could not be read)
async function loadAll() {
  let idbRaw, idbErr = false;
  for (let i = 0; i < 3; i++) {
    try { idbRaw = await withTimeout(idbGet(DB_KEY), 4000); idbErr = false; break; }
    catch (e) { idbErr = !!window.indexedDB; dbPromise = null; if (i < 2) await sleep(400); }
  }
  let lsRaw = null; try { lsRaw = localStorage.getItem(LS_KEY); } catch (e) {}
  let cRaw; try { cRaw = await withTimeout(cacheGet('state'), 4000); } catch (e) {}
  const cand = [unpack(idbRaw), unpack(lsRaw), unpack(cRaw)];
  const good = cand.filter(c => c && c.state).sort((a, b) => b.upd - a.upd);
  const anyBad = cand.some(c => c && c.bad);
  const snaps = await readSnapshots();
  if (good.length) {
    const best = good[0];
    // Progress can only go up by itself (XP and rewards never shrink unless you erase or restore, and both of those
    // reset the safety copies). A safety copy with more progress than the live data means something went wrong.
    const lost = snaps
      .filter(s => s.state.player.xp > best.state.player.xp || s.state.rewards.length > best.state.rewards.length)
      .sort((a, b) => (b.state.player.xp - a.state.player.xp) || (b.at - a.at))[0];
    if (lost) return {state:lost.state, status:'recovered', app:lost.app};
    return {state:best.state, status:'ok', app:best.app};
  }
  if (snaps.length) {
    const s = snaps.sort((a, b) => b.at - a.at)[0];
    return {state:s.state, status:'recovered', app:s.app};
  }
  if (anyBad) return {state:defaultState(), status:'damaged'};
  if (idbErr) return {state:defaultState(), status:'unreadable'};
  return {state:defaultState(), status:'fresh'};
}

async function askPersist() {
  try {
    if (navigator.storage && navigator.storage.persisted) {
      if (await navigator.storage.persisted()) { persistState = 'granted'; return; }
      if (navigator.storage.persist) persistState = (await navigator.storage.persist()) ? 'granted' : 'denied';
      else persistState = 'unsupported';
    } else persistState = 'unsupported';
  } catch (e) { persistState = 'unsupported'; }
  if (ui.tab === 'system' && !ui.rescue) render();
}

/* ============ game logic ============ */
// Flexible habits: habit.days lists the weekdays (0 = Monday ... 6 = Sunday) the habit is followed on. [] = every day.
// A day that is not on the schedule is a rest day: it is hidden, it never breaks a streak and it is never "missed".
// A rest day that was still marked done (for example from before the habit became flexible) keeps counting as done.
const wdOf = d => (d.getDay() + 6) % 7;
const isSched = (h, d) => !h.days || !h.days.length || h.days.indexOf(wdOf(d)) >= 0;
const isSchedKey = (h, k) => isSched(h, parseKey(k));
function daysLabel(days) {
  if (!days || !days.length) return 'Every day';
  const n = days.length, nm = days.map(i => DAY_SHORT[i]);
  return n >= 3 && days[n - 1] - days[0] === n - 1 ? nm[0] + ' – ' + nm[n - 1] : nm.join(', ');
}
function nextSchedName(h) {
  for (let i = 1; i <= 7; i++) { const d = addDays(new Date(), i); if (isSched(h, d)) return DAY_SHORT[wdOf(d)]; }
  return '';
}
// Streaks count only days where the habit was really done (full habit OR the 2-minute version).
// A day protected by a streak saver keeps the streak alive but does not add a day to it.
// A rest day (flexible habit) that is not done is simply skipped.
// Real done-days in the unbroken run that ends on day "start" (going backwards).
function runBack(h, start) {
  let d = start, n = 0;
  for (let i = 0; i < 5000; i++) {
    const v = h.done[dkey(d)];
    if (v) { if (v === 1) n++; }
    else if (isSched(h, d)) break;
    d = addDays(d, -1);
  }
  return n;
}
function currentStreak(h) {
  const t = new Date();
  return runBack(h, h.done[dkey(t)] ? t : addDays(t, -1));
}
function longestStreak(h) {
  const ks = Object.keys(h.done).sort();
  if (!ks.length) return 0;
  let best = 0, run = 0;
  const end = parseKey(ks[ks.length - 1]);
  for (let d = parseKey(ks[0]); d <= end; d = addDays(d, 1)) {
    const v = h.done[dkey(d)];
    if (v) { if (v === 1) run++; if (run > best) best = run; }
    else if (isSched(h, d)) run = 0;
  }
  return best;
}
// Real done-days in the unbroken run that ends the day before day k.
function chainBefore(h, k) {
  return runBack(h, addDays(parseKey(k), -1));
}
function claimableCount(h) {
  const L = longestStreak(h);
  return TIERS.filter(t => t.n > h.claimed && L >= t.days).length;
}
const xpFor = L => LV_BASE * (L - 1) + LV_STEP * (L - 1) * (L - 2) / 2;   // total XP needed to reach level L
function levelOf(xp) {
  const a = LV_STEP / 2, b = LV_BASE - a;
  let L = Math.max(1, Math.floor((-b + Math.sqrt(b * b + 4 * a * xp)) / (2 * a)) + 1);
  while (xpFor(L + 1) <= xp) L++;
  while (L > 1 && xpFor(L) > xp) L--;
  return L;
}
const lvlStart = L => xpFor(L);
const rankOf = L => { let r = 'E'; for (const x of RANKS) if (L >= x.min) r = x.l; return r; };
const rewardTextFor = t => S.rewardText[t.n] || t.reward;
const findHabit = id => S.habits.find(h => h.id === id);

// Backup reminder: counts edits since the last backup, and reacts to big moments (quest claimed, habit added).
function backupInfo() {
  if (!meaningful(S)) return {due:false};
  const ch = S.changes || 0;
  let days = null;
  if (S.lastBackup) { const t = new Date(S.lastBackup).getTime(); if (!isNaN(t)) days = Math.max(0, Math.floor((Date.now() - t) / 86400000)); }
  const ago = days === null ? 'never' : days === 0 ? 'today' : days === 1 ? 'yesterday' : days + ' days ago';
  let due = false, msg = '';
  if (days === null) { due = true; msg = 'You have never saved a backup. Save one now so your progress is safe.'; }
  else if (ch > 0 && S.bigMoment) { due = true; msg = 'Big moment recorded. Save a backup now to lock in your progress.'; }
  else if (ch >= BACKUP_CHANGES || (ch > 0 && days >= BACKUP_DAYS)) {
    due = true; msg = ch + ' change' + (ch === 1 ? '' : 's') + ' since your last backup (' + ago + '). Save one so your progress is safe.';
  }
  return {due:due, msg:msg, changes:ch, days:days, ago:ago};
}

/* ============ UI state + render ============ */
const TABS = ['habits', 'vault', 'records', 'system'];
const ui = { tab: 'habits', day: dkey(new Date()), rec: null, rescue: null };  // rescue: null | 'fresh' | 'damaged' | 'unreadable'

function renderNav() {
  document.querySelectorAll('.tab').forEach(t => {
    const on = t.dataset.tab === ui.tab;
    t.classList.toggle('on', on);
    if (on) t.setAttribute('aria-current', 'page'); else t.removeAttribute('aria-current');
  });
  $('.tabs .in').style.setProperty('--i', String(TABS.indexOf(ui.tab)));
}
function renderView() {
  const now = new Date();
  $('#today-label').innerHTML = esc(now.toLocaleDateString(undefined, {weekday:'short'})) + '<br>' + esc(now.toLocaleDateString(undefined, {day:'2-digit', month:'short'}));
  $('#view').innerHTML = ui.rescue ? viewRescue() : ui.tab === 'habits' ? viewHabits() : ui.tab === 'vault' ? viewVault() : ui.tab === 'records' ? viewRecords() : viewSystem();
}
function render() { document.body.classList.toggle('rescuing', !!ui.rescue); renderNav(); renderView(); }

// Smooth fade/slide for the content area.
function playIn(dx) {
  const v = $('#view');
  v.style.setProperty('--dx', dx + 'px');
  v.classList.remove('v-in', 'v-out');
  void v.offsetWidth;
  v.classList.add('v-in');
}
const reduceMotion = () => !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
let swapTimer;
function switchTab(name) {
  if (TABS.indexOf(name) < 0 || ui.rescue) return;
  if (name === ui.tab) { window.scrollTo(0, 0); return; }
  const dir = TABS.indexOf(name) > TABS.indexOf(ui.tab) ? 1 : -1;
  ui.tab = name;
  renderNav();
  if (reduceMotion()) { renderView(); window.scrollTo(0, 0); return; }
  const v = $('#view');
  v.style.setProperty('--dx', (dir * 28) + 'px');
  v.classList.remove('v-in');
  v.classList.add('v-out');
  clearTimeout(swapTimer);
  swapTimer = setTimeout(() => { renderView(); window.scrollTo(0, 0); playIn(dir * 28); }, 130);
}

/* ---- welcome / recovery screen: shown only when no saved progress could be loaded ---- */
function viewRescue() {
  if (ui.rescue === 'fresh') {
    return `
    <section class="panel empty">
      <div class="tag">[ System ]</div>
      <h3>Welcome</h3>
      <p>No saved progress was found on this device.</p>
      <p>If you already use Habsys and just re-added the icon or reset your iPad, restore your backup file now and everything comes back, including streaks, XP and rewards.</p>
      <p>If this is your first time, start fresh.</p>
      <div class="stack">
        <button class="btn block" data-action="restore">Restore my progress</button>
        <button class="btn ghost block" data-action="startfresh">Start fresh</button>
      </div>
    </section>`;
  }
  const damaged = ui.rescue === 'damaged';
  return `
    <section class="panel empty">
      <div class="tag">[ System ]</div>
      <h3>${damaged ? 'Saved data is damaged' : 'Could not read your data'}</h3>
      <p>${damaged
        ? 'A saved copy was found on this device, but it did not pass its safety check. Nothing has been changed or deleted.'
        : 'Your iPad did not answer when the app asked for your saved data. Nothing has been deleted. Close the app completely and open it again, or try once more.'}</p>
      <div class="stack">
        <button class="btn block" data-action="retry">Try again</button>
        <button class="btn ghost block" data-action="restore">Restore from backup file</button>
        ${damaged ? '<button class="btn danger block" data-action="askfresh">Start fresh</button>' : ''}
      </div>
    </section>`;
}

function viewHabits() {
  const L = levelOf(S.player.xp), a = lvlStart(L), b = lvlStart(L + 1);
  const pct = Math.round((S.player.xp - a) / (b - a) * 100);
  const top = Math.max(0, ...S.habits.map(h => h.claimed));
  const title = top ? TIERS[top - 1].title : 'Newcomer';
  let html = `
  <section class="panel player">
    <div class="rank">${rankOf(L)}</div>
    <div class="p-info">
      <div class="p-name">${esc(S.player.name)}</div>
      <div class="p-sub">Title · ${esc(title)}</div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="xp-txt">XP ${S.player.xp.toLocaleString()} / ${b.toLocaleString()}</div>
      <div class="sv-line">${SHIELD}Streak savers · ${S.savers}</div>
    </div>
    <div class="p-lv"><small>LV</small><b>${L}</b></div>
  </section>`;
  const bi = backupInfo();
  if (bi.due) {
    html += `<section class="panel banner"><p><span class="tag">[ System ]</span><br>${esc(bi.msg)}</p><button class="btn sm" data-action="backup">Back up</button></section>`;
  }
  if (!S.habits.length) {
    html += `<section class="panel empty"><div class="tag">[ System ]</div><h3>Welcome, ${esc(S.player.name)}</h3><p>You have no habits yet. Add your first one (up to ${MAX_HABITS}) and start your first quest.</p></section>`;
  }
  html += '<div class="habits">' + S.habits.map(habitCard).join('');
  if (S.habits.length < MAX_HABITS) {
    html += `<button class="panel add" data-action="add"><div>+ New habit<small>${S.habits.length} / ${MAX_HABITS} slots used</small></div></button>`;
  } else {
    html += `<div class="panel add full"><div>All slots in use<small>${MAX_HABITS} / ${MAX_HABITS} habits</small></div></div>`;
  }
  html += '</div>';
  return html;
}

// The days, the 2-minute version and the note are drawn only when the habit has them. No empty placeholders.
function extrasHtml(h) {
  let x = '';
  if (h.days && h.days.length) x += `<div class="x-line"><span class="x-tag">Days</span><span>${esc(daysLabel(h.days))}</span></div>`;
  if (h.mini) x += `<div class="x-line"><span class="x-tag">2-min</span><span>${esc(h.mini)}</span></div>`;
  if (h.note) x += `<p class="x-note">${esc(h.note)}</p>`;
  return x ? `<div class="extras">${x}</div>` : '';
}

function habitCard(h) {
  const tk = dkey(new Date()), yk = dkey(addDays(new Date(), -1));
  const cur = currentStreak(h), cl = claimableCount(h), next = TIERS[h.claimed];
  const boxBtn = d => {
    const k = dkey(d), v = h.done[k], done = v === 1, saved = v === 2, future = k > tk, open = (k === tk || k === yk);
    const lite = done && !!(h.lite && h.lite[k]);
    const cls = ['box'];
    if (done) cls.push('done');
    if (lite) cls.push('lite');
    if (saved) cls.push('saved');
    if (k === tk) cls.push('today');
    if (future) cls.push('future');
    if (open) cls.push('open');
    if (k < h.created && !v) cls.push('pre');
    const label = (open ? (done ? 'Unmark ' : saved ? 'Return streak saver for ' : 'Mark ') : '') + d.toDateString() + (lite ? ', done with the 2-minute version' : done ? ', done' : saved ? ', protected by a streak saver' : '');
    return `<button class="${cls.join(' ')}" data-action="tick" data-id="${esc(h.id)}" data-day="${k}" aria-label="${esc(label)}" aria-pressed="${done}">${done ? CHECK + (lite ? '<b class="mb" aria-hidden="true">2</b>' : '') : saved ? SHIELD_CK : '<span>' + d.getDate() + '</span>'}</button>`;
  };
  const wk = weekDays();
  // Flexible habit: rest days are not drawn. (A rest day that is already marked stays visible so it can still be unmarked.)
  const flex = !!(h.days && h.days.length);
  const vis = wk.map((d, i) => ({d: d, i: i})).filter(x => isSched(h, x.d) || h.done[dkey(x.d)]);
  const boxes = vis.map(x => `<div class="col"><span class="dl">${DAY_LETTERS[x.i]}</span>${boxBtn(x.d)}</div>`).join('');
  const rest = (!isSched(h, new Date()) && !h.done[tk]) ? `<div class="rest">Rest day today · next: ${esc(nextSchedName(h))}</div>` : '';
  // On a Monday, yesterday (Sunday) belongs to last week's row, so it gets its own small line.
  const yd = addDays(new Date(), -1);
  const yrow = (wk.some(d => dkey(d) === yk) || !(isSched(h, yd) || h.done[yk])) ? '' : `<div class="yrow"><span class="dl">Yesterday · ${esc(yd.toLocaleDateString(undefined, {weekday:'short', day:'numeric', month:'short'}))}</span>${boxBtn(yd)}</div>`;
  let quest;
  if (cl > 0) {
    quest = `<button class="btn claim" data-action="claim" data-id="${esc(h.id)}">Quest complete · Claim reward</button>`;
  } else if (next) {
    const shown = Math.min(cur, next.days), p = Math.round(shown / next.days * 100);
    quest = `<div class="q-row"><span class="q-lbl">Next quest · Lv.${next.n} · ${next.days}-day streak</span><span class="q-val">${shown}/${next.days}</span></div><div class="bar"><i style="width:${p}%"></i></div>`;
  } else {
    quest = `<div class="q-row"><span class="q-lbl">All quests cleared · Legend</span></div>`;
  }
  const pips = TIERS.map(t => `<i class="pip ${t.n <= h.claimed ? 'on' : ''}"></i>`).join('');
  return `
  <section class="panel habit">
    <div class="h-head">
      <button class="h-name" data-action="edit" data-id="${esc(h.id)}" aria-label="Edit ${esc(h.name)}"><span>${esc(h.name)}</span>${PENCIL}</button>
      <button class="h-more" data-action="extras" data-id="${esc(h.id)}" aria-label="Options for ${esc(h.name)}: 2-minute habit, note, flexible days">${DOTS}</button>
      <div class="streak"><small>STREAK</small><b>${cur}</b></div>
    </div>
    ${extrasHtml(h)}
    <div class="week${flex ? ' flex' : ''}"${flex ? ` style="grid-template-columns:repeat(${vis.length},minmax(0,1fr))"` : ''}>${boxes}</div>${rest}${yrow}
    <div class="quest">${quest}<div class="pips">${pips}<span>${h.claimed}/${TIERS.length} cleared</span></div></div>
  </section>`;
}

/* ---- records: full history of each habit ---- */
function habitStats(h) {
  const keys = Object.keys(h.done).sort();
  const nDone = keys.filter(k => h.done[k] === 1).length;
  const nSaved = keys.length - nDone;
  const nLite = keys.filter(k => h.done[k] === 1 && h.lite && h.lite[k]).length;
  const startKey = keys.length && keys[0] < h.created ? keys[0] : h.created;
  const today = new Date(), tk = dkey(today);
  const endKey = h.done[tk] ? tk : dkey(addDays(today, -1));
  // Only days that count: done days, and scheduled days that were not done. Rest days are left out.
  let tracked = 0, missed = 0;
  for (let d = parseKey(startKey); dkey(d) <= endKey; d = addDays(d, 1)) {
    if (h.done[dkey(d)]) tracked++;
    else if (isSched(h, d)) { tracked++; missed++; }
  }
  return {
    nDone: nDone, nSaved: nSaved, nLite: nLite, startKey: startKey, endKey: endKey, tracked: tracked,
    missed: missed,
    rate: tracked ? Math.round(nDone / tracked * 100) : null
  };
}
function monthPanel(h, y, m, st, tk) {
  const days = new Date(y, m + 1, 0).getDate(), offset = (new Date(y, m, 1).getDay() + 6) % 7;
  let cells = '', nDone = 0, tracked = 0;
  for (let i = 0; i < offset; i++) cells += '<i class="c x"></i>';
  for (let d = 1; d <= days; d++) {
    const k = y + '-' + pad(m + 1) + '-' + pad(d), v = h.done[k], inRange = k >= st.startKey && k <= st.endKey, sch = isSchedKey(h, k);
    let cls = 'c', inner = d;
    if (v === 1) { cls += ' d'; nDone++; if (h.lite && h.lite[k]) cls += ' l'; }
    else if (v === 2) { cls += ' s'; inner = SHIELD; }
    else if (inRange && sch) cls += ' m';
    else if (inRange) cls += ' r';
    else cls += ' o';
    if (inRange && (v || sch)) tracked++;
    if (k === tk) cls += ' t';
    cells += `<span class="${cls}">${inner}</span>`;
  }
  const pct = tracked ? ' · ' + Math.round(nDone / tracked * 100) + '%' : '';
  const name = new Date(y, m, 1).toLocaleDateString(undefined, {month:'long', year:'numeric'});
  return `<section class="panel"><div class="m-head"><h4>${esc(name)}</h4><span class="tag">${nDone} done${pct}</span></div><div class="m-grid">${DAY_LETTERS.split('').map(l => `<span class="wd">${l}</span>`).join('')}${cells}</div></section>`;
}
function viewRecords() {
  let html = '<h2 class="sec">Records</h2>';
  if (!S.habits.length) {
    return html + '<section class="panel empty"><div class="tag">[ System ]</div><h3>No history yet</h3><p>Add a habit in the Habits tab. Every day you complete will be recorded here.</p></section>';
  }
  const h = findHabit(ui.rec) || S.habits[0];

  const tile = (l, v, c) => `<div class="stat"><small>${l}</small><b${c ? ' class="' + c + '"' : ''}>${v}</b></div>`;
  html += `<section class="panel"><div class="tag" style="margin-bottom:12px">[ ${esc(h.name)} ]</div>${extrasHtml(h)}<div class="stats">`

  const rw = S.rewards.filter(r => r.habitId === h.id);
  html += '<h2 class="sec">Quests cleared</h2>';
  html += rw.length
    ? '<section class="panel">' + rw.map(r => `<div class="kv"><span>Lv.${r.tier} · ${esc(r.title)}</span><b>${esc(fmtDate(r.at))} · +${r.xp} XP</b></div>`).join('') + '</section>'
    : '<section class="panel empty"><p>No quests cleared on this habit yet.</p></section>';
  html += '<h2 class="sec">Full history</h2><div class="legend">'
    + '<span><i style="background:linear-gradient(145deg,var(--blue2),var(--blue3))"></i>Done</span>'
    + (st.nLite ? '<span><i class="lgl"></i>2-minute day</span>' : '')
    + '<span><i style="border:1px solid var(--blue2);background:rgba(47,139,255,.18)"></i>Saver used</span>'
    + (h.days && h.days.length ? '<span><i style="border:1px dashed rgba(88,166,255,.55)"></i>Rest day</span>' : '')
    + '<span><i style="border:1px solid rgba(255,141,161,.55)"></i>Missed</span></div>';
  const sd = parseKey(st.startKey), now = new Date(), months = [];
  let y = sd.getFullYear(), m = sd.getMonth();
  while (y < now.getFullYear() || (y === now.getFullYear() && m <= now.getMonth())) { months.push([y, m]); if (++m > 11) { m = 0; y++; } }
  html += '<div class="months">' + months.reverse().map(p => monthPanel(h, p[0], p[1], st, tk)).join('') + '</div>';
  return html;
}

/* ============ backup / restore ============ */
// A backup file carries a fingerprint of its data. On restore the fingerprint is checked, so a damaged or
// half-copied file is rejected instead of overwriting good data.
const backupSumOk = j => !!j && typeof j.checksum === 'string' && sum53(JSON.stringify(j.data)) === j.checksum;
async function doBackup() {
  if (ui.rescue) return;
  const payload = {app:'habsys', backupVersion:2, appVersion:APP_VERSION, exportedAt:new Date().toISOString(), checksum:sum53(JSON.stringify(S)), data:S};
  const name = 'habsys-backup-' + dkey(new Date()) + '.json';
  const text = JSON.stringify(payload, null, 2);
  // Check the file we are about to hand over reads back correctly.
  try {
    const back = JSON.parse(text);
    if (!backupSumOk(back) || !validState(back.data)) throw new Error('bad');
  } catch (e) { toast('Backup failed its safety check. Nothing was saved. Try again.'); return; }
  let saved = false;
  try {
    const file = new File([text], name, {type:'application/json'});
    if (navigator.canShare && navigator.canShare({files:[file]}) && navigator.share) {
      await navigator.share({files:[file], title:'Habsys backup'});
      saved = true;
    }
  } catch (e) {
    if (e && e.name === 'AbortError') return; // user cancelled the share sheet
  }
  if (!saved) {
    const url = URL.createObjectURL(new Blob([text], {type:'application/json'}));
    const a = document.createElement('a'); a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    saved = true;
  }
  if (saved) {
    S.lastBackup = new Date().toISOString(); S.changes = 0; S.bigMoment = false;
    save({noCount:true}); toast('Backup created. Keep the file safe.'); render();
  }
}
let pendingRestore = null, pendingRestoreAt = null;
function handleRestoreFile(file) {
  if (!file) return;
  if (file.size > 5000000) { toast('That file is too large to be a Habsys backup.'); return; }
  const r = new FileReader();
  r.onload = () => {
    let j = null;
    try { j = JSON.parse(String(r.result)); } catch (e) {}
    if (!j || j.app !== 'habsys' || !validState(j.data)) { toast('That file is not a Habsys backup.'); return; }
    let verified = false;
    if (typeof j.checksum === 'string') {
      if (!backupSumOk(j)) { toast('This backup file is damaged, so it was not used. Your current data is untouched.'); return; }
      verified = true;
    }
    pendingRestore = normalize(j.data);
    pendingRestoreAt = (j.exportedAt && !isNaN(new Date(j.exportedAt))) ? String(j.exportedAt) : null;
    const n = pendingRestore.habits.length, xp = pendingRestore.player.xp;
    let txt = `This backup has <b>${n} habit${n === 1 ? '' : 's'}</b> and <b>${xp.toLocaleString()} XP</b>` + (j.exportedAt ? ` (saved ${esc(fmtDate(j.exportedAt))})` : '')
      + (ui.rescue ? '.' : `. It will <b>replace</b> what is on this device now.`)
      + (verified ? ' The file passed its integrity check.' : ' This is an older file without an integrity check.');
    if (!ui.rescue && xp < S.player.xp) {
      txt += `<br><br><b>Warning:</b> this backup has less progress than what is on this device now (${S.player.xp.toLocaleString()} XP). Restoring will lose the difference.`;
    }
    confirmBox('Restore backup?', txt, 'dorestore', 'Restore');
  };
  r.onerror = () => toast('Could not read that file.');
  r.readAsText(file);
}

/* ============ actions ============ */
function afterChange(id, before) {
  save(); render();
  const h = findHabit(id);
  if (h && claimableCount(h) > before) openClaim(id);
}
// lite = true: the day was done with the 2-minute version (still a real done day).
function markDone(id, k, lite) {
  const h = findHabit(id); if (!h) return;
  const tk = dkey(new Date()), yk = dkey(addDays(new Date(), -1));
  if ((k !== tk && k !== yk) || h.done[k]) return;
  const before = claimableCount(h);
  h.done[k] = 1;
  if (!h.lite) h.lite = {};
  if (lite) h.lite[k] = true; else delete h.lite[k];
  afterChange(id, before);
  if (lite) toast('2-minute version done. Streak kept alive.');
}
function useSaver(id, k) {
  const h = findHabit(id); if (!h) return;
  const yk = dkey(addDays(new Date(), -1));
  if (k !== yk || h.done[k] || S.savers < 1 || !isSchedKey(h, k) || chainBefore(h, k) < 1) return;
  const before = claimableCount(h);
  h.done[k] = 2;
  S.savers -= 1;
  afterChange(id, before);
  toast('Streak saver used. Your streak is protected.');
}
function toggleDay(id, k) {
  const h = findHabit(id); if (!h) return;
  const tk = dkey(new Date()), yk = dkey(addDays(new Date(), -1));
  if (k !== tk && k !== yk) return;
  if (h.done[k] === 2) { // protected day: tapping again returns the saver
    delete h.done[k]; S.savers += 1; save(); render(); toast('Streak saver returned.'); return;
  }
  if (h.done[k]) { // done day (full or 2-minute): tapping again unmarks it
    const before = claimableCount(h);
    delete h.done[k];
    if (h.lite) delete h.lite[k];
    afterChange(id, before);
    return;
  }
  if (!isSchedKey(h, k)) return;   // rest day of a flexible habit: nothing to mark
  // Empty day: ask only when there is a real choice (a 2-minute version exists and/or a streak saver can be used).
  // A habit without either behaves exactly as before: one tap marks it done.
  if (h.mini || saverOkFor(h, k)) { openDayChoice(id, k); return; }
  markDone(id, k, false);
}
function startFresh() {
  closeModal();
  S = defaultState(); writesLocked = false; ui.rescue = null; ui.tab = 'habits';
  save({noCount:true}); render(); askPersist();
}

const actions = {
  tab: el => switchTab(el.dataset.tab),
  tick: el => toggleDay(el.dataset.id, el.dataset.day),
  rec: el => { ui.rec = el.dataset.id; renderView(); playIn(0); },
  info: openInfo,
  markdone: el => { closeModal(); markDone(el.dataset.id, el.dataset.day, false); },
  marklite: el => { closeModal(); markDone(el.dataset.id, el.dataset.day, true); },
  usesaver: el => { closeModal(); useSaver(el.dataset.id, el.dataset.day); },
  add: () => { if (S.habits.length >= MAX_HABITS) return; openHabitForm(null); },
  edit: el => openHabitForm(el.dataset.id),
  extras: el => openExtras(el.dataset.id),
  xmini: el => openMini(el.dataset.id),
  xnote: el => openNote(el.dataset.id),
  xdays: el => openDays(el.dataset.id),
  savemini: el => {
    const h = findHabit(el.dataset.id); if (!h) return;
    h.mini = ($('#hmini').value || '').trim().slice(0, MAX_MINI);
    save(); closeModal(); render();
  },
  savenote: el => {
    const h = findHabit(el.dataset.id); if (!h) return;
    h.note = ($('#hnote').value || '').trim().slice(0, MAX_NOTE);
    save(); closeModal(); render();
  },
  toggleday: el => { const on = !el.classList.contains('on'); el.classList.toggle('on', on); el.setAttribute('aria-pressed', String(on)); },
  savedays: el => {
    const a = Array.from(document.querySelectorAll('.dchip.on')).map(c => Number(c.dataset.d));
    if (!a.length) { toast('Tap at least one day, or choose Make it every day.'); return; }
    setDays(el.dataset.id, a);
  },
  alldays: el => setDays(el.dataset.id, []),
  close: closeModal,
  savehabit: el => {
    const name = ($('#hname').value || '').trim().slice(0, 30);
    if (!name) { toast('Give your habit a name.'); return; }
    const id = el.dataset.id;
    if (id) { const h = findHabit(id); if (h) h.name = name; }
    else {
      if (S.habits.length >= MAX_HABITS) return;
      const picked = Array.from(document.querySelectorAll('#overlay .dchip.on')).map(c => Number(c.dataset.d)).sort((a, b) => a - b);
      S.habits.push({id: uid(), name, created: dkey(new Date()), done: {}, lite: {}, mini: '', note: '', days: picked.length === 7 ? [] : picked, claimed: 0});
      S.bigMoment = true; askPersist();
    }
    save(); closeModal(); render();
  },
  delask: el => { const h = findHabit(el.dataset.id); if (h) confirmBox('Delete habit?', `<b>${esc(h.name)}</b> and its history will be removed. Rewards and XP you already earned stay.`, 'delete', 'Delete', `data-id="${esc(h.id)}"`); },
  delete: el => { S.habits = S.habits.filter(h => h.id !== el.dataset.id); save(); closeModal(); render(); },
  claim: el => openClaim(el.dataset.id),
  doclaim: el => doClaim(el.dataset.id),
  afterclaim: el => { closeModal(); const h = findHabit(el.dataset.id); if (h && claimableCount(h) > 0) openClaim(h.id); },
  editreward: el => openRewardEdit(Number(el.dataset.tier)),
  saveReward: el => { const v = ($('#rtext').value || '').trim().slice(0, 160); const n = Number(el.dataset.tier); if (v) S.rewardText[n] = v; else delete S.rewardText[n]; save(); closeModal(); render(); },
  resetReward: el => { delete S.rewardText[Number(el.dataset.tier)]; save(); closeModal(); render(); },
  enjoy: el => { const r = S.rewards.find(x => x.id === el.dataset.id); if (r) { r.enjoyed = !r.enjoyed; save(); render(); } },
  backup: doBackup,
  restore: () => { const f = $('#restoreFile'); f.value = ''; f.click(); },
  dorestore: () => {
    if (!pendingRestore) return;
    S = pendingRestore; pendingRestore = null;
    S.changes = 0; S.bigMoment = false; S.lastBackup = pendingRestoreAt || new Date().toISOString();
    writesLocked = false; ui.rescue = null; ui.tab = 'habits';
    clearSnaps();                 // safety copies of the old data must not undo this restore
    save({noCount:true});
    snapshot('daily');
    closeModal(); render(); toast('Backup restored.'); askPersist();
  },
  retry: () => { boot(); },
  askfresh: () => confirmBox('Start fresh?', 'The damaged copy on this device will be replaced by an empty start. If you have a backup file, use Restore instead.', 'startfresh', 'Start fresh'),
  startfresh: startFresh,
  erase: () => confirmBox('Erase everything?', 'All habits, XP and rewards on this device will be deleted, including the app\'s automatic safety copies. <b>Save a backup first</b> if you may want them back.', 'doerase', 'Erase all'),
  doerase: () => { S = defaultState(); clearSnaps(); save({noCount:true}); closeModal(); ui.tab = 'habits'; render(); toast('All data erased.'); }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) {
    if (e.target.id === 'overlay') closeModal();
    return;
  }
  const fn = actions[el.dataset.action];
  if (fn) fn(el);
});
document.addEventListener('change', e => {
  if (e.target.id === 'pname') { S.player.name = (e.target.value || '').trim().slice(0, 24) || 'Player'; save(); toast('Name saved.'); }
  if (e.target.id === 'restoreFile') handleRestoreFile(e.target.files && e.target.files[0]);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if (e.key === 'Enter' && e.target.id === 'hname') { const b = document.querySelector('[data-action="savehabit"]'); if (b) b.click(); }
});

/* new day / back to app => refresh */
function refreshIfNewDay() {
  const k = dkey(new Date());
  if (k !== ui.day) { ui.day = k; if (!ui.rescue) { snapshot('daily'); } render(); }
}
// If another window of the app saved newer data, take it instead of overwriting it with old data.
function adoptNewer() {
  if (ui.rescue || writesLocked) return;
  try { const u = unpack(localStorage.getItem(LS_KEY)); if (u && u.state && u.upd > S.updatedAt) S = u.state; } catch (e) {}
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { flush(); return; }
  adoptNewer(); refreshIfNewDay(); render();
});
window.addEventListener('pagehide', flush);
setInterval(refreshIfNewDay, 60000);

/* ============ start ============ */
async function boot() {
  const r = await loadAll();
  S = r.state;
  if (r.status === 'ok' || r.status === 'recovered') {
    writesLocked = false; ui.rescue = null;
    if (r.status === 'ok' && r.app !== APP_VERSION) snapshot('upgrade');  // copy of the data exactly as the older version left it
    save({noCount:true});   // writes all three copies, which also repairs any damaged one
    snapshot('daily');
    askPersist();
    render(); playIn(0);
    if (r.status === 'recovered') toast('Your progress was restored from a safety copy.');
  } else {
    writesLocked = true; ui.rescue = r.status;   // 'fresh' | 'damaged' | 'unreadable': nothing is written until the person decides
    render(); playIn(0);
  }
}
boot();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
})();
</script>
