// The identity, days, 2-minute version and note are drawn only when the habit has them. No empty placeholders.
// 2.4: a Daily task habit shows ONE tappable line instead: today's task (tag "Today"), or, once today is ticked, the task
// written for tomorrow (tag "Next"). When it is empty it asks you to write the task, so the habit never goes without one.
function extrasHtml(h) {
  if (h.task) {
    const isDone = !!h.done[dkey(new Date())];
    const txt = h.note || (isDone ? 'Write tomorrow\'s task' : 'Write today\'s task');
    return `<div class="extras"><button class="x-line x-task${h.note ? '' : ' empty'}" data-action="xnote" data-id="${esc(h.id)}" aria-label="Edit the task of ${esc(h.name)}"><span class="x-tag">${isDone ? 'Next' : 'Today'}</span><span>${esc(txt)}</span></button></div>`;
  }
  let x = '';
  if (h.identity) x += `<div class="x-line"><span class="x-tag">Identity</span><span>${esc(h.identity)}</span></div>`;
  if (h.days && h.days.length) x += `<div class="x-line"><span class="x-tag">Days</span><span>${esc(daysLabel(h.days))}</span></div>`;
  if (h.mini) x += `<div class="x-line"><span class="x-tag">2-min</span><span>${esc(h.mini)}</span></div>`;
  if (h.note) x += `<p class="x-note">${esc(h.note)}</p>`;
  return x ? `<div class="extras">${x}</div>` : '';
}

function habitCard(h) {
  const tk = dkey(new Date()), yk = dkey(addDays(new Date(), -1));
  const cur = currentStreak(h), cl = claimableCount(h), next = TIERS[h.claimed];
  const fxOn = !!(ui.fx && ui.fx.id === h.id);
  const boxBtn = d => {
    const k = dkey(d), v = h.done[k], done = v === 1, saved = v === 2, future = k > tk, open = (k === tk || k === yk);
    const lite = done && !!(h.lite && h.lite[k]);
    const cls = ['box'];
    if (done) cls.push('done');
    if (lite) cls.push('lite');
    if (saved) cls.push('saved');
    if (k === tk) cls.push('today');
    if (future) cls.push('future');
    if (open) cls.push('open');
    if (k < h.created && !v) cls.push('pre');
    if (done && fxOn && ui.fx.day === k) cls.push('pop');
    const label = (open ? (done ? 'Unmark ' : saved ? 'Return streak saver for ' : 'Mark ') : '') + d.toDateString() + (lite ? ', done with the 2-minute version' : done ? ', done' : saved ? ', protected by a streak saver' : '');
    return `<button class="${cls.join(' ')}" data-action="tick" data-id="${esc(h.id)}" data-day="${k}" aria-label="${esc(label)}" aria-pressed="${done}">${done ? CHECK + (lite ? '<b class="mb" aria-hidden="true">2</b>' : '') : saved ? SHIELD_CK : '<span>' + d.getDate() + '</span>'}</button>`;
  };
  const wk = weekDays();
  // Flexible habit: rest days are not drawn. (A rest day that is already marked stays visible so it can still be unmarked.)
  const flex = !!(h.days && h.days.length);
  const vis = wk.map((d, i) => ({d: d, i: i})).filter(x => isSched(h, x.d) || h.done[dkey(x.d)]);
  const boxes = vis.map(x => `<div class="col"><span class="dl">${DAY_LETTERS[x.i]}</span>${boxBtn(x.d)}</div>`).join('');
  const rest = (!isSched(h, new Date()) && !h.done[tk]) ? `<div class="rest">Rest day today · next: ${esc(nextSchedName(h))}</div>` : '';
  // On a Monday, yesterday (Sunday) belongs to last week's row, so it gets its own small line.
  const yd = addDays(new Date(), -1);
  const yrow = (wk.some(d => dkey(d) === yk) || !(isSched(h, yd) || h.done[yk])) ? '' : `<div class="yrow"><span class="dl">Yesterday · ${esc(yd.toLocaleDateString(undefined, {weekday:'short', day:'numeric', month:'short'}))}</span>${boxBtn(yd)}</div>`;
  const nm = nmtInfo(h);
  const nmt = nm ? `<div class="nmt"><b>Never miss twice</b>${esc(nmtText(h, nm))}</div>` : '';
  let quest;
  if (cl > 0) {
    quest = `<button class="btn claim" data-action="claim" data-id="${esc(h.id)}">Quest complete · Claim reward</button>`;
  } else if (next) {
    const shown = Math.min(cur, next.days), p = Math.round(shown / next.days * 100);
    quest = `<div class="q-row"><span class="q-lbl">Next quest · Lv.${next.n} · ${next.days}-day streak</span><span class="q-val">${shown}/${next.days}</span></div><div class="bar"><i data-k="q${esc(h.id)}" style="width:${p}%"></i></div>`;
  } else {
    quest = `<div class="q-row"><span class="q-lbl">All quests cleared · Legend</span></div>`;
  }
  const pips = TIERS.map(t => `<i class="pip ${t.n <= h.claimed ? 'on' : ''}"></i>`).join('');
  return `
  <section class="panel habit">
    <div class="h-head">
      <button class="h-name${h.icon ? ' hasic' : ''}" data-action="edit" data-id="${esc(h.id)}" aria-label="Edit ${esc(h.name)}">${h.icon ? '<span class="h-ic" aria-hidden="true">' + esc(h.icon) + '</span>' : ''}<span>${esc(h.name)}</span>${PENCIL}</button>
      <button class="h-ins" data-action="insights" data-id="${esc(h.id)}" aria-label="Insights for ${esc(h.name)}">${GRAPH}</button>
      <button class="h-more" data-action="extras" data-id="${esc(h.id)}" aria-label="${h.task ? 'Write the task for ' + esc(h.name) : 'Options for ' + esc(h.name) + ': identity, 2-minute habit, note, flexible days'}">${DOTS}</button>
      <div class="streak"><small>STREAK</small><span class="sn">${flameHtml(h, cur, fxOn ? ' ign' : '')}<b${fxOn ? ' class="bump"' : ''}>${cur}</b></span></div>
    </div>
    ${extrasHtml(h)}${nmt}
    <div class="week${flex ? ' flex' : ''}"${flex ? ` style="grid-template-columns:repeat(${vis.length},minmax(0,1fr))"` : ''}>${boxes}</div>${rest}${yrow}
    <div class="quest">${quest}<div class="pips">${pips}<span>${h.claimed}/${TIERS.length} cleared</span></div></div>
  </section>`;
}

/* ---- records: full history of each habit ---- */
function habitStats(h) {
  const keys = Object.keys(h.done).sort();
  const nDone = keys.filter(k => h.done[k] === 1).length;
  const nSaved = keys.length - nDone;
  const nLite = keys.filter(k => h.done[k] === 1 && h.lite && h.lite[k]).length;
  const startKey = keys.length && keys[0] < h.created ? keys[0] : h.created;
  const today = new Date(), tk = dkey(today);
  const endKey = h.done[tk] ? tk : dkey(addDays(today, -1));
  // Only days that count: done days, and scheduled days that were not done. Rest days are left out.
  // bounce = a done day straight after a missed scheduled day (never missed twice). twice = a miss straight after a miss.
  let tracked = 0, missed = 0, bounce = 0, twice = 0, prevMiss = false;
  for (let d = parseKey(startKey); dkey(d) <= endKey; d = addDays(d, 1)) {
    const v = h.done[dkey(d)];
    if (v) {
      tracked++;
      if (v === 1 && prevMiss) bounce++;
      prevMiss = false;
    } else if (isSched(h, d)) {
      tracked++; missed++;
      if (prevMiss) twice++;
      prevMiss = true;
    }
  }
  return {
    nDone: nDone, nSaved: nSaved, nLite: nLite, startKey: startKey, endKey: endKey, tracked: tracked,
    missed: missed, bounce: bounce, twice: twice,
    rate: tracked ? Math.round(nDone / tracked * 100) : null
  };
}
function monthPanel(h, y, m, st, tk) {
  const days = new Date(y, m + 1, 0).getDate(), offset = (new Date(y, m, 1).getDay() + 6) % 7;
  let cells = '', nDone = 0, tracked = 0;
  for (let i = 0; i < offset; i++) cells += '<i class="c x"></i>';
  for (let d = 1; d <= days; d++) {
    const k = y + '-' + pad(m + 1) + '-' + pad(d), v = h.done[k], inRange = k >= st.startKey && k <= st.endKey, sch = isSchedKey(h, k);
    let cls = 'c', inner = d;
    if (v === 1) { cls += ' d'; nDone++; if (h.lite && h.lite[k]) cls += ' l'; }
    else if (v === 2) { cls += ' s'; inner = SHIELD; }
    else if (inRange && sch) cls += ' m';
    else if (inRange) cls += ' r';
    else cls += ' o';
    if (inRange && (v || sch)) tracked++;
    if (k === tk) cls += ' t';
    cells += `<span class="${cls}">${inner}</span>`;
  }
  const pct = tracked ? ' · ' + Math.round(nDone / tracked * 100) + '%' : '';
  const name = new Date(y, m, 1).toLocaleDateString(undefined, {month:'long', year:'numeric'});
  return `<section class="panel"><div class="m-head"><h4>${esc(name)}</h4><span class="tag">${nDone} done${pct}</span></div><div class="m-grid">${DAY_LETTERS.split('').map(l => `<span class="wd">${l}</span>`).join('')}${cells}</div></section>`;
}

/* ---- Records sections (insights, trends from 2.3.0; mood and journal data now live in a pop-up in 2.3.5) ---- */
// 2.9.0: the habit Insights moved out of Records. Each habit has a graph button next to its three dots (see openInsights).
function trendsSection() {
  // 1. weekly completion trend (all habits, last 12 weeks)
  const mon = parseKey(weekKey(new Date())), wk = [];
  for (let i = 11; i >= 0; i--) { const d = addDays(mon, -7 * i); wk.push(Object.assign({d: d}, trendWeek(dkey(d)))); }
  const cols = wk.map(w => { const v = w.due ? Math.round(w.done / w.due * 100) : null; return {v: v, show: v == null ? '' : v, label: String(w.d.getDate()), best: false}; });
  const sum = a => a.reduce((n, w) => ({due: n.due + w.due, done: n.done + w.done}), {due: 0, done: 0});
  const rc = sum(wk.slice(8)), pr = sum(wk.slice(4, 8));
  let cap = 'Your weekly completion rate builds here as you track.';
  if (rc.due) {
    const a = Math.round(rc.done / rc.due * 100);
    cap = 'Last 4 weeks: <b>' + a + '%</b>.';
    if (pr.due >= 5) {
      const dl = a - Math.round(pr.done / pr.due * 100);
      cap += ' ' + (dl > 0 ? 'Up ' + dl + ' points' : dl < 0 ? 'Down ' + (-dl) + ' points' : 'Level') + ' on the 4 weeks before.';
    }
  }
  const p1 = `<section class="panel"><span class="panel-t">Weekly completion</span>${chartHtml(cols, 100)}<p class="chart-cap">${cap} Each bar is a week, labelled by its Monday.</p></section>`;
  // 2. best weekday (all habits, last year)
  const wd = weekdayAll(), tot = wd.due.reduce((a, b) => a + b, 0);
  const rates = wd.due.map((n, w) => n >= 2 ? Math.round((n - wd.miss[w]) / n * 100) : null);
  let p2;
  if (tot < 21 || rates.filter(r => r != null).length < 2) {
    p2 = '<section class="panel"><span class="panel-t">Best weekday</span><p class="note" style="margin:0">Needs about three weeks of tracking before it can tell your strong days from your hard ones.</p></section>';
  } else {
    let best = -1, worst = -1;
    rates.forEach((r, w) => { if (r == null) return; if (best < 0 || r > rates[best]) best = w; if (worst < 0 || r < rates[worst]) worst = w; });
    const dcols = rates.map((r, w) => ({v: r, show: r == null ? '' : r, label: DAY_SHORT[w], best: w === best && best !== worst}));
    const dcap = best !== worst
      ? 'Your strongest day is <b>' + DAY_LONG[best] + '</b> (' + rates[best] + '%). Your hardest is <b>' + DAY_LONG[worst] + '</b> (' + rates[worst] + '%).'
      : 'Your days are all very even.';
    p2 = `<section class="panel"><span class="panel-t">Best weekday</span>${chartHtml(dcols, 100)}<p class="chart-cap">${dcap} Share of days done, all habits, last year.</p></section>`;
  }
  // 3. best streaks of every habit
  const ls = S.habits.map(longestStreak), mx = Math.max(1, ...ls);
  const p3 = '<section class="panel"><span class="panel-t">Best streaks</span>' + S.habits.map((h, i) =>
    `<div class="hr-row" style="--ac:${HCOL[i % HCOL.length]}"><div class="hr-h"><span>${esc(h.name)}</span><span>Best ${ls[i]} · Now ${currentStreak(h)}</span></div><div class="hb"><i style="width:${(ls[i] / mx * 100).toFixed(1)}%"></i></div></div>`).join('') + '</section>';
  return '<h2 class="sec">Trends</h2><div class="stack">' + p1 + p2 + p3 + '</div>';
}
// The mood and energy numbers, chart and "what lifts you". Drawn inside the Mood & journal pop-up.
function moodBody() {
  const keys = Object.keys(S.checkins);
  if (!keys.length) {
    return '<p class="note">No check-ins yet. Do the Morning check-in on the Habits tab and the Evening wrap-up at night. After a few weeks, Habsys shows which habits lift you.</p>';
  }
  const now = new Date(), cols = [];
  let sm = 0, cm = 0, se = 0, ce = 0;
  for (let i = 13; i >= 0; i--) { const d = addDays(now, -i), c = S.checkins[dkey(d)]; cols.push({v: c && c.m ? c.m : null, show: c && c.m ? MOODS[c.m - 1] : '', label: String(d.getDate()), best: false}); }
  for (let i = 0; i < 30; i++) { const c = S.checkins[dkey(addDays(now, -i))]; if (c && c.m) { sm += c.m; cm++; } if (c && c.e) { se += c.e; ce++; } }
  const avgM = cm ? (sm / cm).toFixed(1) + ' ' + MOODS[Math.min(5, Math.max(1, Math.round(sm / cm))) - 1] : '–';
  const avgE = ce ? (se / ce).toFixed(1) : '–';
  const tile = (l, v) => `<div class="stat"><small>${l}</small><b>${v}</b></div>`;
  let html = '<div class="stats">' + tile('Mood, 30 days', avgM) + tile('Energy, 30 days', avgE) + tile('Check-ins', keys.length) + tile('Journal lines', Object.keys(S.journal).length) + '</div>';
  html += '<span class="panel-t" style="margin:20px 0 4px">Mood, last 14 days</span>' + chartHtml(cols, 5);
  const rows = S.habits.map(h => ({h: h, m: moodLift(h, 'm'), e: moodLift(h, 'e')})).filter(r => r.m || r.e)
    .sort((a, b) => (b.m ? b.m.lift : -9) - (a.m ? a.m.lift : -9));
  const fmt = l => l ? (l.lift >= 0 ? '+' : '−') + Math.abs(l.lift).toFixed(1) : '–';
  html += '<span class="panel-t" style="margin:20px 0 4px">What lifts you</span>';

  } else {
    html += '<p class="chart-cap" style="margin-top:4px">Not enough days yet to compare. Habsys needs at least 3 check-in days with a habit done, and 3 without it.</p>';
  }
  return html;
}

// Streak of one habit at the end of each of the last 12 weeks.
function streakTimeHtml(h, bare) {
  const today = new Date(), tk = dkey(today), mon = parseKey(weekKey(today)), vals = [];
  for (let i = 11; i >= 0; i--) {
    const sun = addDays(mon, -7 * i + 6);
    if (dkey(sun) < h.created) { vals.push(null); continue; }
    vals.push(runBack(h, dkey(sun) >= tk ? (h.done[tk] ? today : addDays(today, -1)) : sun));
  }
  const mx = Math.max(1, ...vals.map(v => v == null ? 0 : v));
  const cols = vals.map((v, i) => ({v: v, show: v == null ? '' : v, label: String(addDays(mon, -7 * (11 - i)).getDate()), best: v != null && v > 0 && v === mx}));
  if (bare) return `<div class="mini">Streak over time</div>${chartHtml(cols, mx)}<p class="chart-cap">Streak at the end of each of the last 12 weeks. Longest ever: <b>${longestStreak(h)}</b>.</p>`;
  return `<section class="panel" style="margin-top:12px"><span class="panel-t">Streak over time</span>${chartHtml(cols, mx)}<p class="chart-cap">Streak at the end of each of the last 12 weeks. Longest ever: <b>${longestStreak(h)}</b>.</p></section>`;
}
// 2.4: the finished tasks of a Daily task habit (newest first), shown under its stats in Records.
function taskLogHtml(h) {

  const body = ks.length

}

function fcardOf(code) { return fCards[code] && typeof fCards[code] === 'object' ? fCards[code] : null; }

function friendLevelUps() {
  const out = [];

const fmtMin = n => n < 60 ? n + ' min' : Math.floor(n / 60) + ' h' + (n % 60 ? ' ' + (n % 60) + ' min' : '');
function habitWeekdayHtml(h) {
  const c = weekdayCounts(h, 365), tot = c.due.reduce((a, b) => a + b, 0);
  const rates = c.due.map((n, w) => n >= 2 ? Math.round((n - c.miss[w]) / n * 100) : null);
  const head = '<div class="mini">Best weekday</div>';
  if (tot < 21 || rates.filter(r => r != null).length < 2) return head + '<p class="chart-cap">Needs about three weeks of tracking before it can tell your strong days from your hard ones.</p>';
  let best = -1, worst = -1;
  rates.forEach((r, w) => { if (r == null) return; if (best < 0 || r > rates[best]) best = w; if (worst < 0 || r < rates[worst]) worst = w; });
  const cols = rates.map((r, w) => ({v: r, show: r == null ? '' : r, label: DAY_SHORT[w], best: w === best && best !== worst}));
  const cap = best !== worst
    ? 'Strongest day: <b>' + DAY_LONG[best] + '</b> (' + rates[best] + '%). Hardest: <b>' + DAY_LONG[worst] + '</b> (' + rates[worst] + '%).'
    : 'Your days are all very even.';
  return head + chartHtml(cols, 100) + '<p class="chart-cap">' + cap + ' Share of days done, last year.</p>';
}
function focusStats(h) {
  const f = h.focus || {}, today = new Date(), mins = [];
  let total = 0, week = 0;
  Object.keys(f).forEach(k => { total += f[k]; });
  for (let i = 6; i >= 0; i--) { const d = addDays(today, -i), m = f[dkey(d)] || 0; week += m; mins.push({d: d, m: m}); }
  const mx = Math.max(30, ...mins.map(x => x.m));
  return {total: total, week: week, today: f[dkey(today)] || 0, mx: mx, cols: mins.map(x => ({v: x.m, show: x.m ? x.m : '', label: DAY_SHORT[wdOf(x.d)], best: false}))};
}
function openInsights(id) {

  showModal(`

    <h3>Insights</h3>
    <p class="sub">${h.icon ? esc(h.icon) + ' ' : ''}${esc(h.name)}</p>

      ${tile('Missed days', st.missed)}${tile('Bounce-backs', st.bounce)}
      ${h.task ? tile('Tasks done', Object.keys(h.tlog || {}).length) : tile('Quests cleared', h.claimed + ' / ' + TIERS.length)}${tile('Focus this week', fmtMin(fs.week))}
    </div>

function dayScore(k) {

function firstTracked() {

  const left = xpFor(to + 1) - S.player.xp;
  const line = o.preview ? 'This is only a preview. Nothing in your progress was changed.' : up ? RANK_LINES[r1] : (left > 0 ? left.toLocaleString() + ' XP to reach level ' + (to + 1) + '.' : '');
  const m = document.createElement('div');
  m.id = 'moment'; m.className = 'mom ' + (up ? 'rankup' : 'lvlup') + ' rk-' + r1;
  m.setAttribute('role', 'dialog'); m.setAttribute('aria-modal', 'true'); m.setAttribute('aria-label', up ? 'New rank ' + r1 : 'Level up');
  m.innerHTML = `<i class="mom-rays"></i>
    <div class="mom-stage"><i class="mom-ring"></i><i class="mom-ring r2"></i><i class="mom-ring r3"></i><span class="hx big rk-${up ? r0 : r1}" id="momhx"><i></i><b id="momtxt">${up ? r0 : from}</b></span></div>
    <div class="mom-card">
      <div class="mom-lbl">${up ? 'New rank unlocked' : 'Level up'}</div>
      <h2 class="mom-title">${up ? esc(RANK_NAMES[r1]) : 'Level ' + to}</h2>
      <div class="mom-s1">${up ? 'Rank ' + r1 + ' · Level ' + to : esc(o.sub || 'Your daily ticks added up')}</div>
      <div class="mom-chips"><span>Level ${from} → ${to}</span>${up ? '<span>Rank ' + r0 + ' → ' + r1 + '</span>' : '<span>Rank ' + r1 + '</span>'}</div>
      ${line ? '<p class="mom-p">' + esc(line) + '</p>' : ''}
      <button class="btn mom-btn" data-action="momclose">${esc(o.btn || 'Continue')}</button>
    </div>`;
  document.body.appendChild(m);
  const hx = $('#momhx'), tx = $('#momtxt');
  const land = () => { if (up) { hx.className = 'hx big rk-' + r1; tx.textContent = r1; } else tx.textContent = to; };
  if (!canFx()) { land(); m.classList.add('boom', 'in'); return; }
  m.classList.add('charge');
  const boom = () => {
    m.classList.remove('charge'); m.classList.add('boom');
    if (up) land(); else countUp(tx, from, to, 700);
    flash(); confetti(up ? 150 : 90, true);
    try { if (navigator.vibrate) navigator.vibrate(up ? [40, 60, 40, 60, 220] : [30, 60, 30, 60, 140]); } catch (e) {}
  };
  momAt(boom, up ? 1500 : 650);
  momAt(() => m.classList.add('in'), up ? 2100 : 1200);
}

/* ---- NEW 2.7.0: Evening wrap-up. Three short steps: close your habits, check in, plan tomorrow. ---- */
// Ticking inside the wrap-up is quiet (no pop-ups on top of it). Level ups and badges earned during it are shown together when you close the day.
function wrapSumHtml() {
  const tk = dkey(new Date()), due = dueToday(), done = due.filter(h => h.done[tk]).length;
  return `<b>Today so far</b>${due.length ? done + ' of ' + due.length + ' habits done' : 'No habits were due today'} · +${todayXp()} XP from ticks`;
}
function wrapRows() {
  const tk = dkey(new Date()), due = dueToday();
  if (!due.length) return '<p class="small">Nothing was due today. A rest day.</p>';
  return due.map(h => {
    const d = !!h.done[tk], col = HCOL[S.habits.indexOf(h) % HCOL.length], cs = currentStreak(h), nm = !d && nmtInfo(h);
    const small = !d && h.task && !h.note ? '<small class="nm">Write today\'s task on the habit card first</small>' : nm ? '<small class="nm">Never miss twice</small>' : '';
    const mini = !d && !h.task && h.mini ? `<button class="w-mini" data-action="wmini" data-id="${esc(h.id)}" aria-label="Mark ${esc(h.name)} done with the 2-minute version">2-min</button>` : '';
    return `<div class="w-line"><button class="t-row${d ? ' on' : ''}" style="--ac:${col}" data-action="wtick" data-id="${esc(h.id)}" aria-label="${d ? '' : 'Mark '}${esc(h.name)}${d ? ' is done' : ' done'}" aria-pressed="${d}">
      <span class="t-dot">${d ? CHECK : ''}</span>${h.icon ? '<span class="t-ic" aria-hidden="true">' + esc(h.icon) + '</span>' : ''}<span class="t-txt"><b>${esc(h.name)}</b>${small}</span><span class="t-st"><span class="sn">${flameHtml(h, cs)}${cs}</span><small>STREAK</small></span></button>${mini}</div>`;
  }).join('');
}
function tomorrowRows() {
  const tm = addDays(new Date(), 1), tk = dkey(new Date());
  const list = S.habits.filter(h => isSched(h, tm));
  if (!list.length) return '<p class="small">Nothing is scheduled for tomorrow. A rest day.</p>';
  return list.map(h => {
    const cur = currentStreak(h), txt = h.done[tk] ? (cur ? 'Day ' + (cur + 1) + ' of your streak' : 'A new start') : 'Come straight back';
    return `<div class="kv"><span>${h.icon ? esc(h.icon) + ' ' : ''}${esc(h.name)}</span><b>${esc(txt)}</b></div>`;
  }).join('');
}
function wrapSteps(step) { return '<div class="wrap-steps" aria-hidden="true">' + [1, 2, 3].map(n => '<i' + (n <= step ? ' on' : '') + '></i>').join('') + '</div>'; }
// Saves the "first move" line if it was typed (safe to call at any time).
function savePlanInput() {
  const el = document.getElementById('wplan'); if (!el || ui.rescue || writesLocked) return;
  const v = (el.value || '').replace(/\s+/g, ' ').trim().slice(0, MAX_PLAN), day = dkey(addDays(new Date(), 1));
  if ((S.plan.day === day ? S.plan.text : '') === v) return;
  S.plan = v ? {day: day, text: v} : {day: '', text: ''};
  save();
}
function openWrap(step) {
  if (!S.habits.length) { toast('Add a habit first.'); return; }
  step = Math.min(3, Math.max(1, Math.floor(Number(step)) || 1));
  if (!ui.wrap) ui.wrap = {l0: levelOf(S.player.xp), nb: []};
  savePlanInput(); commitInput();
  const tk = dkey(new Date()), tm = dkey(addDays(new Date(), 1));
  let body;
  if (step === 1) {
    body = `<p class="sub">Step 1 of 3 · Close your habits</p>${wrapSteps(1)}
      <div class="reward" id="wsum">${wrapSumHtml()}</div>
      <div class="wlist" id="wlist">${wrapRows()}</div>
      <p class="hint" style="margin-top:0">Tap a habit to mark it done. Anything left open is fine: tomorrow is your comeback day.</p>
      <div class="actions"><button class="btn" data-action="wnext" data-step="2">Next: evening check-in</button><button class="btn ghost" data-action="wquit">Not now</button></div>`;
  } else if (step === 2) {
    body = `<p class="sub">Step 2 of 3 · Evening check-in</p>${wrapSteps(2)}
      <div class="ci-blk"><span>How was your mood?</span><div class="ci-pick" id="cipm">${ciPick('m', 'pm')}</div></div>
      <div class="ci-blk"><span>How was your energy?</span><div class="ci-pick" id="cipe">${ciPick('e', 'pm')}</div><div class="ci-ends"><span>1 low</span><span>5 high</span></div></div>
      <label class="field"><span>What went well today?</span><textarea class="input sm" id="wgood" maxlength="${MAX_EVE}" placeholder="A win, big or small">${esc((S.eve[tk] || {}).good || '')}</textarea></label>
      <label class="field"><span>What did not go well?</span><textarea class="input sm" id="wbad" maxlength="${MAX_EVE}" placeholder="Be honest, not harsh">${esc((S.eve[tk] || {}).bad || '')}</textarea></label>
      <div class="actions two"><button class="btn ghost" data-action="wnext" data-step="1">Back</button><button class="btn" data-action="wnext" data-step="3">Next: tomorrow</button></div>`;
  } else {
    const plan = S.plan.day === tm ? S.plan.text : '';
    body = `<p class="sub">Step 3 of 3 · Plan tomorrow</p>${wrapSteps(3)}
      <div class="grp">${tomorrowRows()}</div>
      <label class="field"><span>Your first move tomorrow (optional)</span><input class="input" id="wplan" maxlength="${MAX_PLAN}" placeholder="e.g. Walk right after coffee" value="${esc(plan)}" autocomplete="off"></label>
      <p class="hint">Choosing the first small step tonight makes it easier to start. It shows on your Today card tomorrow.</p>
      <div class="actions two"><button class="btn ghost" data-action="wnext" data-step="2">Back</button><button class="btn" data-action="wfinish">Close the day</button></div>`;
  }
  showModal(`<div class="wtag"><span class="tag">Habsys</span></div><h3>Evening wrap-up</h3>${body}`, '', true);
}
// One tap inside step 1: mark today done, quietly. The list and the summary are redrawn in place.
function wrapTick(id, lite) {
  const h = findHabit(id), tk = dkey(new Date());
  if (!h || h.done[tk]) return;
  if (!ui.wrap) ui.wrap = {l0: levelOf(S.player.xp), nb: []};
  const gain = markDone(id, tk, lite, true);
  const l = $('#wlist'); if (l) l.innerHTML = wrapRows();
  const s = $('#wsum'); if (s) s.innerHTML = wrapSumHtml();
  if (gain) {
    const col = HCOL[Math.max(0, S.habits.indexOf(h)) % HCOL.length], dot = document.querySelector('#wlist .t-row[data-id="' + id + '"] .t-dot');
    requestAnimationFrame(() => { spark(dot, col); xpFloat([dot], '+' + gain + ' XP'); });
    try { if (navigator.vibrate) navigator.vibrate(12); } catch (e) {}
  }
}
function wrapFinish() {
  savePlanInput(); commitInput();
  const w = ui.wrap || {l0: levelOf(S.player.xp), nb: []};
  S.wrap = dkey(new Date());
  save();
  ui.wrap = null;
  closeModal(); render();
  const L = levelOf(S.player.xp), lv = L > w.l0 ? {from: w.l0, to: L} : null, claim = S.habits.some(x => claimableCount(x) > 0);
  if (lv || w.nb.length) momentSheet({lv: lv, nb: w.nb, claim: claim, sub: 'Evening wrap-up complete', btn: 'Good night'});
  else toast(claim ? 'Day closed. A quest reward is waiting for you.' : 'Day closed. Rest well.');
}

// Asked once a day when the app is opened (before the evening, and not in the small hours). Never on top of another pop-up.
function maybeAskIntent() {
  if (ui.rescue || writesLocked || document.hidden || !S.habits.length) return;
  const tk = dkey(new Date()), hr = new Date().getHours();

}
// NEW 3.0.5: every Sunday Habsys offers the weekly reflection once (after the morning check-in, never on top of another pop-up).
function maybeAskReflect() {
  if (ui.rescue || writesLocked || document.hidden || !S.habits.length) return;
  const t = new Date(), tk = dkey(t);

/* ============ backup / restore ============ */
// A backup file carries a fingerprint of its data. On restore the fingerprint is checked, so a damaged or
// half-copied file is rejected instead of overwriting good data. (2.5: the friend code and friend list are inside the backup too. 2.6: so are the partner and the last seen levels.)
const backupSumOk = j => !!j && typeof j.checksum === 'string' && sum53(JSON.stringify(j.data)) === j.checksum;
async function doBackup() {
  if (ui.rescue) return;
  commitInput();
  const payload = {app:'habsys', backupVersion:2, appVersion:APP_VERSION, exportedAt:new Date().toISOString(), checksum:sum53(JSON.stringify(S)), data:S};
  const name = 'habsys-backup-' + dkey(new Date()) + '.json';
  const text = JSON.stringify(payload, null, 2);
  // Check the file we are about to hand over reads back correctly.
  try {
    const back = JSON.parse(text);
    if (!backupSumOk(back) || !validState(back.data)) throw new Error('bad');
  } catch (e) { toast('Backup failed its safety check. Nothing was saved. Try again.'); return; }
  let saved = false;
  try {
    const file = new File([text], name, {type:'application/json'});
    if (navigator.canShare && navigator.canShare({files:[file]}) && navigator.share) {
      await navigator.share({files:[file], title:'Habsys backup'});
      saved = true;
    }
  } catch (e) {
    if (e && e.name === 'AbortError') return; // user cancelled the share sheet
  }
  if (!saved) {
    const url = URL.createObjectURL(new Blob([text], {type:'application/json'}));
    const a = document.createElement('a'); a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    saved = true;
  }
  if (saved) {
    S.lastBackup = new Date().toISOString(); S.changes = 0; S.bigMoment = false;
    save({noCount:true}); toast('Backup created. Keep the file safe.'); render();
  }
}
let pendingRestore = null, pendingRestoreAt = null;
function handleRestoreFile(file) {
  if (!file) return;
  if (file.size > 5000000) { toast('That file is too large to be a Habsys backup.'); return; }
  const r = new FileReader();
  r.onload = () => {
    let j = null;
    try { j = JSON.parse(String(r.result)); } catch (e) {}
    if (!j || j.app !== 'habsys' || !validState(j.data)) { toast('That file is not a Habsys backup.'); return; }
    let verified = false;
    if (typeof j.checksum === 'string') {
      if (!backupSumOk(j)) { toast('This backup file is damaged, so it was not used. Your current data is untouched.'); return; }
      verified = true;
    }
    pendingRestore = normalize(j.data);
    pendingRestoreAt = (j.exportedAt && !isNaN(new Date(j.exportedAt))) ? String(j.exportedAt) : null;
    const n = pendingRestore.habits.length, xp = pendingRestore.player.xp;
    let txt = `This backup has <b>${n} habit${n === 1 ? '' : 's'}</b> and <b>${xp.toLocaleString()} XP</b>` + (j.exportedAt ? ` (saved ${esc(fmtDate(j.exportedAt))})` : '')
      + (ui.rescue ? '.' : `. It will <b>replace</b> what is on this device now.`)
      + (verified ? ' The file passed its integrity check.' : ' This is an older file without an integrity check.');
    if (!ui.rescue && xp < S.player.xp) {
      txt += `<br><br><b>Warning:</b> this backup has less progress than what is on this device now (${S.player.xp.toLocaleString()} XP). Restoring will lose the difference.`;
    }
    confirmBox('Restore backup?', txt, 'dorestore', 'Restore');
  };
  r.onerror = () => toast('Could not read that file.');
  r.readAsText(file);
}

// How it works: Habsys signs in to your free Firebase project anonymously (no email, no password: a hidden random ID).
// It uploads ONE small card (player name, level, rank) under your friend code, and reads the cards of the codes in your list.
// Nothing else is ever sent. The Firebase rules (set up once in the Firebase console) let anyone signed in read a card
// and only its owner change it. All of this uses plain web requests: no library is loaded.
// 2.6.0 adds nothing to what is sent: the level-up spotlight and the partner goal only compare the cards that were already read.
let fCards = {};
try {
  const x = JSON.parse(localStorage.getItem(FB_CACHE) || '{}');
  if (x && typeof x === 'object') for (const c of Object.keys(x)) {
    const k = x[c];
    if (CODE_RE.test(c) && k && typeof k.name === 'string' && Number(k.level) >= 1 && /^[EDCBAS]$/.test(String(k.rank))) fCards[c] = {name: k.name.slice(0, 24), level: Math.floor(Number(k.level)), rank: String(k.rank), upd: Number(k.upd) || 0};
  }
} catch (e) {}
const fState = {busy: false, last: 0, err: '', adding: false, lastPush: '', lastPushAt: 0};
function saveFCache() { try { localStorage.setItem(FB_CACHE, JSON.stringify(fCards)); } catch (e) {} }
function newCode() {

  let s = ''; for (let i = 0; i < 8; i++) s += CODE_CHARS[a[i] % CODE_CHARS.length];

}
function ensureCode() {

  S.friends.code = newCode();
  S.friends.list = S.friends.list.filter(c => c !== S.friends.code);
  if (!writesLocked && !ui.rescue) save({noCount: true});

// NEW 2.6.0: "since you last looked". S.friends.seen holds the level and rank of every friend as you last saw them.

// is no longer in your list is forgotten.

  });

// Called when you leave the Friends tab or the app, and by the small X on a spotlight line.
function ackFriends(code) {

const httpErr = st => { const e = new Error('http' + st); e.status = st; return e; };

  }

// Uploads your own card. Skipped when nothing changed in the last 10 minutes.
async function fsPush() {
  const L = levelOf(S.player.xp), name = S.player.name, rank = rankOf(L), sig = S.friends.code + '|' + name + '|' + L;
  if (sig === fState.lastPush && Date.now() - fState.lastPushAt < 600000) return;
  const tok = await fbToken();
  const body = JSON.stringify({fields: {owner: {stringValue: fAuth.uid}, name: {stringValue: name}, level: {integerValue: String(L)}, rank: {stringValue: rank}, upd: {integerValue: String(Date.now())}}});
  const r = await fbFetch(fsUrl(S.friends.code), {method: 'PATCH', headers: {Authorization: 'Bearer ' + tok, 'Content-Type': 'application/json'}, body: body});
  if (r.status === 403) {

    S.friends.code = newCode(); save({noCount: true}); fState.lastPush = '';

  if (e && (e.status === 401 || e.status === 403)) return 'Firebase refused the request. Check that the rules were published.';
  if (e && e.status) return 'The server had a problem (' + e.status + '). Try Refresh in a minute.';

}

// force = skip the 20-second pause between updates.
async function syncFriends(force) {

  fState.busy = true; fState.err = '';

      await Promise.all(codes.slice(i, i + 5).map(async c => {
        try { const card = await fsGet(c); if (card && S.friends.list.indexOf(c) >= 0) fCards[c] = card; }
        catch (e) { if (!e || !e.status || e.status >= 500) throw e; }   // a single refused card is skipped; network or server trouble stops the update

function afterChange(id, before) {

// lite = true: the day was done with the 2-minute version (still a real done day).
// The tick effect: ui.fx is set only while the screen is redrawn, so the pop, the drawing check and the streak bump play once.
// 2.4: a Daily task habit. Ticking TODAY moves the written task into its history (tlog) and clears the note, so the next task can be written.
// 2.7: a tick gives small XP (2, or 1 for the 2-minute version), can lift you a level, and can unlock a badge.
// quiet = used by the Evening wrap-up: no pop-ups, no tick effects (the wrap-up shows everything when you close the day). Returns the XP given.
function markDone(id, k, lite, quiet) {
  const h = findHabit(id); if (!h) return 0;

  }

  const before = claimableCount(h), oldL = levelOf(S.player.xp);
  h.done[k] = 1;

    if (!h.tlog) h.tlog = {};
    if (k === tk) { h.tlog[k] = h.note; h.note = ''; askNext = true; }
    else h.tlog[k] = h.tlog[k] || 'Done (task not written)';

  if (quiet) {
    save(); render();
    const got = awardBadges();
    if (ui.wrap) ui.wrap.nb = ui.wrap.nb.concat(got);
    return gain;
  }
  ui.fx = {id: id, day: k};
  afterChange(id, before);
  ui.fx = null;

  const col = HCOL[Math.max(0, S.habits.indexOf(h)) % HCOL.length];

    const box = document.querySelector('#view .box[data-id="' + id + '"][data-day="' + k + '"]');
    const dot = k === dkey(new Date()) ? document.querySelector('#view .t-row[data-id="' + id + '"] .t-dot') : null;

}

  const before = claimableCount(h);
  h.done[k] = 2;

  const tk = dkey(new Date()), yk = dkey(addDays(new Date(), -1));

  if (h.done[k] === 2) { // protected day: tapping again returns the saver
    delete h.done[k]; S.savers += 1; save(); render(); toast('Streak saver returned.'); return;
  }
  if (h.done[k]) { // done day (full or 2-minute): tapping again unmarks it
    const before = claimableCount(h), oldL = levelOf(S.player.xp);
    delete h.done[k];

    let restored = false;

/* ============ reminders (2.8.0) ============ */
// A web app cannot wake itself up at 8 pm, so the evening reminder is a PUSH notification sent by a small free "sender" (GitHub Actions, see the setup steps).
// What this app does: asks the iPad for permission, makes a push subscription, and keeps ONE small document in your Firebase project (reminders/<your hidden sign-in id>) with:
// reminder on/off, the time, your time zone, the push address, and how many habits are still left today. No habit names, streaks, notes or journal ever leave the device.
// The sender looks at that document every 15 minutes and, from your reminder time, sends "N habits still left today" unless your day is already complete.
const rem = {on: false, time: REMIND_TIME};
try { const r = JSON.parse(localStorage.getItem(REMIND_LS) || 'null'); if (r && typeof r === 'object') { rem.on = !!r.on; if (/^([01]\d|2[0-3]):[0-5]\d$/.test(r.time)) rem.time = r.time; } } catch (e) {}
const remSave = () => { try { localStorage.setItem(REMIND_LS, JSON.stringify({on: rem.on, time: rem.time})); } catch (e) {} };
const rState = {busy: false, again: false, sig: '', ok: null, timer: 0, offDue: false, working: false};
const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
function keyBytes(b64) {
  const t = (b64 + '='.repeat((4 - b64.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/'), raw = atob(t);
  return Uint8Array.from(raw, c => c.charCodeAt(0));
}
// 'unsupported' | 'notready' | 'blocked' | 'off' | 'on'
function remindState() {
  if (!pushSupported()) return 'unsupported';
  if (!PUSH_READY || !FB_READY) return 'notready';
  if (Notification.permission === 'denied') return 'blocked';
  return rem.on && Notification.permission === 'granted' ? 'on' : 'off';
}
function remindersSection() {
  const st = remindState();
  let body;
  if (st === 'unsupported') body = '<p class="note">Reminders need Habsys to be opened from its Home Screen icon (iPadOS 16.4 or newer). Open it from the icon and come back here.</p>';
  else if (st === 'notready') body = '<p class="note">The reminder service is not set up yet. It is a one-time setup. Ask Claude for the reminder setup steps.</p>';
  else if (st === 'blocked') body = '<p class="note">Notifications are blocked for Habsys. Open the iPad Settings, then Notifications, then Habsys, turn on Allow Notifications and come back here.</p>';
  else if (st === 'off') body = `<p class="note">Get one gentle reminder in the evening when habits are still left today. Nothing is sent when your day is already complete.</p>
    <button class="btn block" data-action="remon"${rState.working ? ' disabled' : ''}>${rState.working ? 'Turning on…' : 'Turn on evening reminder'}</button>`;
  else body = `<div class="rm-row"><span>Remind me at</span><input class="input" type="time" id="rtime" value="${esc(rem.time)}"></div>
    <div class="kv"><span>Reminder service</span><b class="${rState.ok === true ? 'rm-ok' : ''}">${rState.ok === true ? 'Connected' : rState.ok === false ? 'Not connected yet' : 'Checking…'}</b></div>
    <p class="note" style="margin-top:12px">You get one reminder at this time if habits are still left today. If your day is complete, nothing is sent.</p>
    <div class="stack"><button class="btn ghost block" data-action="remtest">Send a test notification</button><button class="btn ghost block" data-action="remoff">Turn off reminder</button></div>`;
  return '<h2 class="sec">Reminders</h2><section class="panel">' + body + '</section>';
}
// Redraws the System tab after a reminder change, but never under a pop-up or while the player name is being typed.

async function pushSub(create) {
  const reg = await withTimeout(navigator.serviceWorker.ready, 8000);
  let sub = await reg.pushManager.getSubscription();
  if (!sub && create) {
    try { sub = await reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: keyBytes(VAPID_PUBLIC)}); }
    catch (e) {
      // an old subscription made with another key blocks a new one: remove it and try once more
      const old = await reg.pushManager.getSubscription(); if (old) await old.unsubscribe();
      sub = await reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: keyBytes(VAPID_PUBLIC)});
    }
  }
  return sub;
}
// Must start from a tap: the permission question is asked before the first "await".
async function enableReminders() {
  if (rState.working || remindState() !== 'off') return;
  rState.working = true;
  let perm = Notification.permission;
  try {
    if (perm === 'default') perm = await Notification.requestPermission();
    if (perm !== 'granted') { toast('Notifications were not allowed. You can allow them in the iPad Settings.'); return; }
    await pushSub(true);
    rem.on = true; remSave(); rState.sig = ''; rState.ok = null;
    toast('Evening reminder is on.');
    remindPush(true);
  } catch (e) {
    toast('Could not turn on the reminder. Open Habsys from its Home Screen icon and try again.');
  } finally { rState.working = false; redrawSystem(); }
}
async function disableReminders() {
  rem.on = false; remSave(); rState.offDue = true; rState.ok = null;
  toast('Reminder turned off.');
  redrawSystem();
  await remindPush(true);   // tells the reminder service to stop (kept for a retry if offline)
  try { const s = await pushSub(false); if (s) await s.unsubscribe(); } catch (e) {}
  redrawSystem();
}

async function testReminder() {
  try {
    const reg = await withTimeout(navigator.serviceWorker.ready, 8000), n = dueToday().filter(h => !h.done[dkey(new Date())]).length;
    await reg.showNotification('Habsys', {body: n ? n + ' habit' + (n === 1 ? '' : 's') + ' still left today. This is a test reminder.' : 'This is a test reminder. Your day looks complete.', icon: 'icon-192.png', tag: 'habsys-test'});
    toast('Test sent. If you cannot see it, swipe down for the Notification Centre.');
  } catch (e) { toast('Could not show a notification.'); }
}
const remUrl = () => 'https://firestore.googleapis.com/v1/projects/' + encodeURIComponent(FB_PROJECT) + '/databases/(default)/documents/reminders/' + encodeURIComponent(fAuth.uid);
// Waits a moment after the last change, then sends the status (skipped when nothing changed or reminders are off).
function remindSoon() {
  if (!rem.on && !rState.offDue) return;
  clearTimeout(rState.timer);
  rState.timer = setTimeout(() => remindPush(false), 2500);
}
async function remindPush(force) {
  if (!FB_READY || !PUSH_READY || ui.rescue || writesLocked || !pushSupported()) return;
  if (!rem.on && !rState.offDue) return;
  if (rState.busy) { rState.again = true; return; }
  rState.busy = true;
  try {
    const tk = dkey(new Date()), due = dueToday(), left = due.filter(h => !h.done[tk]).length;
    let sub = '';
    if (rem.on) {
      if (Notification.permission !== 'granted') return;
      const s = await pushSub(false); sub = s ? JSON.stringify(s.toJSON()) : '';
      if (!sub) { rState.ok = false; return; }
    }
    let tz = 'UTC'; try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC'; } catch (e) {}
    const hm = rem.time.split(':').map(Number), sig = [rem.on, sub, rem.time, tz, tk, left, due.length].join('|');
    if (!force && sig === rState.sig) return;
    const f = {on: {booleanValue: !!rem.on}, hour: {integerValue: String(hm[0])}, min: {integerValue: String(hm[1])}, tz: {stringValue: tz}, day: {stringValue: tk},
      left: {integerValue: String(Math.min(20, left))}, total: {integerValue: String(Math.min(20, due.length))}, upd: {integerValue: String(Date.now())}};
    if (sub) f.sub = {stringValue: sub};
    const tok = await fbToken();   // only the listed fields are written, so the "sent" mark kept by the sender is never wiped
    const r = await fbFetch(remUrl() + '?' + Object.keys(f).map(k => 'updateMask.fieldPaths=' + k).join('&'), {method: 'PATCH', headers: {Authorization: 'Bearer ' + tok, 'Content-Type': 'application/json'}, body: JSON.stringify({fields: f})});
    if (!r.ok) throw httpErr(r.status);
    rState.sig = sig; rState.ok = true; if (!rem.on) rState.offDue = false;
  } catch (e) { rState.ok = false; }
  finally {
    rState.busy = false;
    if (rState.again) { rState.again = false; remindSoon(); }
    redrawSystem();
  }
}
// The reminder sets the icon badge to the number of habits left; opening the app clears it.
function clearBadge() { try { if (navigator.clearAppBadge) navigator.clearAppBadge().catch(() => {}); } catch (e) {} }

/* ============ start ============ */
async function boot() {
  const r = await loadAll();
  S = r.state;
  if (r.status === 'ok' || r.status === 'recovered') {
    writesLocked = false; ui.rescue = null;
    reconcileSeen();   // 2.6: friends with no "last seen" yet start from the cards saved on this device
    const caught = r.status === 'ok' || r.status === 'recovered' ? awardBadges(true) : [];   // 2.7: badges already earned in your history are recorded quietly
    if (r.status === 'ok' && r.app !== APP_VERSION) snapshot('upgrade');  // copy of the data exactly as the older version left it
    save({noCount:true});   // writes all three copies, which also repairs any damaged one
    snapshot('daily');
    askPersist();
    render(); playIn(0);
    if (r.status === 'recovered') toast('Your progress was restored from a safety copy.');
    else if (caught.length) toast(caught.length === 1 ? 'Badge found in your history: ' + caught[0].name : caught.length + ' badges found in your history. See the Vault.');
    syncFriends();   // 2.5: share your card and fetch your friends' cards in the background
    clearBadge(); remindSoon();   // 2.8
    setTimeout(maybeAskReflect, 1200);   // 3.0.5: Sunday reflection
    setTimeout(maybeAskIntent, 600);   // 2.8: the morning question, once the app is on screen
    focusCheck();   // 2.9: pick up a running or finished focus timer
  } else {
    writesLocked = true; ui.rescue = r.status;   // 'fresh' | 'damaged' | 'unreadable': nothing is written until the person decides
    render(); playIn(0);
  }
}
boot();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
})();
