<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Habsys</title>
<meta name="theme-color" content="#0a0b10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Habsys">
<link rel="manifest" href="manifest.webmanifest?v=199">
<link rel="apple-touch-icon" href="icon-180.png?v=199">
<link rel="icon" type="image/png" href="icon-192.png?v=199">
<style>
/* ===== Habsys 2.0.5: arrange habits (new) on top of 2.0.0: Today ring, never-miss-twice, weekly reflection, identity statements, celebrations ===== */
:root{
  color-scheme:dark;
  --bg0:#0a0b10;
  --surface:#15171f; --surface2:#1d202b; --surface3:#272b3a;
  --hair:rgba(255,255,255,.07); --hair2:rgba(255,255,255,.13);
  --blue:#5b8cff; --blue2:#94b2ff; --blue3:#3f5ff0;
  --white:#f4f5f9; --muted:#8d92a6; --dim:#5d6276;
  --line:rgba(255,255,255,.08); --line-strong:rgba(255,255,255,.14);
  --warn:#ff7b8d; --gold:#ffcf6e; --gold2:#ff9f4a;
  --ac:#5b8cff;               /* accent of the current habit card; every habit gets its own colour */
  --r:26px; --r-sm:16px;
  --ease:cubic-bezier(.22,.8,.24,1);       /* calm deceleration for most movement */
  --spring:cubic-bezier(.3,1.35,.5,1);     /* tiny overshoot for taps */
  --head:ui-rounded,"SF Pro Rounded","SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg0);-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100vh;color:var(--white);font-family:var(--body);font-size:16px;line-height:1.4;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  background:
    radial-gradient(1000px 520px at 50% -180px,rgba(91,110,255,.26),transparent 70%),
    radial-gradient(640px 460px at 100% 38%,rgba(150,90,255,.07),transparent 70%),
    radial-gradient(560px 420px at 0% 78%,rgba(60,120,255,.05),transparent 70%),
    linear-gradient(180deg,#0d0f16 0%,#0a0b10 100%);
  background-attachment:fixed;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  overscroll-behavior-y:none;
}
button,input,textarea{font:inherit;color:inherit;touch-action:manipulation}
button{cursor:pointer;border:0;background:none;padding:0}
input,textarea{-webkit-user-select:text;user-select:text;caret-color:var(--blue2)}
button:focus-visible,.input:focus-visible{outline:2px solid var(--blue2);outline-offset:3px}

#app{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) 18px calc(env(safe-area-inset-bottom) + 120px)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 4px 24px}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:36px;height:36px;filter:drop-shadow(0 4px 14px rgba(91,140,255,.5))}
.brand b{font-family:var(--head);font-weight:800;font-size:27px;letter-spacing:-.02em;color:var(--white)}
.top .date{font-family:var(--body);font-weight:600;font-size:11px;line-height:1.35;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;text-align:center;padding:8px 14px;border-radius:15px;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));border:1px solid var(--hair);box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}

/* cards */
.panel{
  position:relative;border:1px solid var(--hair);border-radius:var(--r);
  background:linear-gradient(180deg,rgba(255,255,255,.032),rgba(255,255,255,0) 45%),var(--surface);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.045),0 1px 2px rgba(0,0,0,.3),0 18px 36px -20px rgba(0,0,0,.8);
  padding:20px;min-width:0;
}
.tag{font-family:var(--body);font-weight:600;font-size:12px;letter-spacing:.01em;color:var(--muted)}
h2.sec{font-family:var(--head);font-size:25px;letter-spacing:-.02em;color:var(--white);margin:38px 4px 14px;font-weight:800}

/* player: hero card */
.player{display:flex;align-items:center;gap:20px;margin-bottom:18px;padding:24px 22px;overflow:hidden;border-color:rgba(255,255,255,.18);
  background:radial-gradient(130% 150% at 105% -10%,rgba(255,255,255,.28),transparent 48%),radial-gradient(90% 120% at -5% 110%,rgba(30,20,120,.38),transparent 60%),linear-gradient(135deg,#3552ee 0%,#5845ec 55%,#7b40e4 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.32),inset 0 -1px 0 rgba(0,0,0,.12),0 26px 50px -22px rgba(80,80,240,.75)}
.player::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,0) 38%)}
.rank{width:64px;height:72px;flex:none;display:grid;place-items:center;
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
  background:linear-gradient(160deg,#ffffff 0%,#cfdaff 100%);
  font-family:var(--head);font-weight:800;font-size:32px;color:#3347d4}
.p-info{flex:1;min-width:0}
.p-name{font-family:var(--head);font-weight:800;font-size:24px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.p-sub{font-family:var(--body);font-weight:600;font-size:13px;color:rgba(255,255,255,.76);margin:2px 0 14px}
.bar{height:8px;background:rgba(255,255,255,.09);border-radius:999px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.35)}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,color-mix(in srgb,var(--ac) 72%,#000),var(--ac));box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 0 14px -2px color-mix(in srgb,var(--ac) 70%,transparent);transition:width .7s var(--ease)}
.player .bar{background:rgba(255,255,255,.22);box-shadow:inset 0 1px 2px rgba(0,0,0,.18)}
.player .bar i{background:#fff;box-shadow:0 0 14px rgba(255,255,255,.5)}
.xp-txt{font-family:var(--body);font-weight:600;font-size:12.5px;color:rgba(255,255,255,.82);margin-top:9px;font-variant-numeric:tabular-nums}
.sv-line{display:flex;align-items:center;gap:7px;font-family:var(--body);font-weight:600;font-size:12.5px;color:#fff;margin-top:7px}
.sv-line svg{width:14px;height:14px;flex:none}
.p-lv{text-align:center;flex:none}
.p-lv small{display:block;font-family:var(--body);font-weight:700;font-size:11px;letter-spacing:.18em;color:rgba(255,255,255,.7)}
.p-lv b{font-family:var(--head);font-weight:800;font-size:48px;line-height:1.02;font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 4px 18px rgba(20,10,90,.35)}

/* Today ring */
.today{margin-bottom:18px;padding:22px}
.t-top{display:flex;align-items:center;gap:20px}
.ring{position:relative;width:112px;height:112px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);display:block}
.ring circle{fill:none;stroke-width:10}
.ring .rt{stroke:rgba(255,255,255,.09)}
.ring .rp{stroke:var(--blue2);stroke-linecap:round;transition:stroke-dashoffset .8s var(--ease),stroke .4s;filter:drop-shadow(0 0 8px rgba(91,140,255,.55))}
.ring.full .rp{stroke:#25c795;filter:drop-shadow(0 0 8px rgba(37,199,149,.6))}
.ring .rc{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-family:var(--head);font-weight:800;font-size:28px;font-variant-numeric:tabular-nums;line-height:1}
.ring .rc small{display:block;font-family:var(--body);font-weight:700;font-size:9.5px;letter-spacing:.16em;color:var(--muted);margin-top:6px}
.t-msg{min-width:0}
.t-msg h3{margin:0 0 5px;font-family:var(--head);font-weight:800;font-size:21px;letter-spacing:-.015em}
.t-msg p{margin:0;font-size:14px;line-height:1.45;color:var(--muted)}
.t-focus{margin-top:10px;padding-left:12px;border-left:2px solid var(--blue);font-size:13.5px;line-height:1.4;color:var(--white);overflow-wrap:anywhere}
.t-focus b{display:block;font-family:var(--body);font-weight:700;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--blue2);margin-bottom:2px}
.t-list{display:grid;gap:8px;margin-top:18px;padding-top:16px;border-top:1px solid var(--hair)}
.t-row{display:flex;align-items:center;gap:14px;width:100%;min-height:58px;padding:8px 14px 8px 12px;border-radius:18px;background:var(--surface2);border:1px solid var(--hair);text-align:left;transition:transform .22s var(--spring),background .25s}
.t-row:active{transform:scale(.98)}
.t-dot{width:30px;height:30px;flex:none;border-radius:50%;border:2px solid var(--ac);display:grid;place-items:center;color:#fff;transition:background .3s,box-shadow .3s}
.t-row.on .t-dot{background:var(--ac);box-shadow:0 6px 12px -6px var(--ac)}
.t-dot .ck{width:58%;height:58%}
.t-txt{flex:1;min-width:0;display:grid}
.t-txt b{font-family:var(--head);font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-row.on .t-txt b{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(255,255,255,.25)}
.t-txt small{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-txt small.nm{color:var(--gold);font-weight:600}
.t-st{flex:none;text-align:right;font-family:var(--head);font-weight:800;font-size:19px;font-variant-numeric:tabular-nums}
.t-st small{display:block;font-family:var(--body);font-weight:700;font-size:9px;letter-spacing:.14em;color:var(--muted)}

/* backup / reminder banner */
.banner{display:flex;align-items:center;gap:14px;margin-bottom:18px;padding:14px 16px;border-radius:22px;border-color:rgba(255,207,110,.28);background:linear-gradient(135deg,rgba(255,207,110,.11),rgba(255,159,74,.05)),var(--surface)}
.banner p{margin:0;flex:1;font-size:14px;line-height:1.45;color:var(--white)}
.banner .tag{color:var(--gold);font-weight:700;font-size:12px}
.banner.ref{border-color:rgba(148,178,255,.3);background:linear-gradient(135deg,rgba(91,140,255,.14),rgba(123,64,228,.06)),var(--surface)}
.banner.ref .tag{color:var(--blue2)}

/* habits */
.habits{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
.habits>.habit:nth-child(10n+1){--ac:#5b8cff}
.habits>.habit:nth-child(10n+2){--ac:#ff6b5e}
.habits>.habit:nth-child(10n+3){--ac:#25c795}
.habits>.habit:nth-child(10n+4){--ac:#f5a524}
.habits>.habit:nth-child(10n+5){--ac:#a46bff}
.habits>.habit:nth-child(10n+6){--ac:#3db8f5}
.habits>.habit:nth-child(10n+7){--ac:#ff5f9e}
.habits>.habit:nth-child(10n+8){--ac:#84cc3b}
.habits>.habit:nth-child(10n+9){--ac:#ff8a3d}
.habits>.habit:nth-child(10n+10){--ac:#1fc3bc}
/* each habit card is a column: the quest block always sits at the bottom, so cards side by side line up */
.habit{--blue2:var(--ac);display:flex;flex-direction:column;padding:22px 22px 20px;border-radius:30px;
  background:radial-gradient(120% 70% at 0% 0%,color-mix(in srgb,var(--ac) 9%,transparent),transparent 60%),linear-gradient(180deg,rgba(255,255,255,.032),rgba(255,255,255,0) 45%),var(--surface)}
.habit>:nth-last-child(2){margin-bottom:18px}
.h-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
.h-name{font-family:var(--head);font-weight:800;font-size:20px;letter-spacing:-.015em;text-align:left;color:var(--white);min-height:44px;padding:0;display:flex;align-items:center;gap:12px;min-width:0;flex:1;transition:opacity .2s}
.h-name:active{opacity:.7}
.h-name::before{content:"";flex:none;width:11px;height:11px;border-radius:50%;background:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 22%,transparent),0 0 14px color-mix(in srgb,var(--ac) 55%,transparent)}
.h-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.h-name svg{width:13px;height:13px;flex:none;opacity:.32}
.h-more{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:50%;background:var(--surface2);border:1px solid var(--hair);color:var(--muted);transition:background .2s,color .2s,transform .2s var(--spring)}
.h-more svg{width:19px;height:19px;fill:currentColor}
.h-more:active{background:var(--surface3);color:var(--white);transform:scale(.9)}
.streak{text-align:right;flex:none;padding-left:4px;min-width:50px}
.streak small{display:block;font-family:var(--body);font-weight:700;font-size:9.5px;letter-spacing:.16em;color:var(--muted)}
.streak b{font-family:var(--head);font-weight:800;font-size:36px;line-height:1.02;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--white)}
/* optional extras (identity, days, 2-minute version, note): only drawn when the habit has them */
.extras{display:grid;gap:10px;margin:-4px 0 18px}
.x-line{display:flex;align-items:baseline;gap:10px;font-size:14px;color:var(--white)}
.x-line span:last-child{min-width:0;overflow-wrap:anywhere}
.x-tag{flex:none;font-family:var(--body);font-weight:700;font-size:10px;letter-spacing:.08em;color:var(--ac);text-transform:uppercase;background:color-mix(in srgb,var(--ac) 15%,transparent);border:1px solid color-mix(in srgb,var(--ac) 22%,transparent);border-radius:8px;padding:3px 9px}
.x-note{margin:0;font-size:14px;line-height:1.45;color:var(--muted);padding-left:12px;border-left:2px solid color-mix(in srgb,var(--ac) 65%,transparent);overflow-wrap:anywhere;white-space:pre-wrap}
/* never miss twice */
.nmt{margin:-2px 0 16px;padding:12px 14px;border-radius:16px;border:1px solid rgba(255,207,110,.3);background:rgba(255,207,110,.08);font-size:13.5px;line-height:1.45;color:var(--white);overflow-wrap:anywhere}
.nmt b{display:block;font-family:var(--body);font-weight:700;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-bottom:3px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.rest{margin-top:16px;padding:12px;border:1px dashed var(--hair2);border-radius:var(--r-sm);text-align:center;font-family:var(--body);font-weight:600;font-size:13px;color:var(--muted);background:rgba(255,255,255,.02)}
.col{display:flex;flex-direction:column;align-items:center;gap:9px;min-width:0}
.dl{font-family:var(--body);font-weight:600;font-size:11.5px;letter-spacing:.03em;color:var(--muted)}
.box{
  position:relative;width:100%;max-width:62px;aspect-ratio:1/1;margin:0 auto;display:grid;place-items:center;border-radius:50%;
  border:1.5px solid var(--hair2);background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,0)),var(--surface2);color:var(--muted);
  font-family:var(--body);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;
  transition:transform .28s var(--spring),box-shadow .3s var(--ease),background .3s var(--ease),border-color .3s var(--ease),color .3s var(--ease);
}
.week.flex .box{max-width:72px}
.box.pre{opacity:.38}
.box.future{border-style:dashed;opacity:.42}
.box.open{cursor:pointer}
.box.open:active{transform:scale(.88)}
.box:not(.open){cursor:default;pointer-events:none}
.box.today:not(.done){border-color:var(--ac);color:var(--white);background:color-mix(in srgb,var(--ac) 14%,var(--surface2));animation:pulse 2.8s ease-in-out infinite}
.box.done{
  background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 62%),var(--ac);
  border-color:transparent;color:#fff;
  box-shadow:0 10px 18px -8px color-mix(in srgb,var(--ac) 85%,transparent),inset 0 1px 0 rgba(255,255,255,.34),inset 0 -2px 4px rgba(0,0,0,.1);
}
.box.saved{background:color-mix(in srgb,var(--ac) 14%,var(--surface2));border-color:color-mix(in srgb,var(--ac) 70%,transparent);color:var(--ac)}
.box .ck{width:50%;height:50%;filter:drop-shadow(0 1px 1px rgba(0,0,0,.22))}
.box.saved .ck{filter:none}
.box .mb{position:absolute;right:-3px;bottom:-3px;width:18px;height:18px;display:grid;place-items:center;border-radius:50%;background:#fff;color:#14161f;font-family:var(--body);font-weight:800;font-size:10.5px;line-height:1;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.yrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;padding-top:14px;border-top:1px solid var(--hair)}
.yrow .dl{font-size:13px}
.yrow .box{width:46px;height:46px;max-width:none;aspect-ratio:auto;margin:0;flex:none}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ac) 0%,transparent)}50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--ac) 20%,transparent)}}

.quest{margin-top:auto;padding-top:17px;border-top:1px solid var(--hair)}
.q-row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:11px}
.q-lbl{font-family:var(--body);font-weight:600;font-size:13px;color:var(--muted)}
.q-val{font-family:var(--body);font-weight:700;font-size:13px;color:var(--white);font-variant-numeric:tabular-nums}
.pips{display:flex;flex-wrap:nowrap;gap:4px;margin-top:15px;align-items:center}
.pip{flex:1;min-width:0;height:6px;border-radius:999px;background:rgba(255,255,255,.09);transition:background .4s var(--ease)}
.pip.on{background:var(--ac);box-shadow:0 0 8px -1px color-mix(in srgb,var(--ac) 60%,transparent)}
.pips span{flex:none;font-family:var(--body);font-weight:600;font-size:11.5px;color:var(--muted);margin-left:8px;white-space:nowrap;font-variant-numeric:tabular-nums}

.add{display:grid;place-items:center;min-height:104px;border-radius:30px;border:1.5px dashed var(--hair2);background:transparent;box-shadow:none;text-align:center;width:100%;color:var(--blue2);font-family:var(--head);font-weight:700;font-size:17px;transition:background .25s var(--ease),transform .25s var(--spring),border-color .25s}
.add:active{transform:scale(.985);background:rgba(255,255,255,.04);border-color:rgba(148,178,255,.4)}
.add small{display:block;font-family:var(--body);font-weight:500;font-size:12.5px;color:var(--muted);margin-top:5px}
.add.full{color:var(--muted);cursor:default}
.empty{text-align:center;padding:32px 22px;margin-bottom:16px}
.empty .tag{display:none}
.empty h3{font-family:var(--head);font-weight:800;font-size:23px;letter-spacing:-.015em;margin:4px 0 10px}
.empty p{margin:0;color:var(--muted);font-size:15px;line-height:1.5}
.empty .stack{margin-top:22px;text-align:left}
.empty p + p{margin-top:12px}

/* arrange habits (new in 2.0.5) */
.arrbar{display:flex;justify-content:flex-end;margin:-4px 0 14px}
.arr-list{display:grid;gap:8px;margin-bottom:14px}
.arr-row{display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 8px 8px 16px;border-radius:18px;background:var(--surface2);border:1px solid var(--hair)}
.arr-n{flex:none;width:22px;font-family:var(--head);font-weight:800;font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.arr-dot{flex:none;width:11px;height:11px;border-radius:50%;background:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 22%,transparent)}
.arr-row b{flex:1;min-width:0;font-family:var(--head);font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arr-btn{flex:none;width:46px;height:46px;display:grid;place-items:center;border-radius:14px;background:rgba(255,255,255,.08);color:var(--white);transition:transform .2s var(--spring),background .2s,opacity .2s}
.arr-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.arr-btn:active{transform:scale(.88);background:rgba(255,255,255,.16)}
.arr-btn:disabled{opacity:.25;pointer-events:none}

/* buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:10px 22px;border-radius:18px;
  font-family:var(--head);font-weight:700;font-size:16.5px;letter-spacing:0;
  border:0;color:#fff;background:linear-gradient(180deg,#6c97ff 0%,#4a6cf5 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 -1px 0 rgba(0,0,0,.12),0 12px 24px -12px rgba(74,108,245,.95);
  transition:transform .22s var(--spring),filter .2s,background .2s,box-shadow .25s;
}
.btn:active{transform:scale(.97);filter:brightness(.92)}
.btn.ghost{background:rgba(255,255,255,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.05);color:var(--white)}
.btn.danger{background:rgba(255,123,141,.12);box-shadow:none;color:var(--warn)}
.btn.block{display:flex;width:100%}
.btn.sm{min-height:38px;padding:6px 16px;font-size:14px;border-radius:13px}
.btn.claim{width:100%;margin-top:0;background:linear-gradient(180deg,#ffdd85 0%,#ffa94d 100%);color:#3a2300;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 12px 26px -12px rgba(255,166,70,.9);animation:glow 2.6s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 8px 20px -12px rgba(255,166,70,.5)}50%{box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 12px 30px -8px rgba(255,166,70,1)}}

/* vault + settings */
.ladder{display:grid;gap:12px}
.rung{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;padding:16px 18px}
.rung .lv{width:50px;height:56px;display:grid;place-items:center;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(160deg,#86a6ff,#4a63f0);font-family:var(--head);font-weight:800;font-size:21px;color:#fff}
.rung h4{margin:0;font-family:var(--head);font-weight:800;font-size:17.5px;letter-spacing:-.01em}
.rung .meta{font-family:var(--body);font-weight:600;font-size:12.5px;color:var(--blue2);margin:3px 0 5px}
.rung p{margin:0;font-size:14px;line-height:1.45;color:var(--muted)}
.log{display:grid;gap:12px}
.log-item{padding:18px}
.log-item .row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.log-item h4{margin:0;font-family:var(--head);font-weight:800;font-size:17.5px;letter-spacing:-.01em}
.log-item .meta{font-family:var(--body);font-weight:600;font-size:12.5px;color:var(--blue2);margin-top:4px}
.log-item p{margin:10px 0 14px;font-size:15px;line-height:1.45}
.log-item p.rl{margin:10px 0 0;font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.log-item p.rl b{color:var(--white);font-weight:700}
.enjoyed{color:var(--muted)}
.note{color:var(--muted);font-size:14.5px;line-height:1.5;margin:0 0 14px}
.field{display:block;margin-bottom:16px}
.field span{display:block;font-family:var(--body);font-weight:600;font-size:13px;color:var(--muted);margin-bottom:8px}
.input{width:100%;min-height:52px;padding:12px 16px;border-radius:16px;border:1.5px solid transparent;background:rgba(255,255,255,.07);color:var(--white);font-size:17px;outline:none;transition:border-color .25s var(--ease),box-shadow .25s var(--ease),background .25s var(--ease)}
.input:focus{border-color:var(--blue);background:rgba(255,255,255,.09);box-shadow:0 0 0 4px rgba(91,140,255,.22)}
.input:focus-visible{outline:none}
textarea.input{min-height:104px;resize:none;line-height:1.4}
textarea.input.sm{min-height:76px}
.stack{display:grid;gap:12px}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:15px;padding:13px 0;border-bottom:1px solid var(--hair)}
.kv:last-of-type{border-bottom:0}
.kv b{font-family:var(--body);font-weight:600;font-size:14px;text-align:right}

/* tab bar: floating glass pill with sliding highlight */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px 16px calc(env(safe-area-inset-bottom) + 10px);background:linear-gradient(180deg,rgba(10,11,16,0),rgba(10,11,16,.92) 55%);pointer-events:none}
.tabs .in{pointer-events:auto;position:relative;max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:6px;border:1px solid var(--hair2);border-radius:30px;background:rgba(26,28,39,.74);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 1px 2px rgba(0,0,0,.3),0 24px 48px -16px rgba(0,0,0,.9);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%)}
.tab-ind{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 30px) / 4);border-radius:24px;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.15),rgba(255,255,255,.08));box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 4px 14px -6px rgba(0,0,0,.5);
  transform:translateX(calc(var(--i,0) * (100% + 6px)));transition:transform .5s cubic-bezier(.28,1.05,.3,1)}
.tab{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px 8px;border-radius:24px;color:var(--muted);font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.01em;transition:color .3s ease,transform .22s var(--spring)}
.tab:active{transform:scale(.93)}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linejoin:round;stroke-linecap:round;transition:stroke .3s ease,fill .3s ease,transform .35s var(--spring)}
.tab.on{color:var(--white)}
.tab.on svg{stroke:#a9c0ff;fill:rgba(148,178,255,.22);transform:translateY(-1px)}
/* while the welcome / recovery screen is showing, there is nothing to navigate to */
.rescuing .tabs{display:none}
.rescuing #app{padding-bottom:calc(env(safe-area-inset-bottom) + 32px)}

/* popups: native-style bottom sheet */
#overlay{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;padding:12px 12px calc(env(safe-area-inset-bottom) + 12px);background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);overflow-y:auto;-webkit-overflow-scrolling:touch}
#overlay.show{display:flex;animation:fadeIn .28s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.win{width:100%;max-width:520px;margin:auto auto 0;padding:34px 22px 22px;border-radius:34px;border:1px solid var(--hair2);background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,0) 30%),#1a1d28;box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 -10px 60px -10px rgba(0,0,0,.7);animation:sheet .5s cubic-bezier(.16,1,.3,1)}
.win::before{content:"";position:absolute;left:50%;top:10px;width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.24);transform:translateX(-50%)}
@keyframes sheet{from{transform:translateY(80px);opacity:0}to{transform:none;opacity:1}}
.win .wtag{display:none}
.win h3{font-family:var(--head);font-weight:800;font-size:27px;letter-spacing:-.02em;margin:0 0 4px}

.win p{margin:0 0 14px;color:var(--white);font-size:16px;line-height:1.5}
.win p.small{font-size:14px;color:var(--muted)}
.win .reward{background:rgba(255,255,255,.055);border:1px solid var(--hair);padding:15px 17px;border-radius:20px;margin-bottom:14px;line-height:1.5;overflow-wrap:anywhere}
.win .reward b{display:block;font-family:var(--body);font-weight:700;font-size:12.5px;color:var(--blue2);margin-bottom:4px}
.win .actions{display:grid;gap:10px;margin-top:4px}
.win .actions.two{grid-template-columns:1fr 1fr}
.win .mini{font-family:var(--body);font-weight:700;font-size:13px;color:var(--muted);margin:20px 0 4px}
.win .grp{margin-bottom:14px}
.win .grp .kv:last-child{border-bottom:0}
.win .hint{margin:-6px 0 16px;font-size:13px;line-height:1.45;color:var(--muted)}
.kv.here{color:var(--white)}
.kv.here b{color:var(--blue2)}
/* celebration sheet */
.cel-ic{width:76px;height:84px;margin:0 auto 16px;display:grid;place-items:center;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(160deg,#ffdd85,#ff9f4a);color:#3a2300;animation:pop .6s var(--spring)}
.cel-ic .ck{width:44%;height:44%}
.win.cel{text-align:center}
.win.cel .reward{text-align:left}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.fx{position:fixed;inset:0;z-index:80;pointer-events:none;overflow:hidden}
.fx i{position:absolute;top:-16px;width:9px;height:15px;border-radius:2px;opacity:0;animation:fall linear forwards}
@keyframes fall{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:1;transform:translate(var(--dx),108vh) rotate(var(--r))}}
/* weekday picker for flexible habits */
.dchips{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:16px}
.dchip{min-height:50px;border:0;border-radius:15px;background:rgba(255,255,255,.07);color:var(--muted);font-family:var(--head);font-weight:700;font-size:13px;transition:background .25s var(--ease),color .25s,box-shadow .25s,transform .22s var(--spring)}
.dchip:active{transform:scale(.92)}
.dchip.on{color:#fff;background:linear-gradient(180deg,#6c97ff,#4a6cf5);box-shadow:0 8px 16px -8px rgba(74,108,245,.9),inset 0 1px 0 rgba(255,255,255,.28)}

#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 108px);transform:translateX(-50%) translateY(18px) scale(.97);z-index:90;opacity:0;pointer-events:none;transition:opacity .3s var(--ease),transform .4s var(--spring);max-width:calc(100% - 32px)}
#toast.show{opacity:1;transform:translateX(-50%)}
#toast div{padding:12px 20px;border:1px solid var(--hair2);background:rgba(36,39,53,.92);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);border-radius:999px;font-family:var(--body);font-weight:600;font-size:14px;text-align:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 16px 36px -10px rgba(0,0,0,.85)}

/* smooth switching between tabs */
#view{transition:opacity .13s ease,transform .13s ease}
#view.v-out{opacity:0;transform:translateX(calc(var(--dx,0px) * -1))}
#view.v-in{animation:viewIn .42s var(--ease) backwards}
@keyframes viewIn{from{opacity:0;transform:translateX(var(--dx,0px)) scale(.992)}to{opacity:1;transform:none}}

/* streak savers */
.sv-row{display:flex;align-items:center;gap:16px}
.sv-n{width:62px;height:70px;flex:none;display:grid;place-items:center;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(160deg,#86a6ff,#4a63f0);font-family:var(--head);font-weight:800;font-size:30px;color:#fff}
.sv-row h4{margin:0 0 3px;font-family:var(--head);font-weight:800;font-size:18px;letter-spacing:-.01em}
.sv-row p{margin:0;color:var(--muted);font-size:14px;line-height:1.45}

/* records */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{min-height:42px;max-width:100%;padding:8px 18px;border:1px solid var(--hair);border-radius:999px;background:var(--surface);color:var(--muted);font-family:var(--head);font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .3s var(--ease),border-color .3s,color .3s,transform .22s var(--spring)}
.chip:active{transform:scale(.95)}
.chip.on{color:#10121a;border-color:transparent;background:#f4f5f9;box-shadow:0 8px 20px -10px rgba(244,245,249,.5)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{padding:15px 16px;border-radius:20px;background:var(--surface2);border:1px solid var(--hair);min-width:0}
.stat small{display:block;font-family:var(--body);font-weight:600;font-size:12.5px;color:var(--muted);margin-bottom:5px}
.stat b{display:block;font-family:var(--head);font-weight:800;font-size:27px;line-height:1.15;letter-spacing:-.015em;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.stat b.sm{font-size:18px;padding-top:6px}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-family:var(--body);font-weight:500;font-size:12.5px;color:var(--muted);margin:0 4px 14px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:12px;height:12px;border-radius:50%;display:inline-block}
.legend i.lgl{background:radial-gradient(circle at 74% 74%,#fff 0 2px,transparent 2.6px),linear-gradient(145deg,var(--blue2),var(--blue3))}
.months{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.m-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:14px}
.m-head h4{margin:0;font-family:var(--head);font-weight:800;font-size:18px;letter-spacing:-.01em}
.m-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.m-grid .wd{text-align:center;font-family:var(--body);font-weight:600;font-size:11px;color:var(--dim);padding-bottom:2px}
.c{position:relative;aspect-ratio:1/1;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.045);font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.c.x{background:none}
.c.o{opacity:.3}
.c.r{background:none;border:1px dashed var(--hair2);opacity:.7}
.c.m{color:var(--warn);background:rgba(255,123,141,.11)}
.c.d{background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,0) 62%),var(--blue);color:#fff;font-weight:700;box-shadow:0 5px 10px -5px rgba(91,140,255,.8)}
.c.l::after{content:"";position:absolute;right:2px;bottom:2px;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 0 1.5px rgba(30,40,110,.5)}
.c.s{border:1.5px solid rgba(148,178,255,.7);color:var(--blue2);background:rgba(91,140,255,.16)}
.c.s svg{display:block;width:58%;height:58%}
.c.t{outline:2px solid var(--white);outline-offset:2px}

/* trackpad / mouse on iPad: gentle hover feedback (does nothing on touch) */
@media (hover:hover){
  .btn:hover{filter:brightness(1.08)}
  .btn.ghost:hover{background:rgba(255,255,255,.12);filter:none}
  .box.open:hover{transform:scale(1.05)}
  .h-more:hover{background:var(--surface3);color:var(--white)}
  .chip:hover:not(.on){color:var(--white);background:var(--surface2)}
  .tab:hover:not(.on){color:var(--white)}
  .add:hover:not(.full){background:rgba(255,255,255,.035)}
  .t-row:hover{background:var(--surface3)}
  .arr-btn:hover:not(:disabled){background:rgba(255,255,255,.14)}
}
@media (min-width:700px){
  #app{padding-left:26px;padding-right:26px}
  .box{font-size:16px}
  .h-name{font-size:22px}
  .stats{grid-template-columns:repeat(4,minmax(0,1fr))}
  .months{grid-template-columns:repeat(2,minmax(0,1fr))}
  .c{font-size:13px}
}
@media (min-width:1000px){
  #app{max-width:1080px}
  .habits{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ladder{grid-template-columns:repeat(2,minmax(0,1fr))}

  .months{grid-template-columns:repeat(3,minmax(0,1fr))}

}

  .brand b{font-size:24px}

  .rung{grid-template-columns:auto 1fr}

  .ring .rc{font-size:24px}

}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
(() => {
'use strict';

/* ============ constants ============ */

/* ============ state ============ */
// In habit.done: 1 = habit done, 2 = day protected by a streak saver.
// habit.lite = days (keys) that were done with the 2-minute version. Those days are ALSO done = 1, so they count as real days.
// habit.mini = text of the 2-minute version ('' = none). habit.note = free note ('' = none).
// habit.identity = identity statement, for example "I am a reader" ('' = none).
// habit.days = weekdays the habit is followed on (0 = Monday ... 6 = Sunday, sorted). [] = every day (a normal habit).
// The order of S.habits IS the order shown on the Habits tab and in the Today card (changed with "Arrange habits").
// reflections = weekly reflections {week (Monday key), win, hard, focus, rate, at}. cel = celebrations already shown. allDay = last day the "day complete" celebration was shown.
// changes = number of edits since the last backup. bigMoment = a quest/habit milestone happened since the last backup.
function defaultState() {
  return { v:2, player:{name:'Player', xp:0}, savers:0, habits:[], rewards:[], rewardText:{}, reflections:[], cel:{}, allDay:'', lastBackup:null, changes:0, bigMoment:false, updatedAt:0 };
}

  s.player.xp = Math.max(0, Math.floor(Number(p.xp) || 0));

    const done = {}, lite = {};

      for (const k of Object.keys(h.done)) if (/^\d{4}-\d{2}-\d{2}$/.test(k) && h.done[k]) done[k] = Number(h.done[k]) === 2 ? 2 : 1;
    }

    if (h && h.lite && typeof h.lite === 'object') {

    }

      done: done,

      note: String((h && h.note) || '').trim().slice(0, MAX_NOTE),
      identity: String((h && h.identity) || '').trim().slice(0, MAX_ID),

    tier: Math.min(TIERS.length, Math.max(1, Math.floor(Number(r.tier) || 1))), title: String(r.title || '').slice(0, 30),
    xp: Math.max(0, Math.floor(Number(r.xp) || 0)), text: String(r.text || '').slice(0, 160),

    : Math.max(0, Math.floor(Number(raw.savers) || 0));

  for (const t of TIERS) if (typeof rt[t.n] === 'string' && rt[t.n].trim()) s.rewardText[t.n] = rt[t.n].trim().slice(0, 160);

  const seenWk = {};

    .filter(r => r && /^\d{4}-\d{2}-\d{2}$/.test(r.week) && !seenWk[r.week] && (seenWk[r.week] = true))
    .slice(0, 156)
    .map(r => ({
      week: r.week, win: String(r.win || '').slice(0, MAX_REF), hard: String(r.hard || '').slice(0, MAX_REF), focus: String(r.focus || '').slice(0, MAX_REF),

/* ============ storage: 3 protected copies + safety copies ============ */
// Every save goes to THREE separate storage areas (IndexedDB, localStorage, Cache Storage). Each copy carries a
// fingerprint, so a damaged copy is detected and the app falls back to a good one. The app never writes an
// empty state over data it could not read, and it keeps daily safety copies it can restore from by itself.
let S = defaultState();

let dbPromise = null;

function makeRec(state) {

// Reads one stored copy. Returns null (nothing there), {bad:true} (damaged) or {state, upd, app}.

    if (typeof x === 'string') x = JSON.parse(x);
    if (x && x.fmt === 2 && typeof x.data === 'string') {
      if (sum53(x.data) !== x.sum) return {bad:true};
      const st = JSON.parse(x.data);
      if (!validState(st)) return {bad:true};
      return {state: normalize(st), upd: Number(st.updatedAt) || 0, app: x.app || null};
    }
    if (validState(x)) return {state: normalize(x), upd: Number(x.updatedAt) || 0, app: null}; // copy written by version 1.5.x or older
  } catch (e) {}

function idb() {

    if (!window.indexedDB) return rej(new Error('IndexedDB unavailable'));
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => { r.result.createObjectStore(STORE); };
    r.onsuccess = () => {
      const db = r.result;
      db.onclose = () => { dbPromise = null; };
      db.onversionchange = () => { db.close(); dbPromise = null; };
      res(db);
    };
    r.onerror = () => rej(r.error);
    r.onblocked = () => rej(new Error('IndexedDB blocked'));
  });

}

/* ---- safety copies (invisible: used only for automatic recovery) ---- */
// 'snaps' = one copy per day (last 5). 'events' = copies taken at key moments (upgrade, quest claimed; last 5).
// Both lists are also mirrored into Cache Storage.

  catch (e) { return null; }   // null = could not read: never write over it

  if (kind === 'daily') lastSnapAt = at;

/* ---- loading: pick the best good copy, repair, or ask ---- */
// status: 'ok' | 'recovered' | 'fresh' (nothing stored anywhere) | 'damaged' | 'unreadable' (stored data could not be read)
async function loadAll() {
  let idbRaw, idbErr = false;
  for (let i = 0; i < 3; i++) {
    try { idbRaw = await withTimeout(idbGet(DB_KEY), 4000); idbErr = false; break; }
    catch (e) { idbErr = !!window.indexedDB; dbPromise = null; if (i < 2) await sleep(400); }
  }
  let lsRaw = null; try { lsRaw = localStorage.getItem(LS_KEY); } catch (e) {}
  let cRaw; try { cRaw = await withTimeout(cacheGet('state'), 4000); } catch (e) {}
  const cand = [unpack(idbRaw), unpack(lsRaw), unpack(cRaw)];
  const good = cand.filter(c => c && c.state).sort((a, b) => b.upd - a.upd);
  const anyBad = cand.some(c => c && c.bad);
  const snaps = await readSnapshots();
  if (good.length) {
    const best = good[0];
    // Progress can only go up by itself (XP and rewards never shrink unless you erase or restore, and both of those
    // reset the safety copies). A safety copy with more progress than the live data means something went wrong.
    const lost = snaps
      .filter(s => s.state.player.xp > best.state.player.xp || s.state.rewards.length > best.state.rewards.length)
      .sort((a, b) => (b.state.player.xp - a.state.player.xp) || (b.at - a.at))[0];
    if (lost) return {state:lost.state, status:'recovered', app:lost.app};
    return {state:best.state, status:'ok', app:best.app};
  }
  if (snaps.length) {
    const s = snaps.sort((a, b) => b.at - a.at)[0];
    return {state:s.state, status:'recovered', app:s.app};
  }
  if (anyBad) return {state:defaultState(), status:'damaged'};
  if (idbErr) return {state:defaultState(), status:'unreadable'};
  return {state:defaultState(), status:'fresh'};
}

async function askPersist() {
  try {
    if (navigator.storage && navigator.storage.persisted) {
      if (await navigator.storage.persisted()) { persistState = 'granted'; return; }
      if (navigator.storage.persist) persistState = (await navigator.storage.persist()) ? 'granted' : 'denied';
      else persistState = 'unsupported';
    } else persistState = 'unsupported';
  } catch (e) { persistState = 'unsupported'; }
  if (ui.tab === 'system' && !ui.rescue) render();
}

/* ============ game logic ============ */
// Flexible habits: habit.days lists the weekdays (0 = Monday ... 6 = Sunday) the habit is followed on. [] = every day.
// A day that is not on the schedule is a rest day: it is hidden, it never breaks a streak and it is never "missed".
// A rest day that was still marked done (for example from before the habit became flexible) keeps counting as done.

function daysLabel(days) {

// A rest day (flexible habit) that is not done is simply skipped.

/* ---- Today ring ---- */

// The list follows the order of S.habits, so it always matches the order you chose with "Arrange habits".

}
function dayWord(k) {
  const yk = dkey(addDays(new Date(), -1));
  return k === yk ? 'yesterday' : parseKey(k).toLocaleDateString(undefined, {weekday:'long'});
}
function nmtText(h, n) {
  const tail = h.mini ? 'Your 2-minute version counts: ' + h.mini + '.' : 'Do a small version. Showing up beats perfect.';
  return n.twice
    ? 'You missed ' + dayWord(n.key) + ' and the day before. A new run starts with one done day, so make today that day. ' + tail
    : 'You missed ' + dayWord(n.key) + '. One miss is an accident, two is the start of a new habit. Do it today. ' + tail;
}

/* ---- Weekly reflection ---- */
const weekKey = d => dkey(addDays(d, -wdOf(d)));
// Days, done days and saver days of every habit in the week that starts on Monday key wk (future days are left out).
function weekStats(wk) {
  const tk = dkey(new Date()), mon = parseKey(wk);
  const rows = S.habits.map(h => {
    let due = 0, done = 0, saved = 0;
    for (let i = 0; i < 7; i++) {
      const d = addDays(mon, i), k = dkey(d);
      if (k > tk) break;
      if (k < h.created && !h.done[k]) continue;
      const v = h.done[k];
      if (v === 1) { due++; done++; }
      else if (v === 2) saved++;
      else if (isSched(h, d)) due++;
    }
    return {h: h, due: due, done: done, saved: saved};
  });
  const due = rows.reduce((n, r) => n + r.due, 0), done = rows.reduce((n, r) => n + r.done, 0);
  return {
    rows: rows, due: due, done: done, rate: due ? Math.round(done / due * 100) : null,
    perfect: rows.filter(r => r.due > 0 && r.done === r.due).map(r => r.h.name)
  };
}
// Reflection is offered from Sunday (this week) until Wednesday (last week), if not done yet.
function reflectDueWeek() {
  if (!S.habits.length) return null;
  const t = new Date(), wd = wdOf(t);
  const wk = wd === 6 ? weekKey(t) : wd <= 2 ? weekKey(addDays(t, -7)) : null;
  if (!wk || S.reflections.some(r => r.week === wk)) return null;
  return weekStats(wk).due > 0 ? wk : null;
}
// The focus chosen in the latest reflection, shown on the Today card for about a week.
function currentFocus() {
  const r = S.reflections[0];
  return r && r.focus && r.week >= weekKey(addDays(new Date(), -7)) ? r.focus : '';
}
const weekRange = wk => {
  const m = parseKey(wk), f = d => d.toLocaleDateString(undefined, {day:'numeric', month:'short'});
  return f(m) + ' – ' + f(addDays(m, 6));
};

// Backup reminder: counts edits since the last backup, and reacts to big moments (quest claimed, habit added).
function backupInfo() {
  if (!meaningful(S)) return {due:false};
  const ch = S.changes || 0;
  let days = null;
  if (S.lastBackup) { const t = new Date(S.lastBackup).getTime(); if (!isNaN(t)) days = Math.max(0, Math.floor((Date.now() - t) / 86400000)); }
  const ago = days === null ? 'never' : days === 0 ? 'today' : days === 1 ? 'yesterday' : days + ' days ago';
  let due = false, msg = '';
  if (days === null) { due = true; msg = 'You have never saved a backup. Save one now so your progress is safe.'; }
  else if (ch > 0 && S.bigMoment) { due = true; msg = 'Big moment recorded. Save a backup now to lock in your progress.'; }
  else if (ch >= BACKUP_CHANGES || (ch > 0 && days >= BACKUP_DAYS)) {
    due = true; msg = ch + ' change' + (ch === 1 ? '' : 's') + ' since your last backup (' + ago + '). Save one so your progress is safe.';
  }
  return {due:due, msg:msg, changes:ch, days:days, ago:ago};
}

/* ============ UI state + render ============ */
const TABS = ['habits', 'vault', 'records', 'system'];
const ui = { tab: 'habits', day: dkey(new Date()), rec: null, rescue: null, pend: null };  // rescue: null | 'fresh' | 'damaged' | 'unreadable'

function renderNav() {
  document.querySelectorAll('.tab').forEach(t => {
    const on = t.dataset.tab === ui.tab;
    t.classList.toggle('on', on);
    if (on) t.setAttribute('aria-current', 'page'); else t.removeAttribute('aria-current');
  });
  $('.tabs .in').style.setProperty('--i', String(TABS.indexOf(ui.tab)));
}
function renderView() {
  const now = new Date();
  $('#today-label').innerHTML = esc(now.toLocaleDateString(undefined, {weekday:'short'})) + '<br>' + esc(now.toLocaleDateString(undefined, {day:'2-digit', month:'short'}));
  $('#view').innerHTML = ui.rescue ? viewRescue() : ui.tab === 'habits' ? viewHabits() : ui.tab === 'vault' ? viewVault() : ui.tab === 'records' ? viewRecords() : viewSystem();
}
function render() { document.body.classList.toggle('rescuing', !!ui.rescue); renderNav(); renderView(); }

// Smooth fade/slide for the content area.
function playIn(dx) {
  const v = $('#view');
  v.style.setProperty('--dx', dx + 'px');
  v.classList.remove('v-in', 'v-out');
  void v.offsetWidth;
  v.classList.add('v-in');
}
const reduceMotion = () => !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
let swapTimer;
function switchTab(name) {
  if (TABS.indexOf(name) < 0 || ui.rescue) return;
  if (name === ui.tab) { window.scrollTo(0, 0); return; }
  const dir = TABS.indexOf(name) > TABS.indexOf(ui.tab) ? 1 : -1;
  ui.tab = name;
  renderNav();
  if (reduceMotion()) { renderView(); window.scrollTo(0, 0); return; }
  const v = $('#view');
  v.style.setProperty('--dx', (dir * 28) + 'px');
  v.classList.remove('v-in');
  v.classList.add('v-out');
  clearTimeout(swapTimer);
  swapTimer = setTimeout(() => { renderView(); window.scrollTo(0, 0); playIn(dir * 28); }, 130);
}

  else if (done === 0) {

function habitCard(h) {
  const tk = dkey(new Date()), yk = dkey(addDays(new Date(), -1));
  const cur = currentStreak(h), cl = claimableCount(h), next = TIERS[h.claimed];
  const boxBtn = d => {
    const k = dkey(d), v = h.done[k], done = v === 1, saved = v === 2, future = k > tk, open = (k === tk || k === yk);
    const lite = done && !!(h.lite && h.lite[k]);
    const cls = ['box'];
    if (done) cls.push('done');
    if (lite) cls.push('lite');
    if (saved) cls.push('saved');
    if (k === tk) cls.push('today');
    if (future) cls.push('future');
    if (open) cls.push('open');
    if (k < h.created && !v) cls.push('pre');
    const label = (open ? (done ? 'Unmark ' : saved ? 'Return streak saver for ' : 'Mark ') : '') + d.toDateString() + (lite ? ', done with the 2-minute version' : done ? ', done' : saved ? ', protected by a streak saver' : '');
    return `<button class="${cls.join(' ')}" data-action="tick" data-id="${esc(h.id)}" data-day="${k}" aria-label="${esc(label)}" aria-pressed="${done}">${done ? CHECK + (lite ? '<b class="mb" aria-hidden="true">2</b>' : '') : saved ? SHIELD_CK : '<span>' + d.getDate() + '</span>'}</button>`;
  };
  const wk = weekDays();
  // Flexible habit: rest days are not drawn. (A rest day that is already marked stays visible so it can still be unmarked.)
  const flex = !!(h.days && h.days.length);
  const vis = wk.map((d, i) => ({d: d, i: i})).filter(x => isSched(h, x.d) || h.done[dkey(x.d)]);
  const boxes = vis.map(x => `<div class="col"><span class="dl">${DAY_LETTERS[x.i]}</span>${boxBtn(x.d)}</div>`).join('');
  const rest = (!isSched(h, new Date()) && !h.done[tk]) ? `<div class="rest">Rest day today · next: ${esc(nextSchedName(h))}</div>` : '';
  // On a Monday, yesterday (Sunday) belongs to last week's row, so it gets its own small line.
  const yd = addDays(new Date(), -1);
  const yrow = (wk.some(d => dkey(d) === yk) || !(isSched(h, yd) || h.done[yk])) ? '' : `<div class="yrow"><span class="dl">Yesterday · ${esc(yd.toLocaleDateString(undefined, {weekday:'short', day:'numeric', month:'short'}))}</span>${boxBtn(yd)}</div>`;
  const nm = nmtInfo(h);
  const nmt = nm ? `<div class="nmt"><b>Never miss twice</b>${esc(nmtText(h, nm))}</div>` : '';
  let quest;
  if (cl > 0) {
    quest = `<button class="btn claim" data-action="claim" data-id="${esc(h.id)}">Quest complete · Claim reward</button>`;
  } else if (next) {
    const shown = Math.min(cur, next.days), p = Math.round(shown / next.days * 100);
    quest = `<div class="q-row"><span class="q-lbl">Next quest · Lv.${next.n} · ${next.days}-day streak</span><span class="q-val">${shown}/${next.days}</span></div><div class="bar"><i style="width:${p}%"></i></div>`;
  } else {
    quest = `<div class="q-row"><span class="q-lbl">All quests cleared · Legend</span></div>`;
  }
  const pips = TIERS.map(t => `<i class="pip ${t.n <= h.claimed ? 'on' : ''}"></i>`).join('');
  return `
  <section class="panel habit">
    <div class="h-head">
      <button class="h-name" data-action="edit" data-id="${esc(h.id)}" aria-label="Edit ${esc(h.name)}"><span>${esc(h.name)}</span>${PENCIL}</button>
      <button class="h-more" data-action="extras" data-id="${esc(h.id)}" aria-label="Options for ${esc(h.name)}: identity, 2-minute habit, note, flexible days">${DOTS}</button>
      <div class="streak"><small>STREAK</small><b>${cur}</b></div>
    </div>
    ${extrasHtml(h)}${nmt}
    <div class="week${flex ? ' flex' : ''}"${flex ? ` style="grid-template-columns:repeat(${vis.length},minmax(0,1fr))"` : ''}>${boxes}</div>${rest}${yrow}
    <div class="quest">${quest}<div class="pips">${pips}<span>${h.claimed}/${TIERS.length} cleared</span></div></div>
  </section>`;
}

/* ---- records: full history of each habit ---- */
function habitStats(h) {
  const keys = Object.keys(h.done).sort();
  const nDone = keys.filter(k => h.done[k] === 1).length;
  const nSaved = keys.length - nDone;
  const nLite = keys.filter(k => h.done[k] === 1 && h.lite && h.lite[k]).length;
  const startKey = keys.length && keys[0] < h.created ? keys[0] : h.created;
  const today = new Date(), tk = dkey(today);
  const endKey = h.done[tk] ? tk : dkey(addDays(today, -1));
  // Only days that count: done days, and scheduled days that were not done. Rest days are left out.
  // bounce = a done day straight after a missed scheduled day (never missed twice). twice = a miss straight after a miss.
  let tracked = 0, missed = 0, bounce = 0, twice = 0, prevMiss = false;
  for (let d = parseKey(startKey); dkey(d) <= endKey; d = addDays(d, 1)) {
    const v = h.done[dkey(d)];
    if (v) {
      tracked++;
      if (v === 1 && prevMiss) bounce++;
      prevMiss = false;
    } else if (isSched(h, d)) {
      tracked++; missed++;
      if (prevMiss) twice++;
      prevMiss = true;
    }
  }
  return {
    nDone: nDone, nSaved: nSaved, nLite: nLite, startKey: startKey, endKey: endKey, tracked: tracked,
    missed: missed, bounce: bounce, twice: twice,
    rate: tracked ? Math.round(nDone / tracked * 100) : null
  };
}
function monthPanel(h, y, m, st, tk) {
  const days = new Date(y, m + 1, 0).getDate(), offset = (new Date(y, m, 1).getDay() + 6) % 7;
  let cells = '', nDone = 0, tracked = 0;
  for (let i = 0; i < offset; i++) cells += '<i class="c x"></i>';
  for (let d = 1; d <= days; d++) {
    const k = y + '-' + pad(m + 1) + '-' + pad(d), v = h.done[k], inRange = k >= st.startKey && k <= st.endKey, sch = isSchedKey(h, k);
    let cls = 'c', inner = d;
    if (v === 1) { cls += ' d'; nDone++; if (h.lite && h.lite[k]) cls += ' l'; }
    else if (v === 2) { cls += ' s'; inner = SHIELD; }
    else if (inRange && sch) cls += ' m';
    else if (inRange) cls += ' r';
    else cls += ' o';
    if (inRange && (v || sch)) tracked++;
    if (k === tk) cls += ' t';
    cells += `<span class="${cls}">${inner}</span>`;
  }
  const pct = tracked ? ' · ' + Math.round(nDone / tracked * 100) + '%' : '';
  const name = new Date(y, m, 1).toLocaleDateString(undefined, {month:'long', year:'numeric'});
  return `<section class="panel"><div class="m-head"><h4>${esc(name)}</h4><span class="tag">${nDone} done${pct}</span></div><div class="m-grid">${DAY_LETTERS.split('').map(l => `<span class="wd">${l}</span>`).join('')}${cells}</div></section>`;
}
function viewRecords() {
  let html = '<h2 class="sec">Records</h2>';
  if (!S.habits.length) {
    return html + '<section class="panel empty"><div class="tag">Habsys</div><h3>No history yet</h3><p>Add a habit in the Habits tab. Every day you complete will be recorded here.</p></section>';
  }
  // weekly reflection
  const thisWk = weekKey(new Date()), lastWk = weekKey(addDays(new Date(), -7));
  const has = wk => S.reflections.some(r => r.week === wk);
  html += `<section class="panel"><p class="note">Once a week, look back: what worked, what got in the way, and the one thing you will focus on next. Reflection turns streaks into learning.</p>
    <div class="stack">

      <button class="btn ghost block" data-action="reflect" data-week="${lastWk}">${has(lastWk) ? 'Edit last week' : 'Reflect on last week'}</button>
    </div></section>`;
  if (S.reflections.length) {
    html += '<div class="log" style="margin-top:12px">' + S.reflections.slice(0, 12).map(r => `

        ${r.hard ? `<p class="rl"><b>Got in the way:</b> ${esc(r.hard)}</p>` : ''}
        ${r.focus ? `<p class="rl"><b>Focus:</b> ${esc(r.focus)}</p>` : ''}
      </div>`).join('') + '</div>';
  }
  html += '<h2 class="sec">Habit history</h2>';
  const h = findHabit(ui.rec) || S.habits[0];
  ui.rec = h.id;
  const st = habitStats(h), tk = dkey(new Date());
  html += '<div class="chips">' + S.habits.map(x => `<button class="chip ${x.id === h.id ? 'on' : ''}" data-action="rec" data-id="${esc(x.id)}">${esc(x.name)}</button>`).join('') + '</div>';
  const tile = (l, v, c) => `<div class="stat"><small>${l}</small><b${c ? ' class="' + c + '"' : ''}>${v}</b></div>`;
  html += `<section class="panel"><div class="tag" style="margin-bottom:12px">${esc(h.name)}</div>${extrasHtml(h)}<div class="stats">`
    + tile('Days done', st.nDone)
    + tile('Success rate', st.rate === null ? '—' : st.rate + '%')
    + tile('Current streak', currentStreak(h))
    + tile('Longest streak', longestStreak(h))
    + tile('Missed days', st.missed)
    + tile('Bounce-backs', st.bounce)
    + tile('Missed twice', st.twice)
    + tile('Savers used', st.nSaved)
    + (st.nLite ? tile('2-minute days', st.nLite) : '')
    + tile('Quests cleared', h.claimed + ' / ' + TIERS.length)
    + tile('Tracking since', esc(fmtKey(st.startKey)), 'sm')
    + '</div></section>';
  const rw = S.rewards.filter(r => r.habitId === h.id);
  html += '<h2 class="sec">Quests cleared</h2>';
  html += rw.length
    ? '<section class="panel">' + rw.map(r => `<div class="kv"><span>Lv.${r.tier} · ${esc(r.title)}</span><b>${esc(fmtDate(r.at))} · +${r.xp} XP</b></div>`).join('') + '</section>'
    : '<section class="panel empty"><p>No quests cleared on this habit yet.</p></section>';
  html += '<h2 class="sec">Full history</h2><div class="legend">'
    + '<span><i style="background:linear-gradient(145deg,var(--blue2),var(--blue3))"></i>Done</span>'
    + (st.nLite ? '<span><i class="lgl"></i>2-minute day</span>' : '')
    + '<span><i style="border:1px solid var(--blue2);background:rgba(91,140,255,.18)"></i>Saver used</span>'
    + (h.days && h.days.length ? '<span><i style="border:1px dashed rgba(148,178,255,.55)"></i>Rest day</span>' : '')
    + '<span><i style="border:1px solid rgba(255,123,141,.6)"></i>Missed</span></div>';
  const sd = parseKey(st.startKey), now = new Date(), months = [];
  let y = sd.getFullYear(), m = sd.getMonth();
  while (y < now.getFullYear() || (y === now.getFullYear() && m <= now.getMonth())) { months.push([y, m]); if (++m > 11) { m = 0; y++; } }
  html += '<div class="months">' + months.reverse().map(p => monthPanel(h, p[0], p[1], st, tk)).join('') + '</div>';
  return html;
}

/* ============ modals + toast + celebrations ============ */
function showModal(inner, cls) {
  const o = $('#overlay');
  o.innerHTML = `<div class="panel win${cls ? ' ' + cls : ''}">${inner}</div>`;
  o.classList.add('show');
  const f = o.querySelector('input,textarea');
  if (f) setTimeout(() => { try { f.focus(); } catch (e) {} }, 60);
}
function closeModal() { const o = $('#overlay'); o.classList.remove('show'); o.innerHTML = ''; }
let toastTimer;
function toast(msg) {
  const t = $('#toast'); t.firstElementChild.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}
// A short burst of confetti. Skipped when the device asks for reduced motion.
function confetti() {
  if (reduceMotion()) return;
  const cols = ['#5b8cff', '#ff6b5e', '#25c795', '#f5a524', '#a46bff', '#3db8f5', '#ff5f9e', '#ffdd85'];
  let h = '';
  for (let i = 0; i < 44; i++) {
    const x = Math.random() * 100, dx = Math.round(Math.random() * 160 - 80), r = Math.round(Math.random() * 720 - 360);
    const t = (1.8 + Math.random() * 1.4).toFixed(2), dl = (Math.random() * .35).toFixed(2);
    h += `<i style="left:${x.toFixed(1)}%;background:${cols[i % cols.length]};--dx:${dx}px;--r:${r}deg;animation-duration:${t}s;animation-delay:${dl}s"></i>`;
  }
  const w = document.createElement('div');
  w.className = 'fx'; w.setAttribute('aria-hidden', 'true'); w.innerHTML = h;
  document.body.appendChild(w);
  setTimeout(() => w.remove(), 3800);
}
// Called after a habit is marked done. Shows the celebration that fits: day complete, streak milestone, or a comeback.
// If another popup is open (a quest to claim), it waits and runs when that popup is closed.
function celebrate(id, k, bounced) {
  const h = findHabit(id); if (!h) return;
  if ($('#overlay').classList.contains('show')) { ui.pend = {id: id, k: k, bounced: bounced, t: Date.now()}; return; }
  ui.pend = null;
  const tk = dkey(new Date()), cur = currentStreak(h);
  const ms = MILESTONES.indexOf(cur) >= 0 && !S.cel['m:' + h.id + ':' + cur] ? cur : 0;
  const all = k === tk && S.allDay !== tk && allDueDone();
  if (!ms && !all) { if (bounced) toast('Back on track. You never missed twice.'); return; }
  if (ms) S.cel['m:' + h.id + ':' + ms] = 1;
  if (all) S.allDay = tk;
  const ks = Object.keys(S.cel);
  for (let i = 0; i < ks.length - 400; i++) delete S.cel[ks[i]];
  save({noCount:true});
  const votes = S.habits.filter(x => x.identity && x.done[tk] === 1).map(x => esc(x.identity));
  let body = '';
  if (all) body += `<div class="reward"><b>Today's votes</b>${votes.length ? votes.join('<br>') : 'Every habit done. This is how days become a life.'}</div>`;
  if (ms) body += `<div class="reward"><b>${ms}-day streak</b>${esc(h.name)}: ${ms} real days in a row. ${h.identity ? esc(h.identity) + '. You are proving it.' : 'This is no longer luck. It is who you are.'}</div>`;
  if (bounced) body += `<div class="reward"><b>Never missed twice</b>You came straight back after a miss. That is the skill that matters most.</div>`;
  showModal(`
    <div class="cel-ic">${CHECK}</div>
    <h3>${all ? 'Day complete' : ms + '-day streak'}</h3>
    <p class="sub">${all ? 'All ' + dueToday().length + ' habits done' : esc(h.name)}</p>
    ${body}
    <div class="actions"><button class="btn" data-action="close">Keep going</button></div>`, 'cel');
  confetti();
}

function saveReflect(wk) {
  const g = id => ($(id).value || '').trim().slice(0, MAX_REF);
  const st = weekStats(wk);
  const rec = {week: wk, win: g('#rwin'), hard: g('#rhard'), focus: g('#rfocus'), rate: st.rate || 0, at: new Date().toISOString()};
  S.reflections = S.reflections.filter(r => r.week !== wk);
  if (rec.win || rec.hard || rec.focus) S.reflections.push(rec);
  S.reflections.sort((a, b) => a.week < b.week ? 1 : -1);
  S.reflections = S.reflections.slice(0, 156);
  save(); closeModal(); render();
  toast(rec.win || rec.hard || rec.focus ? 'Reflection saved.' : 'Reflection cleared.');
}
function confirmBox(title, text, action, label, data) {
  showModal(`
    <div class="wtag"><span class="tag">Habsys</span></div>
    <h3>${esc(title)}</h3>
    <p>${text}</p>
    <div class="actions two"><button class="btn danger" data-action="${action}" ${data || ''}>${esc(label)}</button><button class="btn ghost" data-action="close">Cancel</button></div>`);
}
// Shown when tapping an empty box that has more than one possible answer:
// the habit has a 2-minute version, and/or a streak saver can be used for yesterday.
function saverOkFor(h, k) {
  return k === dkey(addDays(new Date(), -1)) && isSchedKey(h, k) && S.savers > 0 && chainBefore(h, k) > 0;
}
function openDayChoice(id, k) {
  const h = findHabit(id); if (!h) return;
  const isY = k !== dkey(new Date());
  const saver = saverOkFor(h, k);
  const n = chainBefore(h, k);
  showModal(`
    <div class="wtag"><span class="tag">Habsys</span></div>
    <h3>${isY ? 'Yesterday' : 'Today'}</h3>
    <p class="sub">${esc(h.name)}</p>
    <p>${saver ? `You have a <b>${n}-day streak</b> running. Did you complete this habit yesterday?` : `What did you do ${isY ? 'yesterday' : 'today'}?`}</p>
    ${h.mini ? `<div class="reward"><b>2-minute version</b>${esc(h.mini)}<br>It counts as a done day, so your streak continues.</div>` : ''}
    ${saver ? `<div class="reward"><b>Streak savers</b>You have ${S.savers}. Using one keeps your streak alive but does not add a day to it.</div>` : ''}
    <div class="actions">
      <button class="btn" data-action="markdone" data-id="${esc(id)}" data-day="${esc(k)}">${saver ? 'I did it: mark done' : 'I did the full habit'}</button>
      ${h.mini ? `<button class="btn ghost" data-action="marklite" data-id="${esc(id)}" data-day="${esc(k)}">I did the 2-minute version</button>` : ''}
      ${saver ? `<button class="btn ghost" data-action="usesaver" data-id="${esc(id)}" data-day="${esc(k)}">I missed it: use a streak saver</button>` : ''}
      <button class="btn ghost" data-action="close">Cancel</button>
    </div>`);
}
function openInfo() {
  const L = levelOf(S.player.xp), cur = rankOf(L), cost = n => xpFor(n) - xpFor(n - 1);
  const need = xpFor(L + 1) - S.player.xp;
  const ranks = RANKS.map((r, i) => {
    const nx = RANKS[i + 1];
    return `<div class="kv ${r.l === cur ? 'here' : ''}"><span>Rank ${r.l}${r.l === cur ? ' · you' : ''}</span><b>${nx ? 'Level ' + r.min + ' to ' + (nx.min - 1) : 'Level ' + r.min + ' and above'}</b></div>`;
  }).join('');
  const marks = [2, 10, 25, 50, 100, 150, 200, 365].map(n => `<div class="kv"><span>Level ${n}</span><b>${xpFor(n).toLocaleString()} XP in total</b></div>`).join('');
  showModal(`
    <div class="wtag"><span class="tag">Habsys</span></div>
    <h3>Levels &amp; ranks</h3>
    <p class="sub">How you grow</p>
    <div class="reward"><b>Your status</b>Level ${L} · Rank ${cur}<br>${S.player.xp.toLocaleString()} XP · ${need.toLocaleString()} XP to Level ${L + 1}</div>
    <p>XP comes only from clearing quests, which means keeping one habit going for a streak. Daily ticks give no XP, so every level is proof of real consistency.</p>
    <p>Levels get harder as you climb. Level 1 to 2 takes ${cost(2)} XP, and every level after that needs ${LV_STEP} XP more than the one before. Level 49 to 50 takes ${cost(50)} XP, and Level 364 to 365 takes ${cost(365)} XP. There is no maximum level.</p>
    <div class="mini">Ranks</div><div class="grp">${ranks}</div>
    <div class="mini">XP needed in total</div><div class="grp">${marks}</div>
    <p class="small">Streak savers are explained in the Vault tab.</p>
    <div class="actions"><button class="btn" data-action="close">Got it</button></div>`);
}

/* ============ backup / restore ============ */
// A backup file carries a fingerprint of its data. On restore the fingerprint is checked, so a damaged or
// half-copied file is rejected instead of overwriting good data.
const backupSumOk = j => !!j && typeof j.checksum === 'string' && sum53(JSON.stringify(j.data)) === j.checksum;
async function doBackup() {
  if (ui.rescue) return;
  const payload = {app:'habsys', backupVersion:2, appVersion:APP_VERSION, exportedAt:new Date().toISOString(), checksum:sum53(JSON.stringify(S)), data:S};
  const name = 'habsys-backup-' + dkey(new Date()) + '.json';
  const text = JSON.stringify(payload, null, 2);
  // Check the file we are about to hand over reads back correctly.
  try {
    const back = JSON.parse(text);
    if (!backupSumOk(back) || !validState(back.data)) throw new Error('bad');
  } catch (e) { toast('Backup failed its safety check. Nothing was saved. Try again.'); return; }
  let saved = false;
  try {
    const file = new File([text], name, {type:'application/json'});
    if (navigator.canShare && navigator.canShare({files:[file]}) && navigator.share) {
      await navigator.share({files:[file], title:'Habsys backup'});
      saved = true;
    }
  } catch (e) {
    if (e && e.name === 'AbortError') return; // user cancelled the share sheet
  }
  if (!saved) {
    const url = URL.createObjectURL(new Blob([text], {type:'application/json'}));
    const a = document.createElement('a'); a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    saved = true;
  }
  if (saved) {
    S.lastBackup = new Date().toISOString(); S.changes = 0; S.bigMoment = false;
    save({noCount:true}); toast('Backup created. Keep the file safe.'); render();
  }
}
let pendingRestore = null, pendingRestoreAt = null;
function handleRestoreFile(file) {
  if (!file) return;
  if (file.size > 5000000) { toast('That file is too large to be a Habsys backup.'); return; }
  const r = new FileReader();
  r.onload = () => {
    let j = null;
    try { j = JSON.parse(String(r.result)); } catch (e) {}
    if (!j || j.app !== 'habsys' || !validState(j.data)) { toast('That file is not a Habsys backup.'); return; }
    let verified = false;
    if (typeof j.checksum === 'string') {
      if (!backupSumOk(j)) { toast('This backup file is damaged, so it was not used. Your current data is untouched.'); return; }
      verified = true;
    }
    pendingRestore = normalize(j.data);
    pendingRestoreAt = (j.exportedAt && !isNaN(new Date(j.exportedAt))) ? String(j.exportedAt) : null;
    const n = pendingRestore.habits.length, xp = pendingRestore.player.xp;
    let txt = `This backup has <b>${n} habit${n === 1 ? '' : 's'}</b> and <b>${xp.toLocaleString()} XP</b>` + (j.exportedAt ? ` (saved ${esc(fmtDate(j.exportedAt))})` : '')
      + (ui.rescue ? '.' : `. It will <b>replace</b> what is on this device now.`)
      + (verified ? ' The file passed its integrity check.' : ' This is an older file without an integrity check.');
    if (!ui.rescue && xp < S.player.xp) {
      txt += `<br><br><b>Warning:</b> this backup has less progress than what is on this device now (${S.player.xp.toLocaleString()} XP). Restoring will lose the difference.`;
    }
    confirmBox('Restore backup?', txt, 'dorestore', 'Restore');
  };
  r.onerror = () => toast('Could not read that file.');
  r.readAsText(file);
}

/* ============ actions ============ */
function afterChange(id, before) {
  save(); render();
  const h = findHabit(id);
  if (h && claimableCount(h) > before) openClaim(id);
}
// lite = true: the day was done with the 2-minute version (still a real done day).
function markDone(id, k, lite) {
  const h = findHabit(id); if (!h) return;
  const tk = dkey(new Date()), yk = dkey(addDays(new Date(), -1));
  if ((k !== tk && k !== yk) || h.done[k]) return;
  const bounced = wasMissed(h, prevSchedKey(h, parseKey(k)));   // coming straight back after a miss
  const before = claimableCount(h);
  h.done[k] = 1;
  if (!h.lite) h.lite = {};
  if (lite) h.lite[k] = true; else delete h.lite[k];
  afterChange(id, before);
  if (lite) toast('2-minute version done. Streak kept alive.');
  celebrate(id, k, bounced);
}
function useSaver(id, k) {
  const h = findHabit(id); if (!h) return;
  const yk = dkey(addDays(new Date(), -1));
  if (k !== yk || h.done[k] || S.savers < 1 || !isSchedKey(h, k) || chainBefore(h, k) < 1) return;
  const before = claimableCount(h);
  h.done[k] = 2;
  S.savers -= 1;
  afterChange(id, before);
  toast('Streak saver used. Your streak is protected.');
}
function toggleDay(id, k) {
  const h = findHabit(id); if (!h) return;
  const tk = dkey(new Date()), yk = dkey(addDays(new Date(), -1));
  if (k !== tk && k !== yk) return;
  if (h.done[k] === 2) { // protected day: tapping again returns the saver
    delete h.done[k]; S.savers += 1; save(); render(); toast('Streak saver returned.'); return;
  }
  if (h.done[k]) { // done day (full or 2-minute): tapping again unmarks it
    const before = claimableCount(h);
    delete h.done[k];
    if (h.lite) delete h.lite[k];
    afterChange(id, before);
    return;
  }
  if (!isSchedKey(h, k)) return;   // rest day of a flexible habit: nothing to mark
  // Empty day: ask only when there is a real choice (a 2-minute version exists and/or a streak saver can be used).
  // A habit without either behaves exactly as before: one tap marks it done.
  if (h.mini || saverOkFor(h, k)) { openDayChoice(id, k); return; }
  markDone(id, k, false);
}
function startFresh() {
  closeModal();
  S = defaultState(); writesLocked = false; ui.rescue = null; ui.tab = 'habits';
  save({noCount:true}); render(); askPersist();
}

const actions = {
  tab: el => switchTab(el.dataset.tab),
  tick: el => toggleDay(el.dataset.id, el.dataset.day),
  rec: el => { ui.rec = el.dataset.id; renderView(); playIn(0); },
  info: openInfo,
  arrange: openArrange,
  moveup: el => moveHabit(el.dataset.id, -1),
  movedown: el => moveHabit(el.dataset.id, 1),
  markdone: el => { closeModal(); markDone(el.dataset.id, el.dataset.day, false); },
  marklite: el => { closeModal(); markDone(el.dataset.id, el.dataset.day, true); },
  usesaver: el => { closeModal(); useSaver(el.dataset.id, el.dataset.day); },
  add: () => { if (S.habits.length >= MAX_HABITS) return; openHabitForm(null); },
  edit: el => openHabitForm(el.dataset.id),
  extras: el => openExtras(el.dataset.id),
  xid: el => openIdentity(el.dataset.id),
  xmini: el => openMini(el.dataset.id),
  xnote: el => openNote(el.dataset.id),
  xdays: el => openDays(el.dataset.id),
  saveidentity: el => {
    const h = findHabit(el.dataset.id); if (!h) return;
    h.identity = ($('#hid').value || '').trim().slice(0, MAX_ID);
    save(); closeModal(); render();
    toast(h.identity ? 'Identity saved. Every done day is a vote for it.' : 'Identity removed.');
  },
  savemini: el => {
    const h = findHabit(el.dataset.id); if (!h) return;
    h.mini = ($('#hmini').value || '').trim().slice(0, MAX_MINI);
    save(); closeModal(); render();
  },
  savenote: el => {
    const h = findHabit(el.dataset.id); if (!h) return;
    h.note = ($('#hnote').value || '').trim().slice(0, MAX_NOTE);
    save(); closeModal(); render();
  },
  toggleday: el => { const on = !el.classList.contains('on'); el.classList.toggle('on', on); el.setAttribute('aria-pressed', String(on)); },
  savedays: el => {
    const a = Array.from(document.querySelectorAll('.dchip.on')).map(c => Number(c.dataset.d));
    if (!a.length) { toast('Tap at least one day, or choose Make it every day.'); return; }
    setDays(el.dataset.id, a);
  },
  alldays: el => setDays(el.dataset.id, []),
  reflect: el => openReflect(el.dataset.week),
  savereflect: el => saveReflect(el.dataset.week),
  close: closeModal,
  savehabit: el => {
    const name = ($('#hname').value || '').trim().slice(0, 30);
    if (!name) { toast('Give your habit a name.'); return; }
    const id = el.dataset.id;
    if (id) { const h = findHabit(id); if (h) h.name = name; }
    else {
      if (S.habits.length >= MAX_HABITS) return;
      const picked = Array.from(document.querySelectorAll('#overlay .dchip.on')).map(c => Number(c.dataset.d)).sort((a, b) => a - b);
      const idEl = $('#hid'), identity = idEl ? (idEl.value || '').trim().slice(0, MAX_ID) : '';
      S.habits.push({id: uid(), name, created: dkey(new Date()), done: {}, lite: {}, mini: '', note: '', identity: identity, days: picked.length === 7 ? [] : picked, claimed: 0});
      S.bigMoment = true; askPersist();
    }
    save(); closeModal(); render();
  },
  delask: el => { const h = findHabit(el.dataset.id); if (h) confirmBox('Delete habit?', `<b>${esc(h.name)}</b> and its history will be removed. Rewards and XP you already earned stay.`, 'delete', 'Delete', `data-id="${esc(h.id)}"`); },
  delete: el => { S.habits = S.habits.filter(h => h.id !== el.dataset.id); save(); closeModal(); render(); },
  claim: el => openClaim(el.dataset.id),
  doclaim: el => doClaim(el.dataset.id),
  afterclaim: el => {
    closeModal();
    const h = findHabit(el.dataset.id);
    if (h && claimableCount(h) > 0) { openClaim(h.id); return; }
    const p = ui.pend; ui.pend = null;   // a celebration that was waiting behind the quest popup (kept for 10 minutes)
    if (p && Date.now() - p.t < 600000) celebrate(p.id, p.k, p.bounced);
  },
  editreward: el => openRewardEdit(Number(el.dataset.tier)),
  saveReward: el => { const v = ($('#rtext').value || '').trim().slice(0, 160); const n = Number(el.dataset.tier); if (v) S.rewardText[n] = v; else delete S.rewardText[n]; save(); closeModal(); render(); },
  resetReward: el => { delete S.rewardText[Number(el.dataset.tier)]; save(); closeModal(); render(); },
  enjoy: el => { const r = S.rewards.find(x => x.id === el.dataset.id); if (r) { r.enjoyed = !r.enjoyed; save(); render(); } },
  backup: doBackup,
  restore: () => { const f = $('#restoreFile'); f.value = ''; f.click(); },
  dorestore: () => {
    if (!pendingRestore) return;
    S = pendingRestore; pendingRestore = null;
    S.changes = 0; S.bigMoment = false; S.lastBackup = pendingRestoreAt || new Date().toISOString();
    writesLocked = false; ui.rescue = null; ui.tab = 'habits';
    clearSnaps();                 // safety copies of the old data must not undo this restore
    save({noCount:true});
    snapshot('daily');
    closeModal(); render(); toast('Backup restored.'); askPersist();
  },
  retry: () => { boot(); },
  askfresh: () => confirmBox('Start fresh?', 'The damaged copy on this device will be replaced by an empty start. If you have a backup file, use Restore instead.', 'startfresh', 'Start fresh'),
  startfresh: startFresh,
  erase: () => confirmBox('Erase everything?', 'All habits, XP and rewards on this device will be deleted, including the app\'s automatic safety copies. <b>Save a backup first</b> if you may want them back.', 'doerase', 'Erase all'),
  doerase: () => { S = defaultState(); clearSnaps(); save({noCount:true}); closeModal(); ui.tab = 'habits'; render(); toast('All data erased.'); }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) {
    if (e.target.id === 'overlay') closeModal();
    return;
  }
  const fn = actions[el.dataset.action];
  if (fn) fn(el);
});
document.addEventListener('change', e => {
  if (e.target.id === 'pname') { S.player.name = (e.target.value || '').trim().slice(0, 24) || 'Player'; save(); toast('Name saved.'); }
  if (e.target.id === 'restoreFile') handleRestoreFile(e.target.files && e.target.files[0]);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if (e.key === 'Enter' && e.target.id === 'hname') { const b = document.querySelector('[data-action="savehabit"]'); if (b) b.click(); }
});

/* new day / back to app => refresh */
function refreshIfNewDay() {
  const k = dkey(new Date());
  if (k !== ui.day) { ui.day = k; if (!ui.rescue) { snapshot('daily'); } render(); }
}
// If another window of the app saved newer data, take it instead of overwriting it with old data.
function adoptNewer() {
  if (ui.rescue || writesLocked) return;
  try { const u = unpack(localStorage.getItem(LS_KEY)); if (u && u.state && u.upd > S.updatedAt) S = u.state; } catch (e) {}
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { flush(); return; }
  adoptNewer(); refreshIfNewDay();
  if (!$('#overlay').classList.contains('show')) render();   // do not redraw underneath an open popup
});
window.addEventListener('pagehide', flush);
setInterval(refreshIfNewDay, 60000);

/* ============ start ============ */
async function boot() {
  const r = await loadAll();
  S = r.state;
  if (r.status === 'ok' || r.status === 'recovered') {
    writesLocked = false; ui.rescue = null;
    if (r.status === 'ok' && r.app !== APP_VERSION) snapshot('upgrade');  // copy of the data exactly as the older version left it
    save({noCount:true});   // writes all three copies, which also repairs any damaged one
    snapshot('daily');
    askPersist();
    render(); playIn(0);
    if (r.status === 'recovered') toast('Your progress was restored from a safety copy.');
  } else {
    writesLocked = true; ui.rescue = r.status;   // 'fresh' | 'damaged' | 'unreadable': nothing is written until the person decides
    render(); playIn(0);
  }
}
boot();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
})();
</script>
