# Habsys Android APK (3.2.0). Builds an installable APK from the web app files. Free for public repositories.
# Run it by hand: GitHub repo > Actions > "Habsys Android APK" > Run workflow. The APK appears under "Artifacts" when it is done (about 5 to 8 minutes).
name: Habsys Android APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Collect the web app files
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest sw.js icon-180.png icon-192.png icon-512.png www/
      - name: Install Capacitor
        run: npm install --no-audit --no-fund
      - name: Create the Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Habsys-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
